<!DOCTYPE html>
<html lang="vi">
<head>
<script>
    if (localStorage.getItem('qp_theme') === 'dark' || 
        (!('qp_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizPoint Studio - Luyện Đề Ôn Tập Trực Tuyến</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            900: '#064e3b',
                        }
                    },
                    animation: {
                        'bounce-slow': 'bounce 3s infinite',
                        'pulse-slow': 'pulse 5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 5s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-8px)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap');
        body { 
            font-family: 'Be Vietnam Pro', sans-serif; 
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        html, body, .custom-scrollbar {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        html::-webkit-scrollbar, body::-webkit-scrollbar, .custom-scrollbar::-webkit-scrollbar { 
            display: none;
            width: 0 !important;
            height: 0 !important;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        @keyframes fadeIn { from { opacity: 0.96; transform: translate3d(0, 2px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
        .animate-enter { animation: fadeIn 0.08s ease-out; }
        @keyframes auroraDrift {
            0%, 100% { transform: translate3d(0, 0, 0) scale3d(1, 1, 1); }
            50% { transform: translate3d(18px, -12px, 0) scale3d(1.08, 1.08, 1); }
        }
        @keyframes titleShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes qpParticleRise {
            0%, 100% { transform: translate3d(0, 0, 0) scale3d(0.9, 0.9, 1); opacity: 0.25; }
            50% { transform: translate3d(6px, -20px, 0) scale3d(1.18, 1.18, 1); opacity: 0.72; }
        }
        @keyframes qpOrbitSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes qpStaggerIn {
            from { opacity: 0; transform: translate3d(0, 12px, 0) scale3d(0.985, 0.985, 1); }
            to { opacity: 1; transform: translate3d(0, 0, 0) scale3d(1, 1, 1); }
        }
        @keyframes qpRippleAnim {
            from { transform: translate(-50%, -50%) scale3d(0, 0, 1); opacity: 0.4; }
            to { transform: translate(-50%, -50%) scale3d(1, 1, 1); opacity: 0; }
        }
        @keyframes qpProgressShine {
            0% { transform: translate3d(-110%, 0, 0) skewX(-20deg); }
            100% { transform: translate3d(260%, 0, 0) skewX(-20deg); }
        }
        .qp-scroll-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 2.5px;
            z-index: 99999;
            background: linear-gradient(90deg, #10b981, #14b8a6, #06b6d4);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.65);
            transform-origin: left center;
            transform: translate3d(0, 0, 0) scaleX(0);
            pointer-events: none;
            will-change: transform;
        }
        .qp-hero-particle {
            position: absolute;
            border-radius: 9999px;
            pointer-events: none;
            will-change: transform, opacity;
            animation: qpParticleRise var(--dur, 7s) ease-in-out var(--delay, 0s) infinite;
        }
        .qp-orbit-ring {
            position: absolute;
            inset: -7px;
            border-radius: 1.25rem;
            border: 1.5px dashed rgba(52, 211, 153, 0.42);
            pointer-events: none;
            will-change: transform;
            animation: qpOrbitSpin 14s linear infinite;
        }
        .qp-stagger-item {
            animation: qpStaggerIn 0.24s cubic-bezier(0.22, 1, 0.36, 1) backwards;
            animation-delay: calc(var(--qp-stagger, 0) * 26ms);
            will-change: transform, opacity;
        }
        .qp-aurora-orb {
            animation: auroraDrift 9s ease-in-out infinite;
            will-change: transform;
        }
        .qp-title-flow {
            background-size: 200% auto;
            animation: titleShimmer 7s ease-in-out infinite;
        }
        .qp-card-shine {
            position: relative;
            overflow: hidden;
        }
        .qp-card-shine::before {
            content: "";
            position: absolute;
            top: 0;
            left: -85%;
            width: 55%;
            height: 100%;
            background: linear-gradient(120deg, transparent 0%, rgba(255, 255, 255, 0.24) 50%, transparent 100%);
            transform: skewX(-20deg);
            pointer-events: none;
            transition: left 0.55s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1;
        }
        .dark .qp-card-shine::before {
            background: linear-gradient(120deg, transparent 0%, rgba(16, 185, 129, 0.09) 50%, transparent 100%);
        }
        .qp-card-shine:hover::before {
            left: 135%;
        }
        .qp-spotlight {
            position: relative;
            overflow: hidden;
        }
        .qp-spotlight::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease-out;
            background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 50%), rgba(16, 185, 129, 0.14), transparent 70%);
            z-index: 0;
            will-change: opacity;
        }
        .dark .qp-spotlight::after {
            background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 50%), rgba(52, 211, 153, 0.12), transparent 70%);
        }
        .qp-spotlight:hover::after {
            opacity: 1;
        }
        .qp-ripple {
            position: absolute;
            border-radius: 9999px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.38) 0%, rgba(16, 185, 129, 0.18) 65%, transparent 100%);
            pointer-events: none;
            transform: translate(-50%, -50%) scale3d(0, 0, 1);
            animation: qpRippleAnim 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            will-change: transform, opacity;
            z-index: 2;
        }
        .qp-progress-shine::after {
            content: "";
            position: absolute;
            inset: 0;
            width: 38%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.48), transparent);
            pointer-events: none;
            will-change: transform;
            animation: qpProgressShine 2.2s linear infinite;
        }
        .qp-btn-shine {
            position: relative;
            overflow: hidden;
        }
        .qp-btn-shine::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(120deg, transparent 0%, rgba(255, 255, 255, 0.32) 50%, transparent 100%);
            transform: skewX(-22deg);
            pointer-events: none;
            transition: left 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .qp-btn-shine:hover::after {
            left: 140%;
        }
        @property --qp-beam-angle {
            syntax: "<angle>";
            initial-value: 0deg;
            inherits: false;
        }
        @keyframes qpBeamSpin {
            to { --qp-beam-angle: 360deg; }
        }
        @keyframes qpOptIn {
            from { opacity: 0; transform: translate3d(0, 8px, 0) scale3d(0.99, 0.99, 1); }
            to { opacity: 1; transform: translate3d(0, 0, 0) scale3d(1, 1, 1); }
        }
        @keyframes qpQEnter {
            from { opacity: 0.72; transform: translate3d(10px, 0, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }
        .qp-tilt {
            transform-style: preserve-3d;
            will-change: transform;
            transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s ease, border-color 0.2s ease;
        }
        .qp-tilt.qp-tilting {
            transition: transform 0.045s linear, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .qp-border-beam-ring {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.5px;
            background: conic-gradient(from var(--qp-beam-angle, 0deg), transparent 0deg, rgba(16, 185, 129, 0.85) 55deg, rgba(34, 211, 238, 0.95) 95deg, transparent 145deg, transparent 360deg);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
            z-index: 2;
            opacity: 0.45;
            transition: opacity 0.22s ease;
            animation: qpBeamSpin 4.5s linear infinite;
            will-change: opacity;
        }
        .group:hover > .qp-border-beam-ring {
            opacity: 1;
        }
        .qp-top-btn {
            position: fixed;
            bottom: 1.25rem;
            left: 1rem;
            z-index: 85;
            width: 42px;
            height: 42px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transform: translate3d(0, 14px, 0) scale3d(0.84, 0.84, 1);
            transition: opacity 0.2s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease;
            will-change: transform, opacity;
        }
        .qp-top-btn.is-visible {
            opacity: 1;
            pointer-events: auto;
            transform: translate3d(0, 0, 0) scale3d(1, 1, 1);
        }
        .qp-top-btn:hover {
            transform: translate3d(0, -2px, 0) scale3d(1.07, 1.07, 1);
        }
        .qp-top-btn:active {
            transform: translate3d(0, 0, 0) scale3d(0.93, 0.93, 1);
        }
        .qp-opt-stagger {
            animation: qpOptIn 0.16s cubic-bezier(0.22, 1, 0.36, 1) backwards;
            animation-delay: calc(var(--opt-i, 0) * 18ms);
            will-change: transform, opacity;
        }
        .qp-q-enter {
            animation: qpQEnter 0.14s cubic-bezier(0.22, 1, 0.36, 1) backwards;
            will-change: transform, opacity;
        }
        @media (prefers-reduced-motion: reduce) {
            .qp-aurora-orb, .qp-title-flow, .qp-hero-particle, .qp-orbit-ring, .qp-stagger-item, .qp-border-beam-ring, .qp-opt-stagger, .qp-q-enter, .animate-shake, .animate-pop { animation: none !important; }
            .qp-card-shine::before, .qp-btn-shine::after, .qp-spotlight::after, .qp-progress-shine::after, .qp-border-beam-ring { display: none !important; animation: none !important; }
            .qp-ripple { display: none !important; }
            .qp-tilt { transform: none !important; transition: none !important; }
        }
        /* Hiệu ứng hào quang thở nguyên bản, đồng bộ êm ái nhịp nhàng 4s */
        @keyframes pulse-harmonic {
            0%, 100% {
                transform: scale(1);
                opacity: 0.4;
                filter: blur(10px);
            }
            50% {
                transform: scale(1.22);
                opacity: 0.75;
                filter: blur(16px);
            }
        }
        @keyframes float-harmonic {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }
        .animate-pulse-harmonic {
            animation: pulse-harmonic 5s ease-in-out infinite;
        }
        .animate-float-harmonic {
            animation: float-harmonic 5s ease-in-out infinite;
        }

        
        @keyframes shake-key {
            0%, 100% { transform: translate3d(0, 0, 0); }
            20%, 60% { transform: translate3d(-5px, 0, 0); }
            40%, 80% { transform: translate3d(5px, 0, 0); }
        }
        .animate-shake {
            animation: shake-key 0.32s cubic-bezier(0.36, 0.07, 0.19, 0.97);
            will-change: transform;
        }
        @keyframes pop-bounce {
            0% { transform: scale3d(0.92, 0.92, 1); }
            65% { transform: scale3d(1.045, 1.045, 1); }
            100% { transform: scale3d(1, 1, 1); }
        }
        .animate-pop {
            animation: pop-bounce 0.24s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
        }

        /* Bảo mật chống sao chép câu hỏi trắc nghiệm: Khóa bôi đen toàn trang, CHỈ mở khóa riêng cho vùng Tự luận (.highlightable-content) */
        body, #root {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        #essay-content-wrapper, .highlightable-content, .highlightable-content * {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
        }
        ::selection {
            background-color: rgba(253, 224, 71, 0.7);
            color: inherit;
        }
        ::-moz-selection {
            background-color: rgba(253, 224, 71, 0.7);
            color: inherit;
        }
        input, textarea {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
        }
        /* Hệ thống tăng/giảm cỡ chữ và giãn dòng thật dành riêng cho Tự luận */
        .essay-question-text {
            font-size: var(--essay-q-size, 18px) !important;
            line-height: var(--essay-q-line-height, 1.6) !important;
        }
        .essay-answer-text {
            font-size: var(--essay-font-size, 16px) !important;
            line-height: var(--essay-line-height, 1.85) !important;
            letter-spacing: 0.015em;
        }
        .essay-keyword-tag {
            font-size: var(--essay-tag-size, 11px) !important;
            line-height: 1.35 !important;
        }
        .essay-label-text {
            font-size: var(--essay-label-size, 12px) !important;
            line-height: 1.4 !important;
        }
        @media print {
            body {
                display: none !important;
            }
        }
    
        /* Highlighter Dạ quang styles */
        .qp-hl-tag {
            border-radius: 3px;
            padding: 0 !important;
            margin: 0 !important;
            cursor: pointer;
            transition: box-shadow 0.08s ease;
            display: inline;
            line-height: inherit;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }
        .qp-hl-tag:hover {
            box-shadow: 0 0 0 1.5px rgba(0,0,0,0.3);
        }
        /* Đảm bảo textarea và input luôn gõ chữ, chọn văn bản mượt mà không bao giờ bị khóa */
        textarea, input, textarea *, input *,
        #essay-content-wrapper textarea, #essay-content-wrapper input {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
            -webkit-touch-callout: default !important;
            pointer-events: auto !important;
        }
        /* Trên màn hình cảm ứng (Điện thoại / Tablet) hoặc khi bật Bút Dạ Quang:
           Khóa tuyệt đối menu bôi đen / Dịch / Tìm kiếm của hệ điều hành */
        .highlightable-content {
            touch-action: pan-y;
            -webkit-tap-highlight-color: transparent;
        }
        @media (pointer: coarse), (hover: none) {
            body #essay-content-wrapper,
            body #essay-content-wrapper .highlightable-content,
            body #essay-content-wrapper .highlightable-content * {
                -webkit-user-select: none !important;
                -moz-user-select: none !important;
                -ms-user-select: none !important;
                user-select: none !important;
                -webkit-touch-callout: none !important;
            }
        }
        body.qp-touch-device #essay-content-wrapper,
        body.qp-touch-device #essay-content-wrapper .highlightable-content,
        body.qp-touch-device #essay-content-wrapper .highlightable-content * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
        }
        body #essay-content-wrapper.essay-brush-active,
        body #essay-content-wrapper.essay-brush-active .highlightable-content,
        body #essay-content-wrapper.essay-brush-active .highlightable-content * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
            cursor: text;
        }
        body #essay-content-wrapper.essay-eraser-active .qp-hl-tag {
            cursor: pointer !important;
            outline: 1.5px dashed rgba(244, 63, 94, 0.7);
            border-radius: 4px;
        }
    </style>
</head>
<body style="overflow-x: clip;" class="bg-gradient-to-br from-[#f0fdf4] via-[#e0f2fe] to-slate-50 dark:from-slate-950 dark:via-slate-900 dark:to-emerald-950 min-h-screen text-slate-800 dark:text-slate-100 w-full max-w-full">
    <div id="qp-scroll-bar" class="qp-scroll-bar" aria-hidden="true"></div>
    <button id="qp-top-btn" type="button" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })" title="Cuộn lên đầu trang" aria-label="Cuộn lên đầu trang" class="qp-top-btn bg-white/90 dark:bg-slate-900/90 backdrop-blur-md text-brand-600 dark:text-emerald-400 border border-emerald-200/80 dark:border-emerald-700/60 shadow-lg shadow-emerald-900/10 hover:shadow-emerald-500/25 cursor-pointer">
        <svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" viewBox="0 0 42 42" aria-hidden="true">
            <circle cx="21" cy="21" r="18" fill="none" stroke="currentColor" stroke-width="2" class="opacity-15"></circle>
            <circle id="qp-top-ring" cx="21" cy="21" r="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="113.1" stroke-dashoffset="113.1"></circle>
        </svg>
        <svg class="w-4 h-4 relative z-10" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="6 11 12 5 18 11"/></svg>
    </button>
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0" aria-hidden="true">
        <div class="hidden sm:block absolute -top-28 -left-24 w-80 h-80 rounded-full bg-emerald-400/10 dark:bg-emerald-500/10 blur-3xl qp-aurora-orb"></div>
        <div class="hidden sm:block absolute top-1/2 -right-28 w-96 h-96 rounded-full bg-cyan-400/10 dark:bg-cyan-500/10 blur-3xl qp-aurora-orb" style="animation-delay: -4.5s;"></div>
    </div>
    <div id="root" class="relative z-10"></div>

    <script>

        // 1. Toast thông báo cảnh báo bảo mật
        function showAntiCheatToast(msg) {
            let t = document.getElementById('anti-cheat-toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'anti-cheat-toast';
                t.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 z-[999999] px-4 py-2.5 rounded-xl bg-slate-900/95 dark:bg-white/95 text-white dark:text-slate-900 text-xs font-bold shadow-2xl backdrop-blur-md border border-amber-500/40 flex items-center gap-2 pointer-events-none transition-all duration-300 opacity-0 translate-y-3';
                document.body.appendChild(t);
            }
            t.innerHTML = '<span class="text-amber-400 dark:text-amber-600 text-base">🛡️</span> <span>' + escapeHTML(msg) + '</span>';
            t.classList.remove('opacity-0', 'translate-y-3');
            clearTimeout(t._hideTimeout);
            t._hideTimeout = setTimeout(() => {
                t.classList.add('opacity-0', 'translate-y-3');
            }, 2500);
        }

        // 3. Lớp chặn sao chép, cắt và bôi đen văn bản (mở khóa riêng cho vùng Tự luận để dùng Bút dạ quang trên cả ĐT & PC)
        document.addEventListener('contextmenu', function(e) {
            const target = e.target && e.target.nodeType === 3 ? e.target.parentElement : e.target;
            if (target && target.closest && target.closest('input, textarea')) return;
            // Trên điện thoại cảm ứng, nhấn giữ để bôi đen chữ sẽ kích hoạt contextmenu -> cho phép trong vùng Tự luận (sự kiện copy vẫn bị khóa chặt bên dưới)
            const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            if (isTouchDevice && typeof state !== 'undefined' && state.studyMode === 'essay' && !state.currentPart && target && target.closest && target.closest('#essay-content-wrapper, .highlightable-content')) {
                return;
            }
            e.preventDefault();
            showAntiCheatToast("Thao tác chuột phải đã bị khóa để bảo vệ bản quyền đề thi!");
            return false;
        });

        document.addEventListener('copy', function(e) {
            const target = e.target && e.target.nodeType === 3 ? e.target.parentElement : e.target;
            if (target && target.closest && target.closest('input, textarea')) return;
            e.preventDefault();
            if (e.clipboardData) {
                e.clipboardData.setData('text/plain', 'Nội dung đề thi được bảo vệ bản quyền bởi QuizPoint Studio.');
            }
            showAntiCheatToast("Tính năng sao chép nội dung đã bị vô hiệu hóa!");
            return false;
        });

        document.addEventListener('cut', function(e) {

            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {

            // 2. Đồng bộ thêm từ Firebase
            try {
                const snap = await db.ref("subjects").once("value");

                    for (const cat in data) {

                        btnOk.className = "flex-1 py-2.5 rounded-xl bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-600 hover:to-red-700 text-xs font-black text-white shadow-lg shadow-rose-500/25 transition-all active:scale-95 cursor-pointer";

                const cleanup = () => {
                    modal.classList.add("hidden");
                    if (btnOk) btnOk.removeEventListener("click", onOk);
                    if (btnCancel) btnCancel.removeEventListener("click", onCancel);
                    document.removeEventListener("keydown", onKeyDown);
                    modal.removeEventListener("click", onBackdropClick);

                const onOk = (e) => {
                    if (e) e.stopPropagation();
                    cleanup();
                    resolve(true);
                };

                const onCancel = (e) => {
                    if (e) e.stopPropagation();
                    cleanup();
                    resolve(false);

                    if (e.key === "Escape") {

        function normalizeSubjectNotice(raw) {
            if (!raw) return null;
            if (typeof raw === 'string') {
                const c = raw.trim();
                return c ? { title: 'Thông báo môn học', content: c, level: 'info', updatedAt: null } : null;
            }
            if (typeof raw === 'object') {
                const content = String(raw.content || raw.text || raw.message || '').trim();
                if (!content) return null;
                const title = String(raw.title || 'Thông báo môn học').trim() || 'Thông báo môn học';
                const level = ['info', 'warning', 'urgent'].includes(raw.level) ? raw.level : 'info';
                return { title, content, level, updatedAt: raw.updatedAt || null };
            }
            return null;
        }

        async function syncSubjectNoticeToSubjectsCatalog(code, noticePayload) {
            if (!code) return;
            try {
                const snap = await db.ref("subjects").once("value");
                const subData = snap.val();
                if (!subData || typeof subData !== 'object') return;
                let changed = false;
                for (const cat in subData) {
                    const arr = Array.isArray(subData[cat]) ? subData[cat] : [];
                    arr.forEach(item => {
                        if (item && item.code && item.code.toUpperCase() === code.toUpperCase()) {
                            if (noticePayload) {
                                item.notice = noticePayload;
                            } else {
                                delete item.notice;
                            }
                            changed = true;
                        }
                    });
                }
                if (changed) {
                    await db.ref("subjects").set(subData);
                }
            } catch (e) {
                console.warn("Đồng bộ notice vào subjects:", e);
            }
        }

        function resolveActualPartKey(partKey) {
            if (partKey === null || partKey === undefined || !TEST_DATA || typeof TEST_DATA !== 'object') return partKey;
            if (TEST_DATA[partKey] !== undefined) return partKey;
            if (!isNaN(partKey) && TEST_DATA[Number(partKey)] !== undefined) return Number(partKey);
            if (TEST_DATA[String(partKey)] !== undefined) return String(partKey);
            return partKey;
        }

        function resolveQuestionExplanation(partKey, qObj) {
            if (!qObj) return '';
            if (partKey !== null && partKey !== undefined && TEST_DATA && typeof TEST_DATA === 'object') {
                const actualKey = resolveActualPartKey(partKey);
                const rawList = getQuestionsArray(TEST_DATA[actualKey]);
                if (rawList.length > 0) {
                    const origIdx = (qObj._origIdx !== undefined) ? qObj._origIdx : qObj.origIdx;
                    let found = null;
                    if (origIdx !== undefined && origIdx !== null && rawList[origIdx] && rawList[origIdx].q === qObj.q) {
                        found = rawList[origIdx];
                    } else {
                        found = rawList.find(it => it && it.q === qObj.q);
                    }
                    if (found) {
                        return String(found.explain !== undefined ? found.explain : (found.explanation || '')).trim();
                    }
                }
            }
            return String(qObj.explain !== undefined ? qObj.explain : (qObj.explanation !== undefined ? qObj.explanation : (qObj.e || ''))).trim();

        async function persistQuestionExplanationValue(newExplainText) {
            if (!isAdminUser() || !SUBJECT_KEY || adminExplainTarget.part === null || adminExplainTarget.part === undefined) return;
            const actualKey = resolveActualPartKey(adminExplainTarget.part);
            const rawList = getQuestionsArray(TEST_DATA[actualKey]);
            if (rawList.length === 0) {
                showQuizToast("Không tìm thấy dữ liệu phần đề gốc trên hệ thống!", "error");
                return;
            }

            const updatedList = rawList.map(it => ({ ...it }));
            let targetIdx = -1;
            if (adminExplainTarget.origIdx !== null && adminExplainTarget.origIdx !== undefined && updatedList[adminExplainTarget.origIdx] && updatedList[adminExplainTarget.origIdx].q === adminExplainTarget.qText) {
                targetIdx = adminExplainTarget.origIdx;
            } else {
                targetIdx = updatedList.findIndex(it => it && it.q === adminExplainTarget.qText);
            }

            if (targetIdx === -1) {
                showQuizToast("Không tìm thấy câu hỏi gốc để cập nhật!", "error");
                return;
            }

            const cleanExp = String(newExplainText || '').trim();
            if (cleanExp) {
                updatedList[targetIdx].explain = cleanExp;
            } else {
                delete updatedList[targetIdx].explain;
                delete updatedList[targetIdx].explanation;
            }

            try {
                await db.ref(`quiz_questions/${SUBJECT_KEY}/${actualKey}`).set(updatedList);
                TEST_DATA[actualKey] = updatedList;

                // Đồng bộ tức thì vào phiên làm bài hiện tại, kết quả vừa nộp và lịch sử
                if (Array.isArray(state.questions)) {
                    state.questions.forEach(q => {
                        if (q && q.q === adminExplainTarget.qText) {
                            if (cleanExp) q.explain = cleanExp;
                            else delete q.explain;
                        }
                    });
                }
                if (Array.isArray(state.sessionAnswers)) {
                    state.sessionAnswers.forEach(a => {
                        if (a && a.q === adminExplainTarget.qText) {
                            if (cleanExp) a.explain = cleanExp;
                            else delete a.explain;
                        }
                    });
                }
                if (Array.isArray(state.reviewData)) {
                    state.reviewData.forEach(r => {
                        if (r && r.q === adminExplainTarget.qText) {
                            if (cleanExp) r.e = cleanExp;
                            else delete r.e;
                        }
                    });
                }
                if (Array.isArray(state.history)) {
                    state.history.forEach(rec => {
                        if (rec && String(rec.part) === String(actualKey) && Array.isArray(rec.details)) {
                            rec.details.forEach(d => {
                                if (d && d.q === adminExplainTarget.qText) {
                                    if (cleanExp) d.e = cleanExp;
                                    else delete d.e;
                                }
                            });
                        }

                    try { localStorage.setItem(`history_${SUBJECT_KEY}`, JSON.stringify(state.history)); } catch (e) {}
                }

                saveQuizProgressDraft();
                closeAdminExplainModal();
                render();
                showQuizToast(cleanExp ? "Đã lưu giải thích đáp án!" : "Đã xóa giải thích — câu hỏi về mặc định bình thường!");
            } catch (err) {
                showQuizToast("Lỗi lưu giải thích: " + err.message, "error");
            }
        }

        // =========================================================================
        // THEO DÕI HOẠT ĐỘNG TRỰC TIẾP CỦA HỌC VIÊN (LIVE PRESENCE HEARTBEAT)
        // Cứ 30 giây ghi lastActive + trang đang xem vào activeSessions/{sid}, kèm nhật ký hoạt động gần đây.
        // Chỉ ghi khi node phiên còn tồn tại -> không "hồi sinh" phiên đã bị Admin đăng xuất.
        // =========================================================================
        const QPPresence = (function() {
            const BEAT_MS = 30000;
            const MAX_LOG = 12;
            let timer = null, sid = null, ref = null, uidKey = null;
            let getPageFn = null;
            let started = false, alive = false, ready = false, existed = false;
            let offset = 0, offsetBound = false;
            let logKeys = [], pending = [], lastEvt = { text: '', t: 0 };
            let hiddenAt = 0;

            function now() { return Date.now() + offset; }
            function safe(p) { if (p && typeof p.catch === 'function') p.catch(function() {}); }
            function pageLabel() {
                try { return String(getPageFn ? getPageFn() : '').slice(0, 140); } catch (e) { return ''; }
            }
            function bindOffset() {
                if (offsetBound) return;
                offsetBound = true;
                try { db.ref('.info/serverTimeOffset').on('value', function(s) { offset = Number(s.val()) || 0; }); } catch (e) {}
            }

            function beat(extra) {
                if (!(started && alive && ready && ref)) return;
                const payload = { lastActive: now(), visible: !document.hidden, page: pageLabel() };
                if (extra) Object.assign(payload, extra);
                try { safe(ref.update(payload)); } catch (e) {}
            }

            function writeEvent(text, t) {
                if (!ref) return;
                const key = String(t).padStart(13, '0') + '_' + Math.random().toString(36).slice(2, 5);
                const updates = {};
                updates['log/' + key] = { t: t, a: String(text).slice(0, 160) };
                updates['lastActive'] = now();
                updates['visible'] = !document.hidden;
                updates['page'] = pageLabel();
                logKeys.push(key);
                logKeys.sort();
                while (logKeys.length > MAX_LOG) updates['log/' + logKeys.shift()] = null;
                try { safe(ref.update(updates)); } catch (e) {}
            }

            function flushPending() {
                const list = pending.splice(0, pending.length);
                list.forEach(function(e) { writeEvent(e.text, e.t); });
            }

            function track(text) {
                if (!started || !text) return;
                const t = now();
                if (lastEvt.text === text && t - lastEvt.t < 20000) return;
                lastEvt = { text: text, t: t };
                if (!(alive && ready)) {
                    pending.push({ text: text, t: t });
                    if (pending.length > 20) pending.shift();
                    return;
                }
                writeEvent(text, t);
            }

            function deactivate() {
                if (ref) { try { ref.off(); } catch (e) {} }
                alive = false; ready = false; existed = false; started = false;
                ref = null; sid = null; uidKey = null; pending = [];
                clearInterval(timer); timer = null;
            }

            // Kích hoạt theo phiên hiện tại trong localStorage. Gọi lại an toàn nhiều lần (sid đổi -> tự khởi động lại).
            function activate(uid, labelFn) {
                const localSid = localStorage.getItem('qp_active_session');
                if (!uid || !localSid) return false;
                if (labelFn) getPageFn = labelFn;
                if (started && alive && sid === localSid && uidKey === uid) return false;
                deactivate();
                sid = localSid; uidKey = uid; started = true; alive = true;
                ref = db.ref('users/' + uid + '/activeSessions/' + sid);
                bindOffset();
                ref.on('value', function(snap) {
                    if (!started) return;
                    if (snap.exists()) {
                        existed = true;
                        try { logKeys = Object.keys((snap.val() || {}).log || {}).sort(); } catch (e) {}
                        if (!ready) { ready = true; flushPending(); beat(); }
                    } else if (existed) {
                        alive = false; // phiên đã bị đăng xuất từ xa -> dừng ghi
                    }
                });
                timer = setInterval(function() { if (!document.hidden) beat(); }, BEAT_MS);
                return true;
            }

            try {
                document.addEventListener('visibilitychange', function() {
                    if (!started) return;
                    if (document.hidden) {
                        hiddenAt = Date.now();
                        beat({ visible: false });
                    } else {
                        const away = hiddenAt ? Date.now() - hiddenAt : 0;
                        hiddenAt = 0;
                        beat({ visible: true });
                        if (away > 60000) track('Quay lại trang sau ' + Math.round(away / 60000) + ' phút');
                    }
                });
                window.addEventListener('pagehide', function() { if (started) beat({ visible: false }); });
            } catch (e) {}

            return { activate: activate, deactivate: deactivate, track: track, beat: beat };
        })();

        function qpQuizPartLabel(part) {
            try { return getPartName(part, 'quiz'); } catch (e) { return 'Phần ' + part; }
        }

        function qpQuizPageLabel() {
            let subj = SUBJECT_KEY || 'QuizPoint';
            try { subj = cleanSubjectTitle(SUBJECT_INFO.name, SUBJECT_KEY) || subj; } catch (e) {}
            let where = 'Chọn đề trắc nghiệm';
            if (state.reviewMode) where = 'Xem lại chi tiết bài làm';
            else if (state.showResult) where = 'Xem kết quả bài làm';
            else if (state.currentPart && state.questions && state.questions.length) {
                where = 'Đang làm ' + qpQuizPartLabel(state.currentPart) + ' (câu ' + (state.currentQuestionIndex + 1) + '/' + state.questions.length + ')';
            } else if (state.studyMode === 'essay') where = 'Tự luận & trọng tâm';
            return subj + ' — ' + where;
        }

        let userSessionListener = null;
        let adminSessionListener = null;

        auth.onAuthStateChanged(async (currentUser) => {
            if (userSessionListener) {
                userSessionListener.off();
                userSessionListener = null;
            }
            if (adminSessionListener) {
                adminSessionListener.off();
                adminSessionListener = null;
            }

            try {
                await fetchSubjectDetails();

                if (currentUser) {
                    const userEmail = (currentUser.email || "").toLowerCase().trim();
                    const isAdmin = (userEmail === ADMIN_EMAIL.toLowerCase());
                    const userRef = db.ref(`users/${currentUser.uid}`);
                    
                    // Kiểm soát phiên thiết bị
                    if (!isAdmin) {
                        if (QPPresence.activate(currentUser.uid, qpQuizPageLabel)) {
                            QPPresence.track('Vào phòng ôn tập: ' + cleanSubjectTitle(SUBJECT_INFO.name, SUBJECT_KEY));
                        }
                        let sessionSynced = false;
                        userSessionListener = userRef.child("currentSessionId");
                        userSessionListener.on("value", (snap) => {
                            const cloudSession = snap.val();
                            const localSession = localStorage.getItem("qp_active_session");
                            if (cloudSession && localSession && cloudSession === localSession) {
                                sessionSynced = true;
                                return;
                            }
                            if (localSession && ((cloudSession && cloudSession !== localSession) || (sessionSynced && !cloudSession))) {
                                localStorage.removeItem("qp_active_session");
                                state.isKicked = true;
                                auth.signOut();
                                state.user = null;
                                render();
                            }
                        });
                    } else {
                        let adminSessionId = localStorage.getItem("qp_admin_session_id");
                        if (!adminSessionId) {
                            adminSessionId = "adm_" + Date.now().toString(36) + "_" + Math.random().toString(36).substring(2, 7);
                            localStorage.setItem("qp_admin_session_id", adminSessionId);
                        }
                        const ua = navigator.userAgent || "";
                        let os = "Máy tính";
                        let icon = "💻";
                        let devType = "desktop";
                        if (/iPad|iPhone|iPod/.test(ua)) { os = /iPad/.test(ua) ? "iPad" : "iPhone"; icon = "📱"; devType = "mobile"; }
                        else if (/Android/.test(ua)) { os = /Mobile/.test(ua) ? "Điện thoại Android" : "Tablet Android"; icon = "📱"; devType = "mobile"; }
                        else if (/Windows/.test(ua)) { os = "Windows PC"; icon = "💻"; }
                        else if (/Macintosh/.test(ua)) { os = "macOS"; icon = "💻"; }

                        let browser = "Browser";
                        if (/Edg\//.test(ua)) browser = "Edge";
                        else if (/Chrome\//.test(ua)) browser = "Chrome";
                        else if (/Safari\//.test(ua)) browser = "Safari";
                        else if (/Firefox\//.test(ua)) browser = "Firefox";

                        const mySessionRef = userRef.child("activeSessions/" + adminSessionId);
                        let isRegistered = false;
                        mySessionRef.update({
                            id: adminSessionId,
                            name: `${os} (${browser})`,
                            icon: icon,
                            os: os,
                            browser: browser,
                            deviceType: devType,
                            userAgent: ua.substring(0, 150),
                            lastActive: Date.now()
                        }).then(() => {
                            isRegistered = true;
                        }).catch(() => {});

                        adminSessionListener = mySessionRef;
                        adminSessionListener.on("value", (snap) => {
                            if (isRegistered && !snap.exists()) {
                                localStorage.removeItem("qp_admin_session_id");
                                state.isKicked = true;
                                auth.signOut();
                                state.user = null;
                                render();
                            }
                        });
                    }

                    if (!isAdmin && SUBJECT_KEY) {
                        try {
                            const permSnap = await userRef.child(`allowedSubjects/${SUBJECT_KEY}`).once("value");
                            if (permSnap.val() !== true) {
                                state.authError = `Tài khoản chưa được cấp quyền truy cập môn ${cleanSubjectTitle(SUBJECT_INFO.name, SUBJECT_KEY) || SUBJECT_KEY}!`;
                                auth.signOut();
                                state.user = null;
                                state.loading = false;
                                render();
                                return;
                            }
                        } catch(e) {}
                    }

                    if (SUBJECT_KEY) {
                        try {
                            let snap = await db.ref(`quiz_questions/${SUBJECT_KEY}`).once("value");
                            let data = snap.val();

                            if (!data) {
                                snap = await db.ref(`mon_hoc/${SUBJECT_KEY.toLowerCase()}`).once("value");
                                const oldData = snap.val();
                                if (oldData) {
                                    data = oldData.parts || oldData;
                                    if (oldData.name) SUBJECT_INFO.name = oldData.name;
                                }
                            }

                            if (data) {
                                if (data._title && !SUBJECT_INFO._fromCatalog) {
                                    // Không để tên phần/buổi học ghi đè tên môn học thật
                                    if (!/^(buổi|buoi|phần|phan|bài|bai|đề|de|chương|chuong)\s*\d+/i.test(data._title)) {
                                        SUBJECT_INFO.name = data._title;
                                    }
                                }
                                TEST_DATA = data;
                            } else {
                                TEST_DATA = {};
                            }
                        } catch(e) {
                            console.error("Lỗi nạp đề thi:", e);
                        }

                        // Tải tài liệu tự luận (Ưu tiên dữ liệu mới nhất từ quiz_questions/_essay, fallback sang essay_questions)
                        ESSAY_DATA = {};
                        try {
                            let eSnap = await db.ref("essay_questions/" + SUBJECT_KEY).once("value");
                            if (eSnap && eSnap.exists()) {
                                Object.assign(ESSAY_DATA, eSnap.val() || {});
                            }
                        } catch(e) {}
                        if (TEST_DATA && typeof TEST_DATA === 'object') {
                            for (const k in TEST_DATA) {
                                if (k.startsWith('essay_')) {
                                    const p = k.replace('essay_', '');
                                    ESSAY_DATA[p] = TEST_DATA[k];
                                }
                            }
                            if (TEST_DATA._essay && typeof TEST_DATA._essay === 'object') {
                                Object.assign(ESSAY_DATA, TEST_DATA._essay);
                            }
                        }

                        // Tải bút dạ quang highlights đã lưu (Kết hợp cả LocalStorage & Firebase để không bao giờ mất)
                        let localHl = {};
                        try {
                            localHl = JSON.parse(localStorage.getItem("qp_highlights_" + currentUser.uid + "_" + SUBJECT_KEY) || "{}");
                        } catch(e) {}
                        state.userHighlights = { ...localHl };

                        try {
                            let hlSnap = await db.ref("users/" + currentUser.uid + "/highlights/" + SUBJECT_KEY).once("value");
                            if (hlSnap.exists()) {
                                state.userHighlights = { ...localHl, ...(hlSnap.val() || {}) };
                                try {
                                    localStorage.setItem("qp_highlights_" + currentUser.uid + "_" + SUBJECT_KEY, JSON.stringify(state.userHighlights));
                                } catch(e) {}
                                if (state.studyMode === 'essay') {
                                    restoreSavedHighlights();
                                }
                            }
                        } catch(e) {}

                        // Tải lịch sử bài làm trắc nghiệm từ Firebase
                        try {
                            let hSnap = await db.ref("users/" + currentUser.uid + "/quiz_history/" + SUBJECT_KEY).once("value");
                            if (hSnap.exists()) {
                                const cloudHistory = hSnap.val();
                                if (Array.isArray(cloudHistory) && cloudHistory.length > 0) {
                                    state.history = cloudHistory;
                                    try { localStorage.setItem("history_" + SUBJECT_KEY, JSON.stringify(state.history)); } catch(e){}
                                }
                            }
                        } catch(e) {}

                        // Tải tiến độ tự luận (Kết hợp LocalStorage & Firebase)
                        let localProg = {};
                        try {
                            localProg = JSON.parse(localStorage.getItem("qp_essay_learned_" + currentUser.uid + "_" + SUBJECT_KEY) || "{}");
                        } catch(e) {}
                        state.essayLearned = { ...localProg };

                        try {
                            let pSnap = await db.ref("users/" + currentUser.uid + "/essay_progress/" + SUBJECT_KEY).once("value");
                            if (pSnap.exists()) {
                                state.essayLearned = { ...localProg, ...(pSnap.val() || {}) };
                                try {
                                    localStorage.setItem("qp_essay_learned_" + currentUser.uid + "_" + SUBJECT_KEY, JSON.stringify(state.essayLearned));
                                } catch(e) {}
                            }
                        } catch(e) {}

                        // Phần học viên chọn phải thật sự tồn tại hoặc được định nghĩa trong danh mục môn học
                        if (state.partScope) {
                            const sp = String(state.partScope);
                            const num = Number(sp);
                            const hasPredefinedPart = SUBJECT_INFO.parts && Array.isArray(SUBJECT_INFO.parts) && num >= 1 && num <= SUBJECT_INFO.parts.length;
                            const exists = !sp.startsWith('_') && (hasPredefinedPart || !!((TEST_DATA && (TEST_DATA[sp] || TEST_DATA[num])) || partHasEssay(sp)));
                            if (!exists) {
                                state.partScope = hasPredefinedPart ? '1' : null;
                                state.essayPartFilter = hasPredefinedPart ? '1' : 'all';
                            } else {
                                state.essayPartFilter = sp;
                            }
                        } else if (SUBJECT_INFO.parts && Array.isArray(SUBJECT_INFO.parts) && SUBJECT_INFO.parts.length > 0) {
                            // Ưu tiên chọn phần ĐÃ CÓ câu hỏi nếu Phần 1 đang trống
                            let firstPartWithData = '1';
                            for (let i = 0; i < SUBJECT_INFO.parts.length; i++) {
                                const pKey = String(i + 1);
                                const hasQ = !!(TEST_DATA && (TEST_DATA[pKey] || TEST_DATA[Number(pKey)]) && getQuestionsArray(TEST_DATA[pKey] || TEST_DATA[Number(pKey)]).length > 0);
                                const hasChildQ = Object.keys(TEST_DATA || {}).some(k => !k.startsWith('_') && String(TEST_DATA._part_parents?.[k]) === pKey && getQuestionsArray(TEST_DATA[k]).length > 0);
                                const hasE = partHasEssay(pKey);
                                if (hasQ || hasChildQ || hasE) {
                                    firstPartWithData = pKey;
                                    break;
                                }
                            }
                            state.partScope = firstPartWithData;
                            state.essayPartFilter = firstPartWithData;
                        }

                        // Nếu môn học chưa có đề trắc nghiệm nhưng ĐÃ CÓ câu hỏi tự luận -> Tự động mở tab Tự luận
                        const quizPartKeys = Object.keys(TEST_DATA || {}).filter(k => !k.startsWith('_') && !k.startsWith('essay_') && String(k) !== '0' && TEST_DATA[k] != null && (!Array.isArray(TEST_DATA[k]) || TEST_DATA[k].length > 0));
                        const essayPartKeys = (typeof getEssayPartKeys === 'function') ? getEssayPartKeys() : Object.keys(ESSAY_DATA || {}).filter(k => !k.startsWith('_') && String(k) !== '0');
                        if (quizPartKeys.length === 0 && essayPartKeys.length > 0 && !initialMode) {
                            state.studyMode = 'essay';
                        }
                    }

                    initHighlighterListeners();
                    state.user = currentUser;

                    if (initialMode === 'essay') {
                        state.studyMode = 'essay';
                        if (initialPart) {
                            state.partScope = String(initialPart);
                            state.essayPartFilter = String(initialPart);
                        }
                        initialPart = "";
                    } else if (initialMode === 'quiz') {
                        state.studyMode = 'quiz';
                        if (initialPart) {
                            state.partScope = String(initialPart);
                            state.essayPartFilter = String(initialPart);
                        }
                        initialPart = "";
                    } else if (initialPart) {
                        state.partScope = String(initialPart);
                        state.essayPartFilter = String(initialPart);
                        const hasQuiz = !!(TEST_DATA && (TEST_DATA[initialPart] || TEST_DATA[Number(initialPart)]) && getQuestionsArray(TEST_DATA[initialPart] || TEST_DATA[Number(initialPart)]).length > 0);
                        const hasEssay = partHasEssay(initialPart);
                        if (!hasQuiz && hasEssay) {
                            state.studyMode = 'essay';
                        } else {
                            state.studyMode = 'quiz';
                        }
                        initialPart = "";
                    }
                    // Không tự động khôi phục ép người dùng vào làm bài khi vừa tải trang
                    // Người dùng sẽ thấy màn hình tổng quan để chọn phần/đề mong muốn
                } else {
                    QPPresence.deactivate();
                    state.user = null;
                }
            } catch (err) {
                console.error("Lỗi trong onAuthStateChanged:", err);
            } finally {
                state.loading = false;
                render();
            }
        });

                        let icon = "💻";
                        let devType = "desktop";

                        else if (/Android/.test(ua)) { os = /Mobile/.test(ua) ? "Điện thoại Android" : "Tablet Android"; icon = "📱"; devType = "mobile"; }
                        else if (/Windows/.test(ua)) { os = "Windows PC"; icon = "💻"; }
                        else if (/Macintosh/.test(ua)) { os = "macOS"; icon = "💻"; }

        function handleGoHome() {
            state.isConfirmingHome = true;
            render();
        }

        function getQuizDraftKey() {
            const uid = (state.user && state.user.uid) ? state.user.uid : 'guest';
            return 'qp_quiz_draft_' + uid + '_' + (SUBJECT_KEY || 'default');
        }

        function saveQuizProgressDraft() {
            if (!state.currentPart || state.showResult || !state.questions || state.questions.length === 0) return;
            try {
                const payload = {
                    currentPart: state.currentPart,
                    questions: state.questions,
                    currentQuestionIndex: state.currentQuestionIndex,
                    shuffledOptions: state.shuffledOptions,
                    selectedOptions: state.selectedOptions,
                    isSubmitted: state.isSubmitted,
                    score: state.score,
                    wrongScore: state.wrongScore,
                    sessionAnswers: state.sessionAnswers,
                    savedAt: Date.now()
                };
                sessionStorage.setItem(getQuizDraftKey(), JSON.stringify(payload));
            } catch (e) {}
        }

        function clearQuizProgressDraft() {
            try {
                sessionStorage.removeItem(getQuizDraftKey());
            } catch (e) {}
        }

        function getQuizProgressDraft() {
            try {
                const raw = sessionStorage.getItem(getQuizDraftKey());
                if (!raw) return null;
                const draft = JSON.parse(raw);
                if (!draft || !draft.currentPart || !Array.isArray(draft.questions) || draft.questions.length === 0) return null;
                if (Date.now() - (draft.savedAt || 0) > 6 * 3600 * 1000) {
                    clearQuizProgressDraft();
                    return null;
                }
                return draft;
            } catch (e) {
                return null;
            }
        }

        function resumeQuizDraft() {
            const draft = getQuizProgressDraft();
            if (!draft) return;
            state.currentPart = draft.currentPart;
            state.questions = draft.questions;
            state.currentQuestionIndex = draft.currentQuestionIndex || 0;
            state.shuffledOptions = draft.shuffledOptions || (state.questions[0] ? state.questions[0].options : []);
            state.selectedOptions = draft.selectedOptions || [];
            state.isSubmitted = !!draft.isSubmitted;
            state.score = draft.score || 0;
            state.wrongScore = draft.wrongScore || 0;
            state.sessionAnswers = Array.isArray(draft.sessionAnswers) ? draft.sessionAnswers : [];
            state.showResult = false;
            render();
        }

        function dismissQuizDraft() {
            clearQuizProgressDraft();
            render();
        }

        function tryRestoreQuizProgressDraft() {
            // Không tự động khôi phục ép người dùng vào làm bài khi tải trang
            return false;
        }

        function renderQuizDraftBanner() {
            const draft = getQuizProgressDraft();
            if (!draft || state.currentPart) return '';
            const ansCount = Array.isArray(draft.sessionAnswers) ? draft.sessionAnswers.filter(Boolean).length : 0;
            const qCount = Array.isArray(draft.questions) ? draft.questions.length : 0;
            const pTitle = getPartName(draft.currentPart, 'quiz');
            return `
                <div class="w-full max-w-xl mx-auto p-3.5 bg-gradient-to-r from-amber-50 to-orange-50 dark:from-amber-950/40 dark:to-orange-950/30 rounded-2xl border border-amber-300 dark:border-amber-700/60 flex items-center justify-between gap-3 shadow-xs animate-enter my-2">
                    <div class="flex items-center gap-2.5 min-w-0">
                        <span class="text-xl">⚡</span>
                        <div class="min-w-0">
                            <p class="text-xs font-black text-amber-900 dark:text-amber-200 truncate">Bạn đang làm dở: ${escapeHTML(pTitle)}</p>
                            <p class="text-[10px] text-amber-700/80 dark:text-amber-400">Đã trả lời ${ansCount}/${qCount} câu hỏi</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <button type="button" onclick="resumeQuizDraft()" class="px-3.5 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-black shadow-xs cursor-pointer active:scale-95 transition-all">Làm tiếp</button>
                        <button type="button" onclick="dismissQuizDraft()" class="px-2.5 py-1.5 rounded-xl bg-white dark:bg-slate-800 text-slate-500 hover:text-rose-500 text-xs font-bold border border-slate-200 dark:border-slate-700 cursor-pointer active:scale-95 transition-all" title="Bỏ bài làm dở này">Bỏ qua</button>
                    </div>
                </div>
            `;
        }

        function startQuiz(part) {
            let raw = getQuestionsArray(TEST_DATA[part]);
            if (raw.length === 0 && !isNaN(part)) {
                raw = getQuestionsArray(TEST_DATA[Number(part)]);
            }

            if (raw.length === 0) {
                alert("Bộ đề này hiện đang được cập nhật câu hỏi!");
                return;
            }

            state.questions = raw.map((item, idx) => {
                const ALL_OPT_KEYS = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l'];
                const options = ALL_OPT_KEYS
                    .filter(k => item[k] !== undefined && item[k] !== null && String(item[k]).trim() !== "")
                    .map(k => ({ key: k, text: item[k] }));

                const cleanAns = (item.ans || "a").toString().toLowerCase().replace(/[^a-z]/g, '').split('').sort().join('');
                const rawExplain = String(item.explain !== undefined ? item.explain : (item.explanation || '')).trim();

                const mappedQ = {
                    id: item.id || (idx + 1),
                    _origIdx: idx,
                    q: item.q,
                    correct: cleanAns || "a",
                    isMultiple: (cleanAns.length > 1),
                    options: options
                };
                if (rawExplain) mappedQ.explain = rawExplain;
                return mappedQ;
            });

            state.currentPart = part; 
            state.currentQuestionIndex = 0; 
            state.score = 0; 
            state.wrongScore = 0;
            state.streak = 0;
            state.bestStreak = 0;
            state.justSubmitted = false;
            state.justSubmittedCorrect = null;
            state.justChangedQuestion = true;
            state.sessionAnswers = []; 
            state.showResult = false; 
            state.selectedOptions = []; 
            state.isSubmitted = false;

            if (state.questions.length > 0) {
                state.shuffledOptions = shuffleArray(state.questions[0].options);
            }
            saveQuizProgressDraft();
            render();
            state.justChangedQuestion = false;
            QPPresence.track('Bắt đầu làm ' + qpQuizPartLabel(part) + ' (' + state.questions.length + ' câu)');
        }

        function handleOptionSelect(key, isMultiple) {
            if (state.isSubmitted) return;
            if (isMultiple) {
                if (state.selectedOptions.includes(key)) {
                    state.selectedOptions = state.selectedOptions.filter(k => k !== key);
                } else {
                    state.selectedOptions.push(key);
                }
            } else {

        function checkAnswerSubmission() {
            if (state.selectedOptions.length === 0 || state.isSubmitted) return;
            const currentQ = state.questions[state.currentQuestionIndex];
            const userAnsStr = [...state.selectedOptions].sort().join('');
            const correctAnsStr = currentQ.correct.split('').sort().join('');
            const correct = userAnsStr === correctAnsStr;
            
            state.isSubmitted = true;
            if (correct) {
                state.score++;
                state.streak++;
                state.bestStreak = Math.max(state.bestStreak, state.streak);
            } else {
                state.wrongScore++;
                state.streak = 0;
            }
            state.justSubmitted = true;
            state.justSubmittedCorrect = correct;
            state.sessionAnswers.push({ ...currentQ, userSelected: userAnsStr, options: state.shuffledOptions });
            saveQuizProgressDraft();
            render();
            state.justSubmitted = false;
        }

                state.currentQuestionIndex++;
                const newQ = state.questions[state.currentQuestionIndex];
                const existing = state.sessionAnswers.find(a => a.id === newQ.id);
                if (existing) {
                    state.shuffledOptions = existing.options;
                    state.selectedOptions = existing.userSelected.split('');
                    state.isSubmitted = true;
                } else {
                    state.shuffledOptions = shuffleArray(newQ.options); 
                    state.selectedOptions = []; 
                    state.isSubmitted = false;
                }
                state.justChangedQuestion = true;
                state.justSubmitted = false;
                saveQuizProgressDraft();
                render();

        function clearBrushPreview() {

        function createRangeByCharOffsets(rootEl, startChar, endChar) {
            if (!rootEl || endChar <= startChar) return null;
            const walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, null, false);
            let node, acc = 0;
            let sNode = null, sOff = 0, eNode = null, eOff = 0;
            while ((node = walker.nextNode())) {
                const len = node.nodeValue ? node.nodeValue.length : 0;
                if (!sNode && startChar <= acc + len) {
                    sNode = node;
                    sOff = Math.max(0, startChar - acc);
                }
                if (!eNode && endChar <= acc + len) {
                    eNode = node;
                    eOff = Math.max(0, endChar - acc);
                    break;
                }
                acc += len;
            }
            if (!sNode || !eNode) return null;
            const r = document.createRange();
            r.setStart(sNode, sOff);
            r.setEnd(eNode, eOff);
            return r;
        }

        function buildWordTokens(contentEl) {
            const tokens = [];
            if (!contentEl) return tokens;
            const walker = document.createTreeWalker(contentEl, NodeFilter.SHOW_TEXT, null, false);
            const probe = document.createRange();
            let node, acc = 0;
            while ((node = walker.nextNode())) {
                const val = node.nodeValue || '';
                const re = /\S+/g;
                let m;
                while ((m = re.exec(val)) !== null) {
                    const sOff = m.index;
                    const eOff = m.index + m[0].length;
                    probe.setStart(node, sOff);
                    probe.setEnd(node, eOff);
                    const rect = probe.getBoundingClientRect();
                    if (rect && (rect.width > 0 || rect.height > 0)) {
                        tokens.push({
                            charStart: acc + sOff,
                            charEnd: acc + eOff,
                            word: m[0],
                            left: rect.left,
                            right: rect.right,
                            top: rect.top,
                            bottom: rect.bottom,
                            midX: (rect.left + rect.right) / 2,
                            midY: (rect.top + rect.bottom) / 2
                        });
                    }
                }
                acc += val.length;
            }
            return tokens;
        }

        function findTokenAtPoint(tokens, x, y, allowNearest) {
            if (!tokens || tokens.length === 0) return -1;
            // 1. Khớp trực tiếp (có dung sai ngón tay ±8px dọc, ±6px ngang)
            for (let i = 0; i < tokens.length; i++) {
                const t = tokens[i];
                if (y >= t.top - 8 && y <= t.bottom + 8 && x >= t.left - 6 && x <= t.right + 6) {
                    return i;
                }
            }
            if (!allowNearest) return -1;

            // 2. Khi đang kéo lướt bút: Tìm từ gần nhất trên dòng gần ngón tay nhất
            let bestIdx = -1;
            let bestScore = Infinity;
            for (let i = 0; i < tokens.length; i++) {
                const t = tokens[i];
                const dy = (y < t.top) ? (t.top - y) : (y > t.bottom ? (y - t.bottom) : 0);
                const dx = (x < t.left) ? (t.left - x) : (x > t.right ? (x - t.right) : 0);
                const score = dy * 4.2 + dx;
                if (score < bestScore) {
                    bestScore = score;
                    bestIdx = i;
                }
            }
            return bestScore < 180 ? bestIdx : -1;
        }

        function renderBrushPreview(contentEl, tokens, idxA, idxB, pen) {
            const layer = document.getElementById('qp-brush-preview-layer');
            if (!layer || !contentEl || idxA < 0 || idxB < 0 || !pen) return;
            const lo = Math.min(idxA, idxB);
            const hi = Math.max(idxA, idxB);
            const r = createRangeByCharOffsets(contentEl, tokens[lo].charStart, tokens[hi].charEnd);
            if (!r) return;

            const rects = r.getClientRects();
            let bg = 'rgba(254, 240, 138, 0.7)';
            let borderBottom = 'none';
            if (pen.kind === 'bg') {
                bg = pen.value;
            } else if (pen.kind === 'fg') {
                bg = 'rgba(148, 163, 184, 0.22)';
                borderBottom = `2.5px solid ${pen.value}`;
            } else if (pen.kind === 'style') {
                bg = 'rgba(251, 191, 36, 0.35)';
                borderBottom = '2px dashed #f59e0b';
            } else if (pen.kind === 'eraser') {
                bg = 'rgba(244, 63, 94, 0.35)';
                borderBottom = '2px dashed #f43f5e';
            } else if (pen.kind === 'clear_bg') {
                bg = 'rgba(251, 191, 36, 0.25)';
                borderBottom = '2px dashed #f59e0b';
            } else if (pen.kind === 'clear_fg') {
                bg = 'rgba(56, 189, 248, 0.25)';
                borderBottom = '2px dashed #38bdf8';
            }

            let html = '';
            for (let i = 0; i < rects.length; i++) {
                const rc = rects[i];
                if (rc.width < 1 || rc.height < 1) continue;
                html += `<div style="position:fixed;left:${rc.left - 1}px;top:${rc.top}px;width:${rc.width + 2}px;height:${rc.height}px;background:${bg};opacity:0.65;border-radius:4px;border-bottom:${borderBottom};pointer-events:none;"></div>`;
            }
            layer.innerHTML = html;
        }

        async function applyBrushStroke(contentEl, tokens, idxA, idxB, pen) {
            if (!contentEl || !tokens || idxA < 0 || idxB < 0 || !pen) return;
            const lo = Math.min(idxA, idxB);
            const hi = Math.max(idxA, idxB);
            const charStart = tokens[lo].charStart;
            const charEnd = tokens[hi].charEnd;

            const cardInfo = getEnclosingEssayCardInfo(contentEl);
            if (!cardInfo || !cardInfo.essayId || !cardInfo.targetField) return;

            if (pen.kind === 'eraser') {
                await applyStyleToEssayField(contentEl, cardInfo.essayId, cardInfo.targetField, charStart, charEnd, 'eraser', null);
                return;
            }
            if (pen.kind === 'clear_bg') {
                await applyStyleToEssayField(contentEl, cardInfo.essayId, cardInfo.targetField, charStart, charEnd, 'clear_bg', null);
                return;
            }
            if (pen.kind === 'clear_fg') {
                await applyStyleToEssayField(contentEl, cardInfo.essayId, cardInfo.targetField, charStart, charEnd, 'clear_fg', null);
                return;
            }
            if (pen.kind === 'bg') {
                await applyStyleToEssayField(contentEl, cardInfo.essayId, cardInfo.targetField, charStart, charEnd, 'bg', pen.value);
                return;
            }
            if (pen.kind === 'fg') {
                await applyStyleToEssayField(contentEl, cardInfo.essayId, cardInfo.targetField, charStart, charEnd, 'fg', pen.value);
                return;
            }
            if (pen.kind === 'style') {
                await applyStyleToEssayField(contentEl, cardInfo.essayId, cardInfo.targetField, charStart, charEnd, pen.value, true);
                return;
            }
        }

        function syncEssayScrollTopFab() {
            const topBtn = document.getElementById('essay-scroll-top-fab');
            if (!topBtn) return;
            const scrolled = (window.scrollY || (document.documentElement && document.documentElement.scrollTop) || 0) > 320;
            topBtn.classList.toggle('hidden', !(isEssayViewActive() && scrolled));
        }

        function syncEssayBrushBarDOM() {
            const essayActive = isEssayViewActive();
            const isOpen = essayActive && !!state.showBrushBar;

            const bar = document.getElementById('essay-sticky-pen-bar');
            if (bar) {
                bar.classList.toggle('hidden', !isOpen);
                if (isOpen) {
                    bar.innerHTML = renderEssayBrushBarInner();
                }
            }

            const dock = document.getElementById('essay-floating-dock');
            if (dock) {
                dock.classList.toggle('hidden', !essayActive);
            }

            const fabBtn = document.getElementById('essay-fab-pen-btn');
            if (fabBtn) {
                fabBtn.className = getEssayFabPenBtnClass(isOpen);
                fabBtn.innerHTML = isOpen
                    ? '<span>✕</span><span>Tắt bút</span>'
                    : '<span>🖍️</span><span>Mở bút tô</span>';
                fabBtn.title = isOpen
                    ? 'Tắt và ẩn thanh bút dạ quang'
                    : 'Mở thanh bút dạ quang tô màu ngay tại vị trí đang đọc';
            }

            syncEssayScrollTopFab();

            const wrapper = document.getElementById('essay-content-wrapper');
            if (wrapper) {
                wrapper.classList.toggle('essay-brush-active', !!(isOpen && state.brushPen));
                wrapper.classList.toggle('essay-eraser-active', !!(isOpen && state.brushPen && (state.brushPen.kind === 'eraser' || state.brushPen.kind === 'clear_bg' || state.brushPen.kind === 'clear_fg')));
            }
            if (isOpen && state.brushPen) {
                hideHighlighterToolbar();
                try {
                    const sel = window.getSelection();
                    if (sel) sel.removeAllRanges();
                } catch (e) {}
            }
        }

        window.toggleBrushBar = function(forceShow) {
            const nextShow = (typeof forceShow === 'boolean') ? forceShow : !state.showBrushBar;
            if (!nextShow) {
                window.closeBrushBar();
                return;
            }
            state.showBrushBar = true;
            state.brushExpanded = true;
            if (!state.brushPen) {
                state.brushPen = { kind: 'bg', value: state.lastBrushColor || '#fef08a' };
            }
            clearBrushPreview();
            syncEssayBrushBarDOM();
        };

        window.closeBrushBar = function() {
            state.showBrushBar = false;
            state.brushPen = null;
            state.brushExpanded = false;
            clearBrushPreview();
            syncEssayBrushBarDOM();

            state.showBrushBar = true;
            if (state.brushPen && state.brushPen.kind === kind && (kind === 'eraser' || state.brushPen.value === value)) {
                state.brushPen = null;
            } else {
                state.brushPen = { kind, value };
                state.brushExpanded = true;
                if (kind === 'bg' && value) state.lastBrushColor = value;
            }
            clearBrushPreview();
            syncEssayBrushBarDOM();
        };

        window.toggleBrushExpand = function(expand) {
            state.showBrushBar = true;
            state.brushExpanded = !!expand;
            if (expand && !state.brushPen) {
                state.brushPen = { kind: 'bg', value: state.lastBrushColor || '#fef08a' };

            syncEssayBrushBarDOM();
