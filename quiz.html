        function initHighlighterListeners() {
            if (window._qpHighlighterInitDone) return;
            window._qpHighlighterInitDone = true;

            let selectionTimeout = null;
            let isPointerDownInContent = false;
            const isCoarsePointer = () => !!(
                (document.body && document.body.classList && document.body.classList.contains('qp-touch-device')) ||
                (window.matchMedia && window.matchMedia('(pointer: coarse), (hover: none)').matches)
            );
            if (('ontouchstart' in window || (navigator && navigator.maxTouchPoints > 0)) && window.innerWidth < 1024) {
                if (document.body && document.body.classList) document.body.classList.add('qp-touch-device');
            }

            // Đồng bộ nút cuộn nhanh lên đầu trang khi đọc sâu trong Tự luận + ẩn menu highlight khi cuộn trang
            window.addEventListener('scroll', () => {
                syncEssayScrollTopFab();
                const tb = document.getElementById('qp-highlighter-toolbar');
                if (tb && !tb.classList.contains('hidden')) {
                    hideHighlighterToolbar();
                }
            }, { passive: true });

            // Chặn hoàn toàn menu chuột phải / nhấn giữ (Dịch / Tìm kiếm) của trình duyệt di động trên vùng Tự luận
            document.addEventListener('contextmenu', (e) => {
                if (state.studyMode === 'essay' && e.target && e.target.closest && e.target.closest('#essay-content-wrapper')) {
                    if (isCoarsePointer() || state.brushPen) {
                        e.preventDefault();
                    }
                }
            });

            // =================================================================
            // 1. CƠ CHẾ CHẠM & QUẸT BÚT TRỰC TIẾP TRÊN ĐIỆN THOẠI / TABLET
            // =================================================================
            let touchSession = null;

            document.addEventListener('touchstart', (e) => {
                if (document.body && document.body.classList) document.body.classList.add('qp-touch-device');
                if (state.studyMode !== 'essay' || state.currentPart) return;
                if (!e.touches || e.touches.length !== 1) {
                    if (touchSession && touchSession.holdTimer) clearTimeout(touchSession.holdTimer);
                    touchSession = null;
                    clearBrushPreview();
                    return;
                }
                const target = e.target;
                if (!target || !target.closest) return;
                if (target.closest('button, a, input, textarea, select, #essay-sticky-pen-bar, #essay-floating-dock, #qp-highlighter-toolbar, #custom-confirm-modal')) return;

                const contentEl = target.closest('.highlightable-content');
                if (!contentEl) return;

                // Chỉ kích hoạt chấm/quẹt tô màu khi thanh bút đang BẬT và đang cầm bút/tẩy
                if (!state.showBrushBar || !state.brushPen) {
                    touchSession = null;
                    return;
                }

                const touch = e.touches[0];
                const startX = touch.clientX;
                const startY = touch.clientY;

                // Nếu ĐANG CẦM BÚT TÔ MÀU / TẨY XÓA / KIỂU CHỮ
                const tokens = buildWordTokens(contentEl);
                const startIdx = findTokenAtPoint(tokens, startX, startY, false);
                if (startIdx < 0) return;
                touchSession = {
                    mode: 'pen',
                    contentEl,
                    tokens,
                    startX,
                    startY,
                    startIdx,
                    endIdx: startIdx,
                    gesture: 'pending'
                };
            }, { passive: true });

            document.addEventListener('touchmove', (e) => {
                if (!touchSession || !e.touches || e.touches.length !== 1) return;
                const touch = e.touches[0];
                const dx = touch.clientX - touchSession.startX;
                const dy = touch.clientY - touchSession.startY;

                if (touchSession.gesture === 'scroll') return;
                if (touchSession.gesture === 'pending') {
                    // Vuốt dọc -> cuộn trang mượt bình thường
                    if (Math.abs(dy) > 9 && Math.abs(dy) > Math.abs(dx) * 1.15) {
                        touchSession.gesture = 'scroll';
                        clearBrushPreview();
                        return;
                    }
                    // Quẹt ngang -> khóa sang chế độ quét bút dạ quang / tẩy
                    if (Math.abs(dx) > 7) {
                        touchSession.gesture = 'brush';
                    } else {
                        return;
                    }
                }
                if (touchSession.gesture === 'brush') {
                    if (e.cancelable) e.preventDefault();
                    const hitIdx = findTokenAtPoint(touchSession.tokens, touch.clientX, touch.clientY, true);
                    if (hitIdx >= 0 && hitIdx !== touchSession.endIdx) {
                        touchSession.endIdx = hitIdx;
                    }
                    renderBrushPreview(touchSession.contentEl, touchSession.tokens, touchSession.startIdx, touchSession.endIdx, state.brushPen);
                }
            }, { passive: false });

            const finishTouchSession = async () => {
                if (!touchSession) return;
                const sess = touchSession;
                touchSession = null;
                if (sess.holdTimer) clearTimeout(sess.holdTimer);
                clearBrushPreview();

                if (state.brushPen && sess.gesture !== 'scroll') {
                    await applyBrushStroke(sess.contentEl, sess.tokens, sess.startIdx, sess.endIdx, state.brushPen);
                }
            };

            document.addEventListener('touchend', finishTouchSession, { passive: true });
            document.addEventListener('touchcancel', () => {
                if (touchSession && touchSession.holdTimer) clearTimeout(touchSession.holdTimer);
                touchSession = null;
                clearBrushPreview();
            }, { passive: true });

            // =================================================================
            // 2. HỖ TRỢ CẦM BÚT QUÉT BẰNG CHUỘT TRÊN MÁY TÍNH + FLOATING BAR KHI TẮT BÚT
            // =================================================================
            let mouseBrushSession = null;

            function checkAndShowToolbar() {
                if (state.studyMode !== 'essay' || state.currentPart || state.brushPen || isCoarsePointer()) {
                    hideHighlighterToolbar();
                    return;
                }

                const sel = window.getSelection();
                if (!sel || sel.isCollapsed) return;

                const text = sel.toString().trim();
                if (text.length < 2) {
                    hideHighlighterToolbar();
                    return;
                }

                if (sel.rangeCount === 0) return;
                const range = sel.getRangeAt(0);
                const container = range.commonAncestorContainer;
                const parentEl = container.nodeType === 1 ? container : container.parentElement;

                if (!parentEl || parentEl.closest('input, textarea, select, button, #essay-sticky-pen-bar, #essay-floating-dock, #qp-highlighter-toolbar, #custom-confirm-modal, #admin-subject-notice-modal, #admin-explain-modal, #admin-word-match-modal')) {
                    return;
                }
                if (!parentEl.closest('#essay-content-wrapper, .highlightable-content')) {
                    hideHighlighterToolbar();
                    return;
                }

                currentSelectionRange = range.cloneRange();
                selectedHighlightText = text;
                positionFloatingToolbar(range);
            }

            document.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                const tb = document.getElementById('qp-highlighter-toolbar');
                if (tb && tb.contains(e.target)) return;
                if (e.target && e.target.closest && e.target.closest('#custom-confirm-modal, #admin-subject-notice-modal, #admin-explain-modal, #admin-word-match-modal, #essay-sticky-pen-bar, #essay-floating-dock, button, a')) return;

                // Nhấn chuột ra ngoài chữ -> ẩn ngay menu highlight
                hideHighlighterToolbar();

                if (state.studyMode === 'essay' && !state.currentPart && state.brushPen) {
                    const contentEl = e.target && e.target.closest ? e.target.closest('.highlightable-content') : null;
                    if (!contentEl) return;
                    const tokens = buildWordTokens(contentEl);
                    const startIdx = findTokenAtPoint(tokens, e.clientX, e.clientY, false);
                    if (startIdx >= 0) {
                        mouseBrushSession = { mode: 'pen', contentEl, tokens, startIdx, endIdx: startIdx };
                        renderBrushPreview(contentEl, tokens, startIdx, startIdx, state.brushPen);
                    }
                    return;
                }

                isPointerDownInContent = true;
            });

            document.addEventListener('mousemove', (e) => {
                if (!mouseBrushSession || !state.brushPen) return;
                const hitIdx = findTokenAtPoint(mouseBrushSession.tokens, e.clientX, e.clientY, true);
                if (hitIdx >= 0 && hitIdx !== mouseBrushSession.endIdx) {
                    mouseBrushSession.endIdx = hitIdx;
                    renderBrushPreview(mouseBrushSession.contentEl, mouseBrushSession.tokens, mouseBrushSession.startIdx, mouseBrushSession.endIdx, state.brushPen);
                }
            });

            document.addEventListener('mouseup', async (e) => {
                if (mouseBrushSession) {
                    const sess = mouseBrushSession;
                    mouseBrushSession = null;
                    clearBrushPreview();
                    if (sess.mode === 'pen' && state.brushPen) {
                        await applyBrushStroke(sess.contentEl, sess.tokens, sess.startIdx, sess.endIdx, state.brushPen);
                    }
                    return;
                }

                const tb = document.getElementById('qp-highlighter-toolbar');
                if (tb && tb.contains(e.target)) return;
                isPointerDownInContent = false;
                if (isCoarsePointer() || state.brushPen) return;

                // Chỉ hiển thị menu khi nhả chuột xong hoàn toàn (mouseup) tức thì
                clearTimeout(selectionTimeout);
                selectionTimeout = setTimeout(() => {
                    const sel = window.getSelection();
                    if (!sel || sel.isCollapsed || sel.toString().trim().length < 2) {
                        hideHighlighterToolbar();
                    } else {
                        checkAndShowToolbar();
                    }

            });

            document.addEventListener('selectionchange', () => {
                const sel = window.getSelection();
                // Khi bỏ chọn chữ -> ẩn ngay menu, tuyệt đối KHÔNG gọi checkAndShowToolbar khi đang quét chuột kéo
                if (!sel || sel.isCollapsed || sel.toString().trim().length < 2) {

            document.addEventListener('keyup', (e) => {

                }
            });
        }

        // HỆ THỐNG HIGHLIGHT & ĐỊNH DẠNG VĂN BẢN ĐA TẦNG (CHỐNG CHỒNG CHÉO & LỖI KHOẢNG CÁCH)
        // =========================================================================
        function trimRangeBoundary(range) {
            if (!range || range.collapsed) return null;
            let startNode = range.startContainer;
            let startOffset = range.startOffset;
            let endNode = range.endContainer;
            let endOffset = range.endOffset;

            // Dịch điểm bắt đầu nếu rơi vào khoảng trắng để không bọc nhầm khoảng cách
            if (startNode.nodeType === Node.TEXT_NODE) {
                const val = startNode.nodeValue || '';
                while (startOffset < val.length && /\s/.test(val[startOffset])) {
                    if (startNode === endNode && startOffset >= endOffset) return null;
                    startOffset++;
                }
            }

            // Dịch điểm kết thúc nếu rơi vào khoảng trắng
            if (endNode.nodeType === Node.TEXT_NODE) {
                const val = endNode.nodeValue || '';
                while (endOffset > 0 && /\s/.test(val[endOffset - 1])) {
                    if (startNode === endNode && endOffset <= startOffset) return null;
                    endOffset--;
                }
            }

            if (startNode === endNode && startOffset >= endOffset) return null;

            const trimmed = range.cloneRange();
            try {
                trimmed.setStart(startNode, startOffset);
                trimmed.setEnd(endNode, endOffset);
                return trimmed;
            } catch(e) {
                return range;
            }
        }

        
        function formatEssayDisplayAnswer(ans) {
            if (!ans) return '';
            let str = String(ans).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            return str.replace(/([^\n])\n([^\n])/g, '$1\n\n$2');
        }

            if (!rangeOrNode) return { card: null, cardId: null, essayId: null, targetField: null };

            }
            const el = (node && node.nodeType === 1) ? node : (node ? node.parentElement : null);
            if (!el) return { card: null, cardId: null, essayId: null, targetField: null };

            const card = el.closest('[id^="essay-card-"]');
            const qEl = el.closest('.essay-question-text');
            const aEl = el.closest('.essay-answer-text');

            const cardId = card ? card.id : null;
            const essayId = card ? (card.dataset.essayId || card.id.replace('essay-card-', '')) : null;
            const targetField = qEl ? 'question' : (aEl ? 'answer' : null);

            return { card, cardId, essayId, targetField };

        function positionFloatingToolbar(target) {
            const tb = document.getElementById('qp-highlighter-toolbar');
            if (!tb || !target) return;
            const rect = (typeof target.getBoundingClientRect === 'function')
                ? target.getBoundingClientRect()
                : target;
            if (!rect || (!rect.width && !rect.height && !rect.top && !rect.bottom)) return;

            if (!tb.dataset.initialized) {
                tb.innerHTML = renderHighlighterToolbarInner();
                tb.dataset.initialized = 'true';
            }

            tb.style.position = 'fixed';
            tb.style.bottom = 'auto';
            tb.style.width = 'auto';
            tb.style.maxWidth = 'calc(100vw - 16px)';
            tb.classList.remove('hidden');

            const tbHeight = tb.offsetHeight || 92;
            const tbWidth = tb.offsetWidth || 380;
            const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
            const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;

            const midX = (rect.left + rect.right) / 2;
            const halfTb = tbWidth / 2;
            const safeLeft = Math.max(halfTb + 10, Math.min(vw - halfTb - 10, midX));
            tb.style.left = safeLeft + 'px';
            tb.style.transform = 'translateX(-50%)';

            let topPx = rect.top - tbHeight - 12;
            if (topPx < 10) {
                topPx = rect.bottom + 10;
                if (topPx + tbHeight > vh - 10) {
                    topPx = Math.max(10, vh - tbHeight - 10);
                }
            }
            tb.style.top = Math.round(topPx) + 'px';
        }

        function keepToolbarActiveOnMark(mark) {
            if (!mark) return;
            if (state.brushPen) return;
            try {
                const sel = window.getSelection();
                if (sel) {
                    const newRange = document.createRange();
                    newRange.selectNodeContents(mark);
                    sel.removeAllRanges();
                    sel.addRange(newRange);
                    currentSelectionRange = newRange;
                    selectedHighlightText = mark.textContent || '';

                positionFloatingToolbar(mark.getBoundingClientRect());
            } catch (e) {}

        function getRangeCharOffsets(contentEl, range) {
            if (!contentEl || !range) return null;
            try {
                if (contentEl.contains(range.startContainer) && contentEl.contains(range.endContainer)) {
                    const preStart = document.createRange();
                    preStart.selectNodeContents(contentEl);
                    preStart.setEnd(range.startContainer, range.startOffset);
                    const startChar = preStart.toString().length;

                    const preEnd = document.createRange();
                    preEnd.selectNodeContents(contentEl);
                    preEnd.setEnd(range.endContainer, range.endOffset);
                    const endChar = preEnd.toString().length;

                    if (typeof startChar === 'number' && typeof endChar === 'number' && endChar > startChar) {
                        return { start: startChar, end: endChar };
                    }
                }
            } catch (err) {
                console.warn("Lỗi tính Range char offsets:", err);
            }

            try {
                let charOffset = 0;
                let startChar = -1;
                let endChar = -1;
                const walker = document.createTreeWalker(contentEl, NodeFilter.SHOW_TEXT, null, false);
                let node;
                while ((node = walker.nextNode())) {
                    const len = node.nodeValue ? node.nodeValue.length : 0;
                    if (node === range.startContainer) {
                        startChar = charOffset + range.startOffset;
                    } else if (range.startContainer.nodeType === 1 && range.startContainer.contains(node) && startChar === -1) {
                        startChar = charOffset;
                    }
                    if (node === range.endContainer) {
                        endChar = charOffset + range.endOffset;
                        break;
                    } else if (range.endContainer.nodeType === 1 && range.endContainer.contains(node)) {
                        endChar = charOffset + len;
                    }
                    charOffset += len;
                }
                if (startChar >= 0 && endChar > startChar) {
                    return { start: startChar, end: endChar };
                }
            } catch (e) {}
            return null;
        }

        function getEssayFieldSpans(essayId, targetField) {
            const spans = [];
            if (!state.userHighlights) return spans;
            const strId = String(essayId);
            Object.values(state.userHighlights).forEach(hl => {
                if (!hl || String(hl.essayId) !== strId || hl.targetField !== targetField) return;
                const start = (typeof hl.start === 'number') ? hl.start : (typeof hl.charOffset === 'number' ? hl.charOffset : -1);
                const end = (typeof hl.end === 'number') ? hl.end : (start >= 0 && hl.text ? start + hl.text.length : -1);
                if (start >= 0 && end > start) {
                    spans.push({
                        id: hl.id || ("hl_" + strId + "_" + targetField + "_" + start + "_" + end),
                        start: start,
                        end: end,
                        bg: hl.bg || hl.color || null,
                        fg: hl.fg || hl.textColor || null,
                        bold: !!(hl.bold || hl.styleType === 'bold'),
                        italic: !!(hl.italic || hl.styleType === 'italic'),
                        underline: !!(hl.underline || hl.styleType === 'underline'),
                        uppercase: !!(hl.uppercase || hl.styleType === 'uppercase'),
                        lowercase: !!(hl.lowercase || hl.styleType === 'lowercase')
                    });
                }
            });
            return spans.sort((a, b) => a.start - b.start);
        }

        function renderEssayFieldHTML(rawText, spans, essayId, targetField) {
            if (!spans || spans.length === 0) return escapeHTML(rawText);

            let html = '';
            let curr = 0;
            const strId = String(essayId);

            spans.forEach(sp => {
                if (sp.start > curr) {
                    html += escapeHTML(rawText.slice(curr, sp.start));
                }
                let css = '';
                if (sp.bg) css += 'background-color:' + sp.bg + ';';
                if (sp.fg) css += 'color:' + sp.fg + ';';
                if (sp.bold) css += 'font-weight:900;';
                if (sp.italic) css += 'font-style:italic;';
                if (sp.underline) css += 'text-decoration:underline;';
                if (sp.uppercase) css += 'text-transform:uppercase;';
                if (sp.lowercase) css += 'text-transform:lowercase;';

                const subText = rawText.slice(sp.start, sp.end);
                const hlId = sp.id || ('hl_' + strId + '_' + targetField + '_' + sp.start + '_' + sp.end);
                html += '<span class="qp-hl-tag" data-hl-id="' + hlId + '" data-essay-id="' + strId + '" data-target-field="' + targetField + '" data-start="' + sp.start + '" data-end="' + sp.end + '" style="' + css + '">' + escapeHTML(subText) + '</span>';
                curr = sp.end;
            });

            if (curr < rawText.length) {
                html += escapeHTML(rawText.slice(curr));
            }
            return html;
        }

        function renderEssayFieldHighlights(contentEl, essayId, targetField) {
            if (!contentEl) return;
            const rawText = contentEl.dataset.rawText || contentEl.textContent || '';
            contentEl.dataset.rawText = rawText;

            const spans = getEssayFieldSpans(essayId, targetField);
            contentEl.innerHTML = renderEssayFieldHTML(rawText, spans, essayId, targetField);

            contentEl.querySelectorAll('.qp-hl-tag').forEach(tag => {
                tag.title = "Bấm để chọn, đổi màu hoặc xóa định dạng";
                tag.onclick = function(e) {
                    handleHighlightClick(tag.dataset.hlId, e);
                };
            });
        }

        async function applyStyleToEssayField(contentEl, essayId, targetField, newStart, newEnd, prop, val) {
            if (!contentEl || !essayId || !targetField) return;
            const rawText = contentEl.dataset.rawText || contentEl.textContent || '';
            contentEl.dataset.rawText = rawText;

            const sPos = Math.max(0, Math.min(newStart, newEnd));
            const ePos = Math.min(rawText.length, Math.max(newStart, newEnd));
            if (sPos >= ePos) return;

            const existingSpans = getEssayFieldSpans(essayId, targetField);

            // Xác định xem tất cả các ký tự trong vùng chọn [sPos, ePos] đã có kiểu này chưa
            // Nếu TẤT CẢ đã có kiểu -> Lần bấm/quẹt này sẽ TẮT (trở về bình thường)
            // Nếu CHƯA CÓ hoặc CHỈ MỘT PHẦN CÓ -> Lần bấm/quẹt này sẽ BẬT cho toàn bộ
            let allHaveTarget = true;
            let checkPos = sPos;
            while (checkPos < ePos) {
                const sp = existingSpans.find(s => s.start <= checkPos && s.end > checkPos);
                let hasIt = false;
                if (sp) {
                    if (prop === 'bold') hasIt = !!sp.bold;
                    else if (prop === 'italic') hasIt = !!sp.italic;
                    else if (prop === 'underline') hasIt = !!sp.underline;
                    else if (prop === 'uppercase') hasIt = !!sp.uppercase;
                    else if (prop === 'lowercase') hasIt = !!sp.lowercase;
                    else if (prop === 'bg') hasIt = (sp.bg === val);
                    else if (prop === 'fg') hasIt = (sp.fg === val);
                }
                if (!hasIt) {
                    allHaveTarget = false;
                    break;
                }
                checkPos = sp ? sp.end : (checkPos + 1);
            }

            // Thu thập toàn bộ các điểm mốc phân tách
            const points = new Set([0, rawText.length, sPos, ePos]);
            existingSpans.forEach(sp => {
                points.add(sp.start);
                points.add(sp.end);
            });
            const sortedPoints = Array.from(points).sort((a, b) => a - b);

            const newSpans = [];
            for (let i = 0; i < sortedPoints.length - 1; i++) {
                const pStart = sortedPoints[i];
                const pEnd = sortedPoints[i + 1];
                if (pStart >= pEnd) continue;

                const ex = existingSpans.find(sp => sp.start <= pStart && sp.end >= pEnd);
                let style = ex 
                    ? { ...ex, start: pStart, end: pEnd } 
                    : { start: pStart, end: pEnd, bg: null, fg: null, bold: false, italic: false, underline: false, uppercase: false, lowercase: false };

                // Áp dụng thao tác lên khoảng nằm trong vùng chọn [sPos, ePos]
                if (pStart >= sPos && pEnd <= ePos) {
                    if (prop === 'eraser') {
                        style.bg = null;
                        style.fg = null;
                        style.bold = false;
                        style.italic = false;
                        style.underline = false;
                        style.uppercase = false;
                        style.lowercase = false;
                    } else if (prop === 'clear_bg') {
                        style.bg = null;
                    } else if (prop === 'clear_fg') {
                        style.fg = null;
                    } else if (prop === 'bg') {
                        // Tô lần 2 cùng màu nền sẽ tự động bỏ màu nền (trở về ban đầu)
                        style.bg = (allHaveTarget || !val || val === 'clear') ? null : val;
                    } else if (prop === 'fg') {
                        // Tô lần 2 cùng màu chữ sẽ tự động bỏ màu chữ (trở về mặc định)
                        style.fg = (allHaveTarget || !val || val === 'clear') ? null : val;
                    } else if (prop === 'bold') {
                        style.bold = !allHaveTarget;
                    } else if (prop === 'italic') {
                        style.italic = !allHaveTarget;
                    } else if (prop === 'underline') {
                        style.underline = !allHaveTarget;
                    } else if (prop === 'uppercase') {
                        style.uppercase = !allHaveTarget;
                        if (style.uppercase) style.lowercase = false;
                    } else if (prop === 'lowercase') {
                        style.lowercase = !allHaveTarget;
                        if (style.lowercase) style.uppercase = false;
                    }
                }

                if (style.bg || style.fg || style.bold || style.italic || style.underline || style.uppercase || style.lowercase) {
                    newSpans.push(style);
                }
            }

            // Gộp các đoạn liền kề có kiểu dáng đồng nhất 100%
            const merged = [];
            for (const sp of newSpans) {
                const last = merged[merged.length - 1];
                if (last && last.end === sp.start &&
                    last.bg === sp.bg &&
                    last.fg === sp.fg &&
                    last.bold === sp.bold &&
                    last.italic === sp.italic &&
                    last.underline === sp.underline &&
                    last.uppercase === sp.uppercase &&
                    last.lowercase === sp.lowercase) {
                    last.end = sp.end;
                } else {
                    merged.push({ ...sp });
                }
            }

            // Cập nhật lại state.userHighlights
            if (!state.userHighlights) state.userHighlights = {};
            const strId = String(essayId);

            // Xóa các key cũ của thẻ này
            Object.keys(state.userHighlights).forEach(k => {
                const hl = state.userHighlights[k];
                if (hl && String(hl.essayId) === strId && hl.targetField === targetField) {
                    delete state.userHighlights[k];
                }
            });

            // Lưu các đoạn mới đã chuẩn hóa
            merged.forEach(sp => {
                const hlId = "hl_" + strId + "_" + targetField + "_" + sp.start + "_" + sp.end;
                sp.id = hlId;
                state.userHighlights[hlId] = {
                    id: hlId,
                    essayId: strId,
                    targetField: targetField,
                    start: sp.start,
                    end: sp.end,
                    charOffset: sp.start,
                    text: rawText.slice(sp.start, sp.end),
                    bg: sp.bg || null,
                    fg: sp.fg || null,
                    color: sp.bg || null,
                    textColor: sp.fg || null,
                    bold: !!sp.bold,
                    italic: !!sp.italic,
                    underline: !!sp.underline,
                    uppercase: !!sp.uppercase,
                    lowercase: !!sp.lowercase,
                    updatedAt: Date.now()
                };
            });

            // 1. Cập nhật DOM tức thì 0ms (siêu tốc, mượt mà tuyệt đối không độ trễ mạng)
            renderEssayFieldHighlights(contentEl, essayId, targetField);

            // 2. Lưu vào local storage tức thì
            saveHighlightsToStorage();

            // 3. Đồng bộ lên Firebase ngầm trong background (không chặn giao diện, có debounce)
            scheduleCloudHighlightSync();
        }

        let _cloudHlSyncTimer = null;
        function scheduleCloudHighlightSync() {
            if (!state.user || !state.user.uid || !SUBJECT_KEY) return;
            clearTimeout(_cloudHlSyncTimer);
            _cloudHlSyncTimer = setTimeout(async () => {
                try {
                    await db.ref("users/" + state.user.uid + "/highlights/" + SUBJECT_KEY).set(state.userHighlights || {});
                } catch(e) {
                    console.warn("Lỗi đồng bộ highlight lên mây:", e);
                }
            }, 600);
        }

        let currentSelectionOffsets = null;

        function applyCurrentSelectionStyle(prop, val) {
            if (currentSelectionOffsets) {
                const off = currentSelectionOffsets;
                currentSelectionOffsets = null;
                applyStyleToEssayField(off.contentEl, off.essayId, off.targetField, off.start, off.end, prop, val);
                hideHighlighterToolbar();
                return;
            }

            if (!currentSelectionRange) return;
            const container = currentSelectionRange.commonAncestorContainer;
            const el = container.nodeType === 1 ? container : container.parentElement;
            const contentEl = el ? el.closest('.highlightable-content') : null;
            if (!contentEl) return;

            const cardInfo = getEnclosingEssayCardInfo(contentEl);
            if (!cardInfo || !cardInfo.essayId || !cardInfo.targetField) return;

            const offsets = getRangeCharOffsets(contentEl, currentSelectionRange);
            if (!offsets) return;

            applyStyleToEssayField(contentEl, cardInfo.essayId, cardInfo.targetField, offsets.start, offsets.end, prop, val);
            hideHighlighterToolbar();
        }

        window.applyHighlightColor = async function(color, event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            applyCurrentSelectionStyle('bg', color);
        };

        window.applyTextColor = async function(color, event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            applyCurrentSelectionStyle('fg', color);
        };

        window.applyTextStyle = async function(styleType, event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            applyCurrentSelectionStyle(styleType, true);
        };

        window.clearHighlightBackground = async function(event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            applyCurrentSelectionStyle('clear_bg', null);
        };

        window.clearHighlightTextColor = async function(event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            applyCurrentSelectionStyle('clear_fg', null);
        };

        window.clearSelectionHighlight = async function(event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            applyCurrentSelectionStyle('eraser', null);
        };

        async function removeHighlightById(hlId, markElement, silent = false) {
            if (!hlId) return;
            const hl = state.userHighlights ? state.userHighlights[hlId] : null;
            if (hl && hl.essayId && hl.targetField && typeof hl.start === 'number' && typeof hl.end === 'number') {
                const card = document.getElementById('essay-card-' + hl.essayId);
                const scopeEl = card ? (hl.targetField === 'question' ? card.querySelector('.essay-question-text') : card.querySelector('.essay-answer-text')) : null;
                if (scopeEl) {
                    await applyStyleToEssayField(scopeEl, hl.essayId, hl.targetField, hl.start, hl.end, 'eraser', null);
                    return;
                }
            }
            if (state.userHighlights) delete state.userHighlights[hlId];
            saveHighlightsToStorage();
            restoreSavedHighlights();
            scheduleCloudHighlightSync();
        }

        function restoreSavedHighlights(targetEssayId = null) {
            if (state.studyMode !== 'essay') return;
            if (!state.userHighlights) return;

            const cards = targetEssayId 
                ? [document.getElementById('essay-card-' + targetEssayId)].filter(Boolean)
                : Array.from(document.querySelectorAll('#essay-content-wrapper [id^="essay-card-"]'));

            cards.forEach(card => {
                const essayId = card.dataset.essayId || card.id.replace('essay-card-', '');
                const qEl = card.querySelector('.essay-question-text');
                const aEl = card.querySelector('.essay-answer-text');

                if (qEl) renderEssayFieldHighlights(qEl, essayId, 'question');
                if (aEl) renderEssayFieldHighlights(aEl, essayId, 'answer');
            });
        }

        window.handleHighlightClick = async function(hlId, event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            const mark = document.querySelector('.qp-hl-tag[data-hl-id="' + hlId + '"]');
            if (!mark) return;

            const contentEl = mark.closest('.highlightable-content');
            if (!contentEl) return;
            const cardInfo = getEnclosingEssayCardInfo(contentEl);
            if (!cardInfo || !cardInfo.essayId || !cardInfo.targetField) return;

            const start = parseInt(mark.dataset.start, 10);
            const end = parseInt(mark.dataset.end, 10);
            if (isNaN(start) || isNaN(end)) return;

            // Nếu đang cầm cục tẩy -> Xóa vết này ngay
            if (state.brushPen && state.brushPen.kind === 'eraser') {
                await applyStyleToEssayField(contentEl, cardInfo.essayId, cardInfo.targetField, start, end, 'eraser', null);
                return;
            }
            if (state.brushPen && state.brushPen.kind === 'clear_bg') {
                await applyStyleToEssayField(contentEl, cardInfo.essayId, cardInfo.targetField, start, end, 'clear_bg', null);
                return;
            }
            if (state.brushPen && state.brushPen.kind === 'clear_fg') {
                await applyStyleToEssayField(contentEl, cardInfo.essayId, cardInfo.targetField, start, end, 'clear_fg', null);
                return;
            }
            if (state.brushPen && state.brushPen.kind === 'style') {
                await applyStyleToEssayField(contentEl, cardInfo.essayId, cardInfo.targetField, start, end, state.brushPen.value, true);
                return;
            }

            // Nếu đang cầm bút tô màu -> Đè màu mới lên ngay (hoặc nếu chạm lần 2 cùng màu thì tự động bỏ màu về ban đầu)
            if (state.brushPen && state.brushPen.value) {
                await applyStyleToEssayField(contentEl, cardInfo.essayId, cardInfo.targetField, start, end, state.brushPen.kind, state.brushPen.value);
                return;
            }

            // Nếu ở chế độ bình thường (không cầm bút):
            // Lưu lại vị trí chính xác của vết này
            currentSelectionOffsets = {
                contentEl: contentEl,
                essayId: cardInfo.essayId,
                targetField: cardInfo.targetField,
                start: start,
                end: end
            };

            const range = document.createRange();
            range.selectNodeContents(mark);
            const sel = window.getSelection();
            if (sel) {
                sel.removeAllRanges();
                sel.addRange(range);
            }
            currentSelectionRange = range.cloneRange();
            selectedHighlightText = mark.textContent;
            positionFloatingToolbar(range);
        };

            return `

        window.switchStudyMode = function(mode) {
            if (mode === 'scientific' && !hasWordMatchForSubject()) {
                mode = 'quiz';
            }
            if (state.studyMode === mode) return;
            state.studyMode = mode;
            if (mode !== 'essay') {
                state.brushPen = null;
                state.brushExpanded = false;
                clearBrushPreview();
                hideHighlighterToolbar();
            }

            const modeBar = document.getElementById('quiz-mode-bar-wrapper');
            const contentArea = document.getElementById('quiz-content-area');
            if (modeBar && contentArea) {
                modeBar.outerHTML = renderQuizModeBarHTML();
                updateQuizContentAreaDOM(true);
                let trackName = 'Quay lại phần Trắc nghiệm';
                if (mode === 'essay') trackName = 'Mở phần Tự luận & trọng tâm';
                if (mode === 'scientific') trackName = 'Luyện Ghép Tên Khoa Học';
                QPPresence.track(trackName);
                return;
            }

            render();
            let trackName = 'Quay lại phần Trắc nghiệm';
            if (mode === 'essay') trackName = 'Mở phần Tự luận & trọng tâm';
            if (mode === 'scientific') trackName = 'Luyện Ghép Tên Khoa Học';
            QPPresence.track(trackName);
        };

        window.toggleEssayReveal = function(id) {
            state.essayRevealed[id] = !isEssayItemRevealed(id);
            hideHighlighterToolbar();
            if (document.getElementById("essay-content-wrapper")) {
                syncEssayRevealItemDOM(id);
                syncEssayHeaderControls();
            } else {
                render();
            }
        };

        window.toggleAllEssayReveal = function(expandAll) {
            const list = getNormalizedEssayList();
            const targetState = (typeof expandAll === 'boolean')
                ? expandAll
                : !(list.length > 0 && list.every(item => isEssayItemRevealed(item.id)));
            list.forEach(item => {
                state.essayRevealed[item.id] = targetState;
            });
            hideHighlighterToolbar();
            if (document.getElementById("essay-content-wrapper")) {
                list.forEach(item => syncEssayRevealItemDOM(item.id));
                syncEssayHeaderControls(list);
            } else {
                render();
            }
        };

        window.toggleEssayLearned = async function(id) {
            state.essayLearned[id] = !state.essayLearned[id];
            if (state.user && state.user.uid && SUBJECT_KEY) {
                try {
                    localStorage.setItem("qp_essay_learned_" + state.user.uid + "_" + SUBJECT_KEY, JSON.stringify(state.essayLearned));
                } catch(e) {}
            }
            if (document.getElementById("essay-content-wrapper")) {
                syncEssayLearnedItemDOM(id);
                syncEssayHeaderControls();
            } else {
                render();
            }
            if (state.user && state.user.uid && SUBJECT_KEY) {
                try {
                    await db.ref("users/" + state.user.uid + "/essay_progress/" + SUBJECT_KEY + "/" + id).set(state.essayLearned[id]);
                } catch(e) {}
            }
        };

        const ESSAY_FONT_MIN = 12;
        const ESSAY_FONT_MAX = 26;
        const ESSAY_FONT_DEFAULT = 16;

        function getEssayFontStyleVars(sizePx) {
            const fs = Math.max(ESSAY_FONT_MIN, Math.min(ESSAY_FONT_MAX, parseInt(sizePx, 10) || ESSAY_FONT_DEFAULT));
            const qSize = fs + 2;
            const tagSize = Math.max(10, Math.min(15, fs - 4));
            const labelSize = Math.max(11, Math.min(16, fs - 3));
            const lh = state.essayLineHeight || 1.85;
            const qlh = (lh * 0.9).toFixed(2);
            return `--essay-font-size: ${fs}px; --essay-q-size: ${qSize}px; --essay-tag-size: ${tagSize}px; --essay-label-size: ${labelSize}px; --essay-line-height: ${lh}; --essay-q-line-height: ${qlh};`;
        }

        window.toggleEssayLineHeight = function() {
            const cur = state.essayLineHeight || 1.85;
            let next = 1.85;
            if (cur <= 1.7) next = 1.85;
            else if (cur < 2.0) next = 2.1;
            else next = 1.65;

            state.essayLineHeight = next;
            try { localStorage.setItem('qp_essay_line_height', String(next)); } catch(e) {}

            const el = document.getElementById("essay-content-wrapper");
            if (el) {
                el.style.setProperty("--essay-line-height", String(next));
                el.style.setProperty("--essay-q-line-height", String((next * 0.9).toFixed(2)));
            }
            const btn = document.getElementById("essay-line-height-btn");
            if (btn) {
                const lbl = next >= 2.0 ? 'Rộng' : (next <= 1.7 ? 'Vừa' : 'Thoáng');

        function getCmsPartName(part) {
            const n = parseInt(part, 10);
            if (!SUBJECT_INFO.parts || isNaN(n) || n < 1) return '';
            const p = SUBJECT_INFO.parts[n - 1];
            return (p && p.name) ? String(p.name).trim() : '';

        function getPartName(part, kind) {
            if (part === 'scientific' || part === 'Ghép từ & Thuật ngữ') return 'Ghép từ & Thuật ngữ';
            const titles = (TEST_DATA && TEST_DATA._part_titles) ? TEST_DATA._part_titles : {};
            const t = (kind === 'essay') ? (titles['essay_' + part] || titles[part]) : titles[part];
            if (t && String(t).trim()) return String(t).trim();
            const cms = getCmsPartName(part);
            if (cms && String(cms).trim()) return String(cms).trim();
            if (kind === 'essay') return 'Phần ' + part;
            const n = parseInt(part, 10);
            if (!isNaN(n)) return n < 10 ? ('Đề 0' + n) : ('Đề ' + n);
            return 'Đề ' + part;
        }

        function getEssayItemsOfPart(part) {
            if (!ESSAY_DATA || typeof ESSAY_DATA !== 'object') return [];
            const raw = ESSAY_DATA[part];
            const arr = Array.isArray(raw) ? raw : Object.values(raw || {});
            return arr.filter(it => it && (it.q || it.question));

        function normalizeWordItem(it, idx) {
            if (!it) return null;
            const hint = it.hint || it.vietnamese || it.q || it.question || ('Gợi ý ' + (idx + 1));
            const word = it.word || it.scientific || it.a || it.ans || it.answer || '';
            const note = it.note || it.family || '';
            return {
                id: it.id || ('wm_' + (idx + 1)),
                hint: hint,
                word: word,
                note: note
            };
        }

        function getWordMatchList() {
            // 1. Kiểm tra dữ liệu nạp từ web chính (index.html)
            if (TEST_DATA && Array.isArray(TEST_DATA._word_match) && TEST_DATA._word_match.length > 0) {
                return TEST_DATA._word_match.map(normalizeWordItem).filter(Boolean);
            }
            if (TEST_DATA && Array.isArray(TEST_DATA._scientific_names) && TEST_DATA._scientific_names.length > 0) {
                return TEST_DATA._scientific_names.map(normalizeWordItem).filter(Boolean);
            }
            // 2. Kiểm tra bộ nhớ cục bộ theo mã môn
            try {
                const raw = localStorage.getItem('qp_word_match_' + SUBJECT_KEY) || localStorage.getItem('qp_scientific_' + SUBJECT_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed.map(normalizeWordItem).filter(Boolean);
                }
            } catch(e) {}
            return [];
        }

        function ensureWordMatchGameLoaded() {
            const list = getWordMatchList();
            if (!state.wordMatchGame) {
                state.wordMatchGame = {
                    list: list,
                    currentIndex: 0,
                    slots: [],
                    tiles: [],
                    isCompleted: false,
                    isChecking: false,
                    results: {}
                };
            } else {
                state.wordMatchGame.list = list;
                if (!state.wordMatchGame.results) state.wordMatchGame.results = {};
            }

            if (!state.wordMatchGame.slots || state.wordMatchGame.slots.length === 0 || !state.wordMatchGame.tiles || state.wordMatchGame.tiles.length === 0) {
                setupWordMatchItem(state.wordMatchGame.currentIndex || 0);
            }
        }

        function setupWordMatchItem(index) {
            const list = state.wordMatchGame ? state.wordMatchGame.list : getWordMatchList();
            if (!list || list.length === 0) return;
            const safeIdx = Math.max(0, Math.min(index, list.length - 1));
            const item = list[safeIdx];
            const target = (item.word || '').trim();

            if (!state.wordMatchGame) ensureWordMatchGameLoaded();
            if (!state.wordMatchGame.results) state.wordMatchGame.results = {};
            const isAlreadyCorrect = state.wordMatchGame.results[safeIdx] === 'correct';

            // Phân tích các từ và ký tự cần ghép
            const words = target.split(/\s+/);
            const slots = [];
            const tileChars = [];

            let globalCharIdx = 0;
            words.forEach((w, wIdx) => {
                if (wIdx > 0) {
                    slots.push({ isSpace: true, id: 'sp_' + wIdx });
                }
                for (let i = 0; i < w.length; i++) {
                    const char = w[i];
                    slots.push({
                        isSpace: false,
                        slotIdx: globalCharIdx,
                        expectedChar: char,
                        placedChar: isAlreadyCorrect ? char : null,
                        displayChar: isAlreadyCorrect ? char.toUpperCase() : null,
                        tileId: isAlreadyCorrect ? ('tile_' + globalCharIdx) : null
                    });
                    tileChars.push({ id: 'tile_' + globalCharIdx, char: char.toUpperCase(), originalChar: char });
                    globalCharIdx++;
                }
            });

            if (!isAlreadyCorrect) {
                // Xáo trộn chữ cái trong kho gạch chữ (Fisher-Yates Shuffle)
                for (let i = tileChars.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    const temp = tileChars[i];
                    tileChars[i] = tileChars[j];
                    tileChars[j] = temp;
                }
            }

            const tiles = tileChars.map(t => ({
                id: t.id,
                char: t.char,
                originalChar: t.originalChar,
                isPlaced: isAlreadyCorrect
            }));

            state.wordMatchGame.currentIndex = safeIdx;
            state.wordMatchGame.slots = slots;
            state.wordMatchGame.tiles = tiles;
            state.wordMatchGame.isCompleted = isAlreadyCorrect;
            state.wordMatchGame.isChecking = false;
        }

        let _qpSharedAudioCtx = null;
        function getQPAudioContext() {
            try {
                if (!_qpSharedAudioCtx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) _qpSharedAudioCtx = new AudioCtx();
                }
                if (_qpSharedAudioCtx && _qpSharedAudioCtx.state === 'suspended') {
                    _qpSharedAudioCtx.resume().catch(() => {});
                }
                return _qpSharedAudioCtx;
            } catch(e) {
                return null;
            }
        }

        function playWordMatchWinSound() {
            try {
                const ctx = getQPAudioContext();
                if (!ctx) return;
                const now = ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + i * 0.08);
                    gain.gain.setValueAtTime(0.12, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.35);
                });
            } catch(e) {}
        }

        function playWordMatchClickSound() {
            try {
                const ctx = getQPAudioContext();
                if (!ctx) return;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.09);
            } catch(e) {}
        }

            ensureWordMatchGameLoaded();
            if (state.wordMatchGame.isCompleted || state.wordMatchGame.isChecking) return;
            const tile = state.wordMatchGame.tiles.find(t => t.id === tileId);
            if (!tile || tile.isPlaced) return;

            const emptySlot = state.wordMatchGame.slots.find(s => !s.isSpace && !s.placedChar);
            if (!emptySlot) return;

            emptySlot.placedChar = tile.originalChar;
            emptySlot.displayChar = tile.char;
            emptySlot.tileId = tile.id;
            tile.isPlaced = true;

        window.tapScientificSlot = function(slotIdx) {
            ensureWordMatchGameLoaded();
            if (state.wordMatchGame.isCompleted || state.wordMatchGame.isChecking) return;
            const slot = state.wordMatchGame.slots.find(s => !s.isSpace && s.slotIdx === slotIdx);
            if (!slot || !slot.placedChar || !slot.tileId) return;

            const tile = state.wordMatchGame.tiles.find(t => t.id === slot.tileId);
            if (tile) tile.isPlaced = false;

            slot.placedChar = null;
            slot.displayChar = null;
            slot.tileId = null;

            playWordMatchClickSound();
            refreshWordMatchDOM();
        };

        window.hintScientificNextLetter = function() {
            ensureWordMatchGameLoaded();
            if (state.wordMatchGame.isCompleted || state.wordMatchGame.isChecking) return;

            // 1. Tìm vị trí ô đầu tiên từ trái sang phải chưa đúng (hoặc ô trống, hoặc đã điền nhưng sai chữ)
            const targetSlot = state.wordMatchGame.slots.find(s => {
                if (s.isSpace) return false;
                if (!s.placedChar) return true;
                return s.placedChar.toLowerCase() !== s.expectedChar.toLowerCase();
            });

            if (!targetSlot) {
                // Toàn bộ các chữ đều đã chính xác -> Không tự động xác nhận, để người dùng tự chủ động bấm nút
                return;
            }

            const neededChar = targetSlot.expectedChar.toLowerCase();

            // 2. Nếu ô targetSlot này đang chứa chữ sai -> trả chữ sai đó về kho chữ cái
            if (targetSlot.placedChar && targetSlot.placedChar.toLowerCase() !== neededChar) {
                const wrongTile = state.wordMatchGame.tiles.find(t => t.id === targetSlot.tileId);
                if (wrongTile) wrongTile.isPlaced = false;
                targetSlot.placedChar = null;
                targetSlot.displayChar = null;
                targetSlot.tileId = null;
            }

            // 3. Tìm chữ cái phù hợp để đặt vào ô:
            // Ưu tiên 1: Chữ cái đang rảnh trong kho (!t.isPlaced)
            let candidateTile = state.wordMatchGame.tiles.find(t => !t.isPlaced && t.originalChar.toLowerCase() === neededChar);

            // Ưu tiên 2: Nếu trong kho đã hết (do người dùng đặt nhầm vào 1 ô khác ở sau), rút chữ đó về
            if (!candidateTile) {
                const holderSlot = state.wordMatchGame.slots.find(s => 
                    !s.isSpace && s.slotIdx !== targetSlot.slotIdx && 
                    s.placedChar && s.placedChar.toLowerCase() === neededChar &&
                    s.placedChar.toLowerCase() !== s.expectedChar.toLowerCase()
                );
                if (holderSlot) {
                    candidateTile = state.wordMatchGame.tiles.find(t => t.id === holderSlot.tileId);
                    holderSlot.placedChar = null;
                    holderSlot.displayChar = null;
                    holderSlot.tileId = null;
                    if (candidateTile) candidateTile.isPlaced = false;
                }
            }

            // Ưu tiên 3: Quét bất kỳ tile nào khớp ký tự dự phòng
            if (!candidateTile) {
                candidateTile = state.wordMatchGame.tiles.find(t => t.originalChar.toLowerCase() === neededChar);
                if (candidateTile) {
                    const prevSlot = state.wordMatchGame.slots.find(s => s.tileId === candidateTile.id);
                    if (prevSlot) {
                        prevSlot.placedChar = null;
                        prevSlot.displayChar = null;
                        prevSlot.tileId = null;
                    }
                    candidateTile.isPlaced = false;
                }
            }

            if (!candidateTile) {
                return;
            }

            // 4. Đặt trực tiếp đồng bộ candidateTile vào targetSlot (KHÔNG tự nhảy, KHÔNG tự xác nhận, KHÔNG hiện thông báo toast)
            targetSlot.placedChar = candidateTile.originalChar;
            targetSlot.displayChar = candidateTile.char;
            targetSlot.tileId = candidateTile.id;
            candidateTile.isPlaced = true;

            playWordMatchClickSound();
            refreshWordMatchDOM();
        };

        function saveWordMatchHistoryToLocal() {
            ensureWordMatchGameLoaded();
            const list = state.wordMatchGame.list || [];
            const results = state.wordMatchGame.results || {};
            let correctCount = 0;
            let wrongCount = 0;
            list.forEach((item, idx) => {
                if (results[idx] === 'correct') correctCount++;
                else wrongCount++;
            });

            const record = {
                id: Date.now(),
                date: new Date().toLocaleString('vi-VN'),
                part: 'scientific',
                mode: 'scientific',
                score: correctCount,
                wrong: wrongCount,
                total: list.length,
                details: list.map((item, idx) => ({
                    id: idx,
                    q: item.hint || 'Gợi ý ghép từ',
                    o: [item.word],
                    s: results[idx] === 'correct' ? item.word : (results[idx] ? 'Chưa đúng' : 'Chưa ghép'),
                    c: item.word
                }))
            };

            if (!Array.isArray(state.history)) state.history = [];
            state.history.unshift(record);
            if (state.history.length > 50) state.history = state.history.slice(0, 50);

            try {

        window.confirmWordMatchAnswer = function() {
            ensureWordMatchGameLoaded();
            if (state.wordMatchGame.isCompleted) return;

            const list = state.wordMatchGame.list;
            const curIdx = state.wordMatchGame.currentIndex;
            const curItem = list[curIdx];
            const target = (curItem.word || '').trim();

            let userSpelling = '';
            state.wordMatchGame.slots.forEach(s => {
                if (s.isSpace) userSpelling += ' ';
                else userSpelling += (s.placedChar || '');
            });

            if (!state.wordMatchGame.results) state.wordMatchGame.results = {};

            if (userSpelling.trim().toLowerCase() === target.toLowerCase()) {
                state.wordMatchGame.isCompleted = true;
                state.wordMatchGame.hasError = false;
                state.wordMatchGame.results[curIdx] = 'correct';
                playWordMatchWinSound();
                refreshWordMatchDOM();
            } else {
                state.wordMatchGame.isChecking = true;
                state.wordMatchGame.results[curIdx] = 'wrong';
                refreshWordMatchDOM(true);
                setTimeout(() => {
                    state.wordMatchGame.isChecking = false;
                    refreshWordMatchDOM();
                }, 700);
            }
        };

                                    <span>🗑️ Xóa từ này</span>
                                </button>
                            </div>

                    ` : ''}

                    <!-- THANH TIÊU ĐỀ & CHỈ SỐ ĐÚNG SAI GIỐNG TRẮC NGHIỆM -->
                    <div class="flex items-center justify-between gap-3 p-3.5 sm:p-4 rounded-3xl bg-white/90 dark:bg-slate-900/90 border border-slate-200/80 dark:border-slate-800 shadow-sm backdrop-blur-md flex-wrap">
                        <div class="flex items-center gap-2.5">
                            <span class="w-9 h-9 rounded-2xl bg-gradient-to-br from-emerald-500 via-teal-500 to-cyan-600 text-white flex items-center justify-center font-black text-base shadow-md shadow-teal-500/25">🧩</span>
                            <div>

                                </h3>

                        <!-- CỤM THỐNG KÊ ĐÚNG / SAI CHUẨN XÁC NHƯ TRẮC NGHIỆM -->
                        <div class="flex items-center gap-1.5 sm:gap-2 ml-auto flex-wrap">
                            <div class="flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400 font-black text-xs bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 px-2.5 sm:px-3 py-1.5 rounded-xl font-mono shadow-sm" title="Số từ đã ghép chính xác">

                                <span id="wm-correct-badge-count">${correctCount} Đúng</span>

                            <div class="flex items-center gap-1.5 text-rose-600 dark:text-rose-400 font-black text-xs bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 px-2.5 sm:px-3 py-1.5 rounded-xl font-mono shadow-sm" title="Số từ ghép chưa đúng">

                    <!-- THẺ TRÒ CHƠI CHÍNH -->
                    ${renderWordMatchGameCardInner()}

                    <!-- HỘP THOẠI HOÀN THÀNH BÀI GHÉP TỪ VỚI TÙY CHỌN LÀM LẠI HOẶC VỀ TRANG CHỦ -->
                    ${(state.wordMatchGame && state.wordMatchGame.showCompletionModal) ? `
                        <div class="fixed inset-0 bg-slate-950/75 backdrop-blur-md z-[120] flex items-center justify-center p-4 animate-enter" onclick="event.stopPropagation()">
                            <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-2xl border border-slate-200 dark:border-slate-800 text-center space-y-4">
                                <div class="w-16 h-16 mx-auto rounded-3xl bg-gradient-to-br from-emerald-500 to-teal-600 text-white flex items-center justify-center text-3xl font-black shadow-lg shadow-emerald-500/30">
                                    🏆
                                </div>
                                <div>
                                    <h3 class="text-xl font-black text-slate-800 dark:text-white uppercase tracking-tight">Hoàn thành bài tập!</h3>
                                    <p class="text-xs text-slate-500 dark:text-slate-400 font-medium mt-1">Kết quả luyện tập đã được lưu vào Lịch sử bài làm.</p>
                                </div>
                                <div class="grid grid-cols-2 gap-3 p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-700/80">
                                    <div class="text-center">
                                        <div class="text-2xl font-black text-emerald-600 dark:text-emerald-400 font-mono">${correctCount}</div>
                                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Từ ghép đúng</div>
                                    </div>
                                    <div class="text-center">
                                        <div class="text-2xl font-black text-rose-500 font-mono">${wrongCount}</div>
                                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Từ chưa đúng</div>
                                    </div>
                                </div>
                                <div class="space-y-2 pt-1">
                                    <button type="button" onclick="state.wordMatchGame.showCompletionModal = false; state.wordMatchGame.results = {}; setupWordMatchItem(0); refreshWordMatchDOM();" class="w-full py-3 px-4 rounded-2xl bg-gradient-to-r from-emerald-500 via-teal-600 to-cyan-600 text-white font-black text-xs sm:text-sm uppercase tracking-wider shadow-lg shadow-emerald-500/25 hover:scale-[1.02] active:scale-95 transition-all cursor-pointer flex items-center justify-center gap-2">
                                        <span>↺ Làm lại từ đầu</span>
                                    </button>
                                    <button type="button" onclick="state.wordMatchGame.showCompletionModal = false; resetQuiz();" class="w-full py-3 px-4 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-bold text-xs sm:text-sm uppercase tracking-wider transition-all cursor-pointer flex items-center justify-center gap-2">
                                        <span>🏠 Về trang chủ</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderWordMatchGameCardInner(hasError = false) {
            ensureWordMatchGameLoaded();
            const list = state.wordMatchGame.list;
            const curIdx = state.wordMatchGame.currentIndex;
            const item = list[curIdx] || { hint: 'Đang tải...', word: '', note: '' };
            const isDone = !!state.wordMatchGame.isCompleted;
            const isAnswered = isDone || (state.wordMatchGame.results && !!state.wordMatchGame.results[curIdx]);
            const allFilled = state.wordMatchGame.slots.every(s => s.isSpace || !!s.placedChar);
            const totalChars = state.wordMatchGame.slots.filter(s => !s.isSpace).length;
            const placedCount = state.wordMatchGame.slots.filter(s => !s.isSpace && !!s.placedChar).length;



            // Nhóm các ô slot theo từng từ (word groups)
            const wordGroups = [];
            let currentWord = [];
            state.wordMatchGame.slots.forEach(s => {
                if (s.isSpace) {
                    if (currentWord.length > 0) {
                        wordGroups.push(currentWord);
                        currentWord = [];
                    }
                } else {
                    currentWord.push(s);
                }
            });
            if (currentWord.length > 0) wordGroups.push(currentWord);

            // Tự động tính kích thước ô slot trên sàn ghép: TO RÕ VÀ ĐẲNG CẤP NHƯ KHO CHỮ CÁI
            const maxWordLen = Math.max(...wordGroups.map(wg => wg.length), 1);
            let slotSizeClass = "w-10 h-12 sm:w-12 sm:h-14 md:w-13 md:h-15 text-lg sm:text-xl md:text-2xl font-black rounded-xl sm:rounded-2xl";
            let slotGapClass = "gap-1.5 sm:gap-2";
            if (maxWordLen >= 11) {
                slotSizeClass = "w-9 h-11 sm:w-11 sm:h-13 md:w-12 md:h-14 text-base sm:text-lg md:text-xl font-black rounded-xl sm:rounded-2xl";
                slotGapClass = "gap-1 sm:gap-1.5";
            } else if (maxWordLen <= 6) {
                slotSizeClass = "w-11 h-13 sm:w-13 sm:h-15 md:w-14 md:h-16 text-xl sm:text-2xl md:text-3xl font-black rounded-2xl";
                slotGapClass = "gap-2 sm:gap-2.5";

            return `

                        <span class="px-2.5 py-1 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-mono text-[10px] sm:text-xs">Từ ${curIdx + 1} / ${list.length}</span>
                        <div class="flex-1 h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden mx-1.5">
