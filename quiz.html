        // Hộp thoại xác nhận tùy chỉnh giao diện đẹp mắt (thay thế confirm mặc định)
        window.showCustomConfirm = function(title, message, okText = "Đồng ý", cancelText = "Hủy", isDanger = false) {
            return new Promise((resolve) => {
                const modal = document.getElementById("custom-confirm-modal");
                if (!modal) {
                    resolve(window.confirm(message));
                    return;
                }
                const titleEl = document.getElementById("confirm-modal-title");
                const msgEl = document.getElementById("confirm-modal-msg");
                const btnOk = document.getElementById("confirm-btn-ok");
                const btnCancel = document.getElementById("confirm-btn-cancel");

                if (titleEl) titleEl.innerText = title;
                if (msgEl) msgEl.innerText = message;
                if (btnCancel) btnCancel.innerText = cancelText;

                if (btnOk) {
                    btnOk.innerText = okText;
                    if (isDanger) {
                        btnOk.className = "flex-1 py-2.5 rounded-xl bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-600 hover:to-red-700 text-xs font-black text-white shadow-lg shadow-rose-500/25 transition-all active:scale-95";
                    } else {
                        btnOk.className = "flex-1 py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-brand-600 hover:from-emerald-600 hover:to-brand-700 text-xs font-black text-white shadow-lg shadow-brand-500/25 transition-all active:scale-95";
                    }
                }

                modal.classList.remove("hidden");

                const cleanup = () => {
                    modal.classList.add("hidden");
                    btnOk.removeEventListener("click", onOk);
                    btnCancel.removeEventListener("click", onCancel);
                };

                const onOk = () => { cleanup(); resolve(true); };
                const onCancel = () => { cleanup(); resolve(false); };

                btnOk.addEventListener("click", onOk);
                btnCancel.addEventListener("click", onCancel);
            });
        };

        // Bấm trực tiếp vào vết highlight để xóa (hiện hộp thoại đẹp có khung khi đang tắt bút)
        window.handleHighlightClick = async function(hlId, event) {
            if (state.brushPen) {
                if (state.brushPen.kind === 'eraser') {
                    if (event) { event.preventDefault(); event.stopPropagation(); }
                    const mark = document.querySelector(`.qp-hl-tag[data-hl-id="${hlId}"]`);
                    await removeHighlightById(hlId, mark);
                }
                return;
            }
            if (event) { event.preventDefault(); event.stopPropagation(); }

            const mark = document.querySelector(`.qp-hl-tag[data-hl-id="${hlId}"]`);
            const snippet = mark ? mark.innerText.trim().slice(0, 45) : "";
            const msg = snippet 
                ? `Bạn có muốn gỡ bỏ vết tô màu cho cụm từ: "${snippet}" không?`
                : "Bạn có muốn gỡ bỏ vết dạ quang này khỏi nội dung bài học không?";

            const confirmed = await showCustomConfirm(
                "XÓA VẾT DẠ QUANG",
                msg,
                "🗑️ Xóa vết màu",
                "Giữ lại",
                true
            );

            if (confirmed) {
                await removeHighlightById(hlId, mark);
            }
        };

        // Nút '🧹 Xóa' trên thanh công cụ Floating Toolbar
        window.clearSelectionHighlight = async function(event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            if (state.studyMode !== 'essay') {
                hideHighlighterToolbar();
                return;
            }

            let tagsToRemove = [];

            // 1. Quét tìm các thẻ .qp-hl-tag trong hoặc chứa vùng chọn
            if (currentSelectionRange) {
                const container = currentSelectionRange.commonAncestorContainer;
                const parent = container.nodeType === 1 ? container : container.parentElement;

                const enclosing = parent ? parent.closest('.qp-hl-tag') : null;
                if (enclosing && !tagsToRemove.includes(enclosing)) {
                    tagsToRemove.push(enclosing);
                }

                if (parent && parent.querySelectorAll) {
                    parent.querySelectorAll('.qp-hl-tag').forEach(tag => {
                        try {
                            if (currentSelectionRange.intersectsNode(tag)) {
                                if (!tagsToRemove.includes(tag)) tagsToRemove.push(tag);
                            }
                        } catch(e) {
                            if (!tagsToRemove.includes(tag)) tagsToRemove.push(tag);
                        }
                    });
                }
            }

            // 2. Thử thêm qua window.getSelection nếu có
            const sel = window.getSelection();
            if (sel && sel.rangeCount > 0 && tagsToRemove.length === 0) {
                try {
                    const r = sel.getRangeAt(0);
                    const c = r.commonAncestorContainer;
                    const p = c.nodeType === 1 ? c : c.parentElement;
                    const enc = p ? p.closest('.qp-hl-tag') : null;
                    if (enc && !tagsToRemove.includes(enc)) tagsToRemove.push(enc);
                    if (p && p.querySelectorAll) {
                        p.querySelectorAll('.qp-hl-tag').forEach(tag => {
                            try {
                                if (r.intersectsNode(tag)) {
                                    if (!tagsToRemove.includes(tag)) tagsToRemove.push(tag);
                                }
                            } catch(e) {}
                        });
                    }
                } catch(e) {}
            }

            // 3. Nếu vùng chọn chứa đoạn text trùng với 1 thẻ .qp-hl-tag trên trang
            if (tagsToRemove.length === 0 && selectedHighlightText) {
                const normSel = selectedHighlightText.trim().toLowerCase();
                document.querySelectorAll('#essay-content-wrapper .qp-hl-tag').forEach(tag => {
                    const tagTxt = (tag.innerText || "").trim().toLowerCase();
                    if (tagTxt && (tagTxt.includes(normSel) || normSel.includes(tagTxt))) {
                        if (!tagsToRemove.includes(tag)) tagsToRemove.push(tag);
                    }
                });
            }

            if (tagsToRemove.length === 0) {
                showAntiCheatToast("ℹ️ Hãy bôi đen vào đoạn chữ đã tô màu hoặc bấm trực tiếp vào vết màu để xóa!");
                hideHighlighterToolbar();
                return;
            }

            for (const tag of tagsToRemove) {
                const hlId = tag.dataset.hlId;
                if (hlId) {
                    await removeHighlightById(hlId, tag);
                } else {
                    const parent = tag.parentNode;
                    if (parent) {
                        while (tag.firstChild) parent.insertBefore(tag.firstChild, tag);
                        parent.removeChild(tag);
                    }
                }
            }

            if (sel) sel.removeAllRanges();
            currentSelectionRange = null;
            selectedHighlightText = "";
            hideHighlighterToolbar();
            showAntiCheatToast("🧹 Đã xóa thành công " + tagsToRemove.length + " vết tô màu!");
        };

        // Gỡ bỏ highlight theo ID và đồng bộ lên LocalStorage + Firebase
        async function removeHighlightById(hlId, markElement, silent = false) {
            if (!markElement && hlId) {
                markElement = document.querySelector(`.qp-hl-tag[data-hl-id="${hlId}"]`);
            }
            if (markElement) {
                const parent = markElement.parentNode;
                if (parent) {
                    while (markElement.firstChild) {
                        parent.insertBefore(markElement.firstChild, markElement);
                    }
                    parent.removeChild(markElement);
                    parent.normalize();
                }
            }
            delete state.userHighlights[hlId];
            saveHighlightsToStorage();
            if (state.user && state.user.uid && SUBJECT_KEY) {
                try {
                    await db.ref("users/" + state.user.uid + "/highlights/" + SUBJECT_KEY + "/" + hlId).remove();
                } catch(e) {}
            }
            if (!silent) {
                showAntiCheatToast("🧹 Đã xóa đánh dấu dạ quang!");
            }
        }

        function restoreSavedHighlights() {
            if (state.studyMode !== 'essay') return;
            if (!state.userHighlights || Object.keys(state.userHighlights).length === 0) return;
            const container = document.getElementById('essay-content-wrapper');
            if (!container) return;

            const hlList = Object.values(state.userHighlights);
            hlList.forEach(hl => {
                if (!hl || !hl.text || hl.text.length < 2) return;
                highlightTextInElement(container, hl);
            });
        }

        function highlightTextInElement(element, hl) {
            const innerHTML = element.innerHTML;
            if (innerHTML.includes('data-hl-id="' + hl.id + '"')) return;

            const searchStr = hl.text;
            const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            let node;
            const nodesToReplace = [];

            while (node = walker.nextNode()) {
                if (node.parentElement && node.parentElement.closest('.qp-hl-tag')) continue;
                if (node.nodeValue && node.nodeValue.includes(searchStr)) {
                    nodesToReplace.push(node);
                }
            }

            nodesToReplace.forEach(textNode => {
                const val = textNode.nodeValue;
                const idx = val.indexOf(searchStr);
                if (idx >= 0) {
                    const before = val.substring(0, idx);
                    const match = val.substring(idx, idx + searchStr.length);
                    const after = val.substring(idx + searchStr.length);

                    const frag = document.createDocumentFragment();
                    if (before) frag.appendChild(document.createTextNode(before));

                    const mark = document.createElement(hl.color ? 'mark' : 'span');
                    mark.className = 'qp-hl-tag';
                    mark.dataset.hlId = hl.id;
                    if (hl.color) {
                        mark.style.backgroundColor = hl.color;
                        mark.style.color = '#0f172a';
                        mark.style.fontWeight = 'bold';
                    }
                    if (hl.textColor) {
                        mark.style.color = hl.textColor;
                        mark.style.fontWeight = 'bold';
                    }
                    if (hl.styleType === 'bold') mark.style.fontWeight = '900';
                    else if (hl.styleType === 'italic') mark.style.fontStyle = 'italic';
                    else if (hl.styleType === 'underline') mark.style.textDecoration = 'underline';
                    else if (hl.styleType === 'uppercase') mark.style.textTransform = 'uppercase';

                    mark.textContent = match;
                    mark.title = "Bấm để xóa đánh dấu / định dạng";
                    mark.onclick = function(e) { handleHighlightClick(hl.id, e); };
                    frag.appendChild(mark);

                    if (after) frag.appendChild(document.createTextNode(after));
                    textNode.parentNode.replaceChild(frag, textNode);
                }
            });
        }

                revealLabel.textContent = isRevealed ? '👁️ Ẩn gợi ý & đáp án' : '💡 Xem gợi ý & đáp án chuẩn';
            }
        }

        function syncEssayLearnedItemDOM(id) {
            const isLearned = !!state.essayLearned[id];
            const cardEl = document.getElementById("essay-card-" + id);
            if (cardEl) {
                cardEl.className = getEssayCardClass(isLearned);
            }
            const learnedBtn = document.getElementById("essay-learned-btn-" + id);
            if (learnedBtn) {
                learnedBtn.className = getEssayLearnedBtnClass(isLearned);
                learnedBtn.title = isLearned ? 'Đã thuộc (Bấm để hủy)' : 'Đánh dấu đã thuộc';
            }
        }

        window.switchStudyMode = function(mode) {
            if (state.studyMode === mode) return;
            state.studyMode = mode;
            if (mode !== 'essay') {
                state.brushPen = null;
                state.brushExpanded = false;
            }
            clearBrushPreview();
            hideHighlighterToolbar();
            render();
        };

        window.toggleEssayReveal = function(id) {
            state.essayRevealed[id] = !isEssayItemRevealed(id);
            hideHighlighterToolbar();
            if (document.getElementById("essay-content-wrapper")) {
                syncEssayRevealItemDOM(id);
                syncEssayHeaderControls();
            } else {
                render();
            }
        };

        window.toggleAllEssayReveal = function(expandAll) {
            const list = getNormalizedEssayList();
            const targetState = (typeof expandAll === 'boolean')
                ? expandAll
                : !(list.length > 0 && list.every(item => isEssayItemRevealed(item.id)));
            list.forEach(item => {
                state.essayRevealed[item.id] = targetState;
            });
            hideHighlighterToolbar();
            if (document.getElementById("essay-content-wrapper")) {
                list.forEach(item => syncEssayRevealItemDOM(item.id));
                syncEssayHeaderControls(list);
            } else {
                render();
            }
        };

        window.toggleEssayLearned = async function(id) {
            state.essayLearned[id] = !state.essayLearned[id];
            if (state.user && state.user.uid && SUBJECT_KEY) {
                try {
                    localStorage.setItem("qp_essay_learned_" + state.user.uid + "_" + SUBJECT_KEY, JSON.stringify(state.essayLearned));
                } catch(e) {}
            }
            if (document.getElementById("essay-content-wrapper")) {
                syncEssayLearnedItemDOM(id);
                syncEssayHeaderControls();
            } else {
                render();
            }
            if (state.user && state.user.uid && SUBJECT_KEY) {
                try {
                    await db.ref("users/" + state.user.uid + "/essay_progress/" + SUBJECT_KEY + "/" + id).set(state.essayLearned[id]);
                } catch(e) {}
            }
        };

        const ESSAY_FONT_MIN = 12;
        const ESSAY_FONT_MAX = 26;
        const ESSAY_FONT_DEFAULT = 16;

        function getEssayFontStyleVars(sizePx) {
            const fs = Math.max(ESSAY_FONT_MIN, Math.min(ESSAY_FONT_MAX, parseInt(sizePx, 10) || ESSAY_FONT_DEFAULT));
            const qSize = fs + 2;
            const tagSize = Math.max(10, Math.min(15, fs - 4));
            const labelSize = Math.max(11, Math.min(16, fs - 3));
            return `--essay-font-size: ${fs}px; --essay-q-size: ${qSize}px; --essay-tag-size: ${tagSize}px; --essay-label-size: ${labelSize}px;`;
        }

        function applyEssayFontSizeDOM(sizePx) {
            const fs = Math.max(ESSAY_FONT_MIN, Math.min(ESSAY_FONT_MAX, parseInt(sizePx, 10) || ESSAY_FONT_DEFAULT));
            state.essayFontSize = fs;
            try { localStorage.setItem("qp_essay_font_size", String(fs)); } catch(e) {}

            const el = document.getElementById("essay-content-wrapper");
            if (el) {
                el.style.setProperty("--essay-font-size", fs + "px");
                el.style.setProperty("--essay-q-size", (fs + 2) + "px");
                el.style.setProperty("--essay-tag-size", Math.max(10, Math.min(15, fs - 4)) + "px");
                el.style.setProperty("--essay-label-size", Math.max(11, Math.min(16, fs - 3)) + "px");
            }
            const disp = document.getElementById("essay-font-display");
            if (disp) disp.textContent = fs + "px";
            const barDisp = document.getElementById("essay-bar-font-display");
            if (barDisp) barDisp.textContent = fs + "px";

            const decBtn = document.getElementById("essay-font-dec-btn");
            if (decBtn) decBtn.disabled = (fs <= ESSAY_FONT_MIN);
            const barDecBtn = document.getElementById("essay-bar-font-dec-btn");
            if (barDecBtn) barDecBtn.disabled = (fs <= ESSAY_FONT_MIN);

            const incBtn = document.getElementById("essay-font-inc-btn");
            if (incBtn) incBtn.disabled = (fs >= ESSAY_FONT_MAX);
            const barIncBtn = document.getElementById("essay-bar-font-inc-btn");
            if (barIncBtn) barIncBtn.disabled = (fs >= ESSAY_FONT_MAX);
        }

        window.changeEssayFontSize = function(deltaPx) {
            const current = state.essayFontSize || ESSAY_FONT_DEFAULT;
            const next = Math.max(ESSAY_FONT_MIN, Math.min(ESSAY_FONT_MAX, current + deltaPx));
            applyEssayFontSizeDOM(next);
        };

        window.resetEssayFontSize = function() {
            applyEssayFontSizeDOM(ESSAY_FONT_DEFAULT);
        };

        // Tương thích ngược nếu được gọi từ mã cũ
        window.changeEssayZoom = function(delta) {
            window.changeEssayFontSize(delta > 0 ? 2 : -2);
        };

        function getNormalizedEssayList() {
            let essayList = [];
            const partTitles = (TEST_DATA && TEST_DATA._part_titles) ? TEST_DATA._part_titles : {};

            if (ESSAY_DATA && typeof ESSAY_DATA === 'object') {
                const sortedParts = Object.keys(ESSAY_DATA)
                    .filter(p => !p.startsWith('_'))
                    .sort((a, b) => Number(a) - Number(b));

                sortedParts.forEach(part => {
                    const items = Array.isArray(ESSAY_DATA[part]) ? ESSAY_DATA[part] : Object.values(ESSAY_DATA[part] || {});
                    const pTitle = partTitles['essay_' + part] || ((ESSAY_DATA._part_titles && ESSAY_DATA._part_titles[part]) ? ESSAY_DATA._part_titles[part] : (sortedParts.length > 1 ? ('Phần ' + part) : ''));

                    items.forEach((it, idx) => {
                        if (it && (it.q || it.question)) {
                            essayList.push({
                                id: 'p' + part + '_q' + (idx + 1),
                                question: it.q || it.question,
                                answer: it.a || it.ans || it.answer || "Đang cập nhật đáp án chi tiết...",
                                keywords: it.keywords || it.tags || [],
                                part: part,
                                partTitle: pTitle
                            });
                        }
                    });
                });
            }

            return essayList;
        }

                                <button id="essay-font-dec-btn" type="button" onclick="changeEssayFontSize(-2)" ${currentFontSize <= ESSAY_FONT_MIN ? 'disabled' : ''} class="px-2 h-7 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-black text-[11px] transition-colors cursor-pointer disabled:opacity-35 disabled:cursor-not-allowed" title="Giảm cỡ chữ (-2px)">A-</button>

                        ${essayList.map((item, index) => {

                                            <div class="space-y-1 flex-1">
                                                ${item.partTitle ? `<span class="inline-block essay-keyword-tag font-black uppercase tracking-wider px-2 py-0.5 rounded-md bg-emerald-50 dark:bg-emerald-950/50 text-brand-600 dark:text-emerald-400 border border-emerald-200/60 dark:border-emerald-800/60 mb-0.5">📑 ${escapeHTML(item.partTitle)}</span>` : ''}

                        <div class="h-2.5 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden shadow-inner"><div class="h-full bg-gradient-to-r from-emerald-400 to-teal-500 transition-all rounded-full" style="width: ${progress}%"></div></div>
                    </div>
                    
                    <div class="w-full bg-white dark:bg-slate-900 p-6 sm:p-10 rounded-3xl shadow-xl border border-slate-100 dark:border-slate-800/60 mb-24 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-brand-500 to-emerald-600"></div>
                        
                        <div>
                            <div class="mb-6">
                                <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                                    <span class="inline-block bg-slate-50 dark:bg-slate-800 text-slate-400 dark:text-slate-500 text-[10px] font-extrabold px-2.5 py-1 rounded-md tracking-wider border border-slate-100">ID: #${escapeHTML(currentQ.id)}</span>
                                    <span class="text-[10px] font-black tracking-wider uppercase px-2.5 py-1 rounded-full ${currentQ.isMultiple ? 'bg-amber-50 text-amber-600 border border-amber-200' : 'bg-teal-50 text-teal-600 border border-teal-200'}">
                                        ${currentQ.isMultiple ? "☑ Tích chọn nhiều đáp án" : "🔘 Chọn một đáp án"}
                                    </span>
                                </div>
                                <h2 class="text-lg sm:text-xl font-black text-slate-800 dark:text-slate-100 leading-snug tracking-tight">${escapeHTML(currentQ.q)}</h2>
                            </div>
                            
                            <div class="space-y-3.5">
                                ${state.shuffledOptions.map((option) => {
                                    const isSelected = state.selectedOptions.includes(option.key);
                                    const isOptCorrect = currentQ.correct.split('').includes(option.key);
                                    
                                    let containerClass = "w-full p-4 sm:p-5 rounded-2xl border text-left font-semibold transition-all duration-200 transform active:scale-[0.98] flex justify-between items-center relative overflow-hidden text-xs sm:text-sm ";
                                    
                                    if (state.isSubmitted) {
                                      containerClass += " active:scale-100 cursor-not-allowed "; 
                                      if (isOptCorrect) containerClass += "border-emerald-500 bg-emerald-50 dark:bg-emerald-950/30 text-emerald-800 dark:text-emerald-300 ring-2 ring-emerald-200 dark:ring-emerald-900/40 shadow-inner";
                                      else if (isSelected) containerClass += "border-rose-500 bg-rose-50 dark:bg-rose-950/30 text-rose-800 dark:text-rose-300 ring-2 ring-rose-200 shadow-inner";
                                      else containerClass += "border-slate-100 dark:border-slate-800 text-slate-400 opacity-50";
                                    } else {
                                      if (isSelected) containerClass += "border-emerald-500 bg-emerald-50/60 dark:bg-slate-800/80 text-emerald-900 dark:text-teal-300 ring-2 ring-emerald-200 dark:ring-emerald-900/40 shadow-md -translate-y-0.5";
                                      else containerClass += "border-slate-100 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-brand-50/40 hover:border-brand-200 hover:shadow-sm hover:-translate-y-0.5";
                                    }

                                    return `
                                        <button onclick="handleOptionSelect('${option.key}', ${currentQ.isMultiple})" ${state.isSubmitted ? 'disabled' : ''} class="${containerClass}">
                                            <div class="flex items-center gap-3.5 relative z-10">
                                                <div class="w-5 h-5 flex items-center justify-center border-2 flex-shrink-0 rounded-md transition-colors ${isSelected ? 'border-brand-500 bg-brand-500 text-white' : 'border-slate-300 bg-white dark:bg-slate-900'}">
                                                    ${isSelected ? '<svg class="w-3 h-3 fill-current" viewBox="0 0 20 20"><path d="M0 11l2-2 5 5L18 3l2 2L7 18z"/></svg>' : ''}
                                                </div>
                                                <span class="leading-relaxed">${escapeHTML(option.text)}</span>
                                            </div>
                                            ${state.isSubmitted && isOptCorrect ? '<svg class="text-emerald-600 dark:text-emerald-400 flex-shrink-0 ml-4" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>' : ''}
                                            ${state.isSubmitted && isSelected && !isOptCorrect ? '<svg class="text-rose-600 dark:text-rose-400 flex-shrink-0 ml-4" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>' : ''}
                                        </button>`;
                                }).join('')}
                            </div>
                            
                            ${(() => {
                                const activeExpText = resolveQuestionExplanation(state.currentPart, currentQ);
                                const isAdmQuiz = isAdminUser();
                                if (state.isSubmitted) {
                                    if (activeExpText) {
                                        return `
                                            <div class="mt-5 p-4 sm:p-5 rounded-2xl bg-amber-50/85 dark:bg-amber-950/25 border border-amber-200/90 dark:border-amber-800/60 text-left animate-enter shadow-xs">
                                                <div class="flex items-center justify-between gap-2 mb-1.5">
                                                    <span class="inline-flex items-center gap-1.5 text-xs font-black uppercase tracking-wider text-amber-700 dark:text-amber-400">
                                                        <span>💡</span>
                                                        <span>Giải thích đáp án</span>
                                                    </span>
                                                    ${isAdmQuiz ? `
                                                    <button type="button" onclick="openAdminExplainModal()" class="px-2.5 py-1 rounded-lg bg-white/90 hover:bg-amber-100 dark:bg-slate-800 dark:hover:bg-slate-700 border border-amber-300/70 dark:border-amber-800 text-amber-700 dark:text-amber-300 text-[11px] font-extrabold transition-all active:scale-95 cursor-pointer">
                                                        ✏️ Sửa giải thích
                                                    </button>` : ''}
                                                </div>
                                                <div class="text-xs sm:text-sm font-medium text-slate-700 dark:text-slate-200 leading-relaxed whitespace-pre-line break-words">${escapeHTML(activeExpText)}</div>
                                            </div>`;
                                    }
                                    if (isAdmQuiz) {
                                        return `
                                            <div class="mt-4 flex justify-end">
                                                <button type="button" onclick="openAdminExplainModal()" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-amber-50/70 hover:bg-amber-100/80 dark:bg-slate-800/80 dark:hover:bg-slate-800 border border-dashed border-amber-300 dark:border-amber-700/70 text-amber-700 dark:text-amber-400 text-xs font-extrabold transition-all active:scale-95 cursor-pointer">
                                                    <span>💡</span>
                                                    <span>+ Thêm giải thích đáp án</span>
                                                </button>
                                            </div>`;
                                    }
                                    return '';
                                }
                                if (isAdmQuiz) {
                                    return `
                                        <div class="mt-4 flex justify-start">
                                            <button type="button" onclick="openAdminExplainModal()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-amber-50/70 hover:bg-amber-100/80 dark:bg-slate-800/80 dark:hover:bg-slate-800 border border-dashed border-amber-300 dark:border-amber-700/70 text-amber-700 dark:text-amber-400 text-[11px] font-extrabold transition-all active:scale-95 cursor-pointer" title="Chỉ Quản trị viên (Admin) mới thấy nút này">
                                                <span>💡</span>
                                                <span>${activeExpText ? 'Đã có giải thích đáp án • ✏️ Bấm để xem / sửa' : '+ Thêm giải thích đáp án'}</span>
                                            </button>
                                        </div>`;
                                }
                                return '';
                            })()}

                            ${!state.isSubmitted && state.selectedOptions.length > 0 ? `
                                <div class="mt-6 flex justify-end">
                                    <button onclick="checkAnswerSubmission()" class="px-6 py-3 bg-gradient-to-r from-brand-500 to-emerald-600 text-white font-extrabold rounded-xl text-xs uppercase tracking-wider shadow-md transform active:scale-95 transition-transform">
                                        Xác nhận đáp án
                                    </button>
                                </div>` : ''}
                        </div>
                    </div>

                    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md border-t border-slate-100 dark:border-slate-900 flex justify-center items-center gap-4 z-20">
                        <button onclick="prevQuestion()" ${state.currentQuestionIndex === 0 ? 'disabled' : ''} class="w-12 h-12 rounded-2xl flex items-center justify-center border text-slate-600 dark:text-slate-400 disabled:opacity-25 active:scale-95 transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button>
                        <button onclick="nextQuestion()" ${!state.isSubmitted ? 'disabled' : ''} class="flex-1 max-w-md h-12 rounded-2xl font-black text-xs uppercase tracking-wider shadow-md flex items-center justify-center gap-2 disabled:bg-slate-200 dark:disabled:bg-slate-800 disabled:text-slate-400 dark:disabled:text-slate-600 bg-brand-500 text-white disabled:cursor-not-allowed active:scale-[0.99] transition-all">
                            ${state.currentQuestionIndex === state.questions.length - 1 ? "Xem kết quả" : "Câu tiếp theo"} <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
                        </button>
                    </div>
                </div>`;
        }

        window.addEventListener('DOMContentLoaded', () => { render(); });
    </script>

    <!-- Floating Highlighter Palette (Bút dạ quang - Thiết kế tối ưu cho cả Điện thoại & Máy tính) -->
    <div id="qp-highlighter-toolbar" class="hidden fixed z-[999999] bg-slate-900/95 dark:bg-slate-800/95 text-white backdrop-blur-xl p-2.5 sm:p-3 rounded-2xl shadow-2xl border border-emerald-400/30 select-none animate-enter flex flex-col gap-2 w-[calc(100vw-16px)] max-w-[390px] sm:w-auto sm:max-w-[420px] transition-all duration-150">
        <!-- Hàng 1: Màu dạ quang + Nút Xóa + Nút Đóng -->
        <div class="flex items-center justify-between gap-1.5 sm:gap-2">
            <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap">
                <span class="text-[10px] font-black text-amber-300 flex items-center gap-0.5 shrink-0">
                    <span>✨ Tô nền:</span>
                </span>
                <button type="button" onpointerdown="applyHighlightColor('#fef08a', event)" title="Vàng neon" class="w-6 h-6 sm:w-5 sm:h-5 rounded-full bg-[#fef08a] border-2 border-amber-400 hover:scale-125 transition-transform active:scale-90 cursor-pointer"></button>
                <button type="button" onpointerdown="applyHighlightColor('#bbf7d0', event)" title="Xanh lục" class="w-6 h-6 sm:w-5 sm:h-5 rounded-full bg-[#bbf7d0] border-2 border-emerald-400 hover:scale-125 transition-transform active:scale-90 cursor-pointer"></button>
                <button type="button" onpointerdown="applyHighlightColor('#a5f3fc', event)" title="Xanh ngọc" class="w-6 h-6 sm:w-5 sm:h-5 rounded-full bg-[#a5f3fc] border-2 border-cyan-400 hover:scale-125 transition-transform active:scale-90 cursor-pointer"></button>
                <button type="button" onpointerdown="applyHighlightColor('#fed7aa', event)" title="Cam đào" class="w-6 h-6 sm:w-5 sm:h-5 rounded-full bg-[#fed7aa] border-2 border-orange-400 hover:scale-125 transition-transform active:scale-90 cursor-pointer"></button>
                <button type="button" onpointerdown="applyHighlightColor('#fbcfe8', event)" title="Hồng phấn" class="w-6 h-6 sm:w-5 sm:h-5 rounded-full bg-[#fbcfe8] border-2 border-pink-400 hover:scale-125 transition-transform active:scale-90 cursor-pointer"></button>
            </div>
            
            <div class="flex items-center gap-1 shrink-0 ml-auto">
                <button type="button" onpointerdown="clearSelectionHighlight(event)" title="Xóa đánh dấu & định dạng" class="px-2.5 py-1 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-[10px] font-black transition-all flex items-center gap-1 active:scale-95 shadow-sm cursor-pointer">
                    <span>🧹 Xóa</span>
                </button>
                <button type="button" onpointerdown="hideHighlighterToolbar()" title="Đóng thanh công cụ" class="w-6 h-6 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-black flex items-center justify-center transition-all active:scale-90 cursor-pointer">
                    ✕
                </button>
            </div>
        </div>

        <!-- Hàng 2: Màu chữ & Định dạng in đậm, nghiêng, gạch chân, chữ HOA -->
        <div class="flex items-center justify-between gap-1.5 sm:gap-2 pt-1.5 border-t border-slate-700/70">
            <div class="flex items-center gap-1.5 sm:gap-2">
                <span class="text-[10px] font-black text-sky-300 shrink-0">🎨 Chữ:</span>
                <button type="button" onpointerdown="applyTextColor('#ef4444', event)" title="Chữ đỏ" class="w-5 h-5 sm:w-4 sm:h-4 rounded-full bg-red-500 border border-white/60 hover:scale-125 transition-transform active:scale-90 cursor-pointer"></button>
                <button type="button" onpointerdown="applyTextColor('#3b82f6', event)" title="Chữ xanh dương" class="w-5 h-5 sm:w-4 sm:h-4 rounded-full bg-blue-500 border border-white/60 hover:scale-125 transition-transform active:scale-90 cursor-pointer"></button>
                <button type="button" onpointerdown="applyTextColor('#10b981', event)" title="Chữ xanh lá" class="w-5 h-5 sm:w-4 sm:h-4 rounded-full bg-emerald-500 border border-white/60 hover:scale-125 transition-transform active:scale-90 cursor-pointer"></button>
                <button type="button" onpointerdown="applyTextColor('#f97316', event)" title="Chữ cam" class="w-5 h-5 sm:w-4 sm:h-4 rounded-full bg-orange-500 border border-white/60 hover:scale-125 transition-transform active:scale-90 cursor-pointer"></button>
            </div>
            
            <!-- In đậm, nghiêng, gạch chân, chữ HOA -->
            <div class="flex items-center gap-1 shrink-0 ml-auto">
                <button type="button" onpointerdown="applyTextStyle('bold', event)" title="In đậm (Bold)" class="w-6 h-6 sm:w-5 sm:h-5 rounded-lg bg-slate-800 hover:bg-amber-500 hover:text-black font-black text-[11px] flex items-center justify-center transition-all active:scale-90 cursor-pointer">B</button>
                <button type="button" onpointerdown="applyTextStyle('italic', event)" title="In nghiêng (Italic)" class="w-6 h-6 sm:w-5 sm:h-5 rounded-lg bg-slate-800 hover:bg-amber-500 hover:text-black font-serif italic text-[11px] flex items-center justify-center transition-all active:scale-90 cursor-pointer">I</button>
                <button type="button" onpointerdown="applyTextStyle('underline', event)" title="Gạch chân (Underline)" class="w-6 h-6 sm:w-5 sm:h-5 rounded-lg bg-slate-800 hover:bg-amber-500 hover:text-black underline text-[11px] flex items-center justify-center transition-all active:scale-90 cursor-pointer">U</button>
                <button type="button" onpointerdown="applyTextStyle('uppercase', event)" title="Chữ in HOA" class="px-1.5 h-6 sm:h-5 rounded-lg bg-slate-800 hover:bg-amber-500 hover:text-black font-black text-[9px] flex items-center justify-center transition-all active:scale-90 cursor-pointer">AA</button>
            </div>
        </div>
    </div>

    <!-- Hộp thoại xác nhận tùy chỉnh (Custom Confirm Modal) thiết kế hiện đại có khung viền sang trọng -->
    <div id="custom-confirm-modal" class="hidden fixed inset-0 z-[100000] flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-md animate-enter">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm p-6 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 text-center relative overflow-hidden transition-all scale-100">
            <!-- Vòng trang trí ánh sáng nền -->
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-rose-500/15 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-amber-500/15 rounded-full blur-2xl pointer-events-none"></div>

            <!-- Icon Header -->
            <div id="confirm-icon-box" class="w-14 h-14 mx-auto mb-4 rounded-2xl flex items-center justify-center bg-rose-50 dark:bg-rose-950/50 text-rose-500 dark:text-rose-400 border border-rose-200/80 dark:border-rose-900/60 shadow-inner">
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
            </div>

            <!-- Tiêu đề -->
            <h4 id="confirm-modal-title" class="text-sm font-black uppercase text-slate-800 dark:text-slate-100 tracking-wide mb-2.5">XÓA ĐÁNH DẤU TÔ MÀU</h4>
            
            <!-- Khung viền chứa nội dung thông báo làm nổi bật -->
            <div class="bg-slate-50 dark:bg-slate-800/70 p-3.5 rounded-2xl border border-slate-200/80 dark:border-slate-700/70 mb-5 shadow-xs text-left">
                <p id="confirm-modal-msg" class="text-xs text-slate-700 dark:text-slate-300 font-semibold leading-relaxed break-words text-center"></p>
            </div>

            <!-- Hai nút hành động: Hủy & Xóa -->
            <div class="flex items-center gap-3">
                <button id="confirm-btn-cancel" class="flex-1 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all active:scale-95">Giữ lại</button>
                <button id="confirm-btn-ok" class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-600 hover:to-red-700 text-xs font-black text-white shadow-lg shadow-rose-500/25 transition-all active:scale-95">🗑️ Xóa vết màu</button>
            </div>
        </div>
    </div>

    <!-- Thanh Bút Dạ Quang Nổi Cố Định Đầu Màn Hình (Nằm trực tiếp trong body để luôn bám theo màn hình khi cuộn sâu) -->
    <div id="essay-sticky-pen-bar" class="hidden fixed top-2.5 left-1/2 -translate-x-1/2 z-[90] w-[calc(100vw-16px)] max-w-2xl bg-slate-900/95 dark:bg-slate-800/95 text-white backdrop-blur-xl p-2.5 sm:p-3.5 rounded-2xl shadow-2xl border border-emerald-400/40 select-none"></div>

    <!-- Cụm Nút Nổi Góc Dưới Phải Dành Riêng Cho Tự Luận (Luôn bám màn hình ở mọi vị trí cuộn, không cần kéo lên đầu trang) -->
    <div id="essay-floating-dock" class="hidden fixed bottom-5 right-3.5 sm:bottom-6 sm:right-6 z-[90] flex items-center gap-2 select-none">
        <button id="essay-scroll-top-fab" type="button" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" title="Cuộn nhanh lên đầu trang" class="hidden w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-white/95 hover:bg-emerald-50 dark:bg-slate-800/95 dark:hover:bg-slate-700 text-emerald-600 dark:text-emerald-400 shadow-xl border border-slate-200/90 dark:border-slate-700 backdrop-blur-md flex items-center justify-center transition-all active:scale-95 cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
        </button>
        <button id="essay-fab-pen-btn" type="button" onclick="toggleBrushBar()" title="Mở thanh bút dạ quang tô màu ngay tại vị trí đang đọc" class="rounded-full text-xs sm:text-sm font-extrabold shadow-2xl ring-2 ring-white/90 dark:ring-slate-900 flex items-center gap-1.5 transition-all active:scale-95 cursor-pointer select-none px-4 py-2.5 sm:px-5 sm:py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white shadow-emerald-900/35">
            <span>🖍️</span>
            <span>Mở bút tô</span>
        </button>
    </div>

    <!-- Lớp hiển thị nét quét bút dạ quang thời gian thực (Live Brush Preview) -->
    <div id="qp-brush-preview-layer" class="fixed inset-0 pointer-events-none z-[99990]"></div>

    <!-- Modal Quản trị viên: Thêm / Sửa Thông Báo Riêng Cho Từng Môn Học -->
    <div id="admin-subject-notice-modal" class="hidden fixed inset-0 z-[100010] flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-md animate-enter" onclick="closeSubjectNoticeModal()">
        <div class="bg-white dark:bg-slate-900 w-full max-w-lg p-6 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 text-left relative space-y-4" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between border-b pb-3 border-slate-100 dark:border-slate-800">
                <div class="flex items-center gap-2.5">
                    <span class="w-9 h-9 rounded-2xl bg-emerald-50 dark:bg-emerald-950/50 text-brand-600 dark:text-emerald-400 flex items-center justify-center text-base border border-emerald-200/70 dark:border-emerald-800/60">📢</span>
                    <div>
                        <h3 class="text-sm font-black uppercase text-slate-800 dark:text-slate-100">Thông báo riêng môn học</h3>
                        <p id="qnm-subject-label" class="text-[11px] font-bold text-brand-600 dark:text-emerald-400"></p>
                    </div>
                </div>
                <button type="button" onclick="closeSubjectNoticeModal()" class="p-1.5 rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer">✕</button>
            </div>

            <form onsubmit="saveSubjectNotice(event)" class="space-y-3.5">
                <input type="hidden" id="qnm-level" value="info" />
                <div>
                    <label class="block text-[10px] font-extrabold uppercase text-slate-400 mb-1.5">Mức độ hiển thị</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" id="qnm-level-btn-info" onclick="selectQuizNoticeLevel('info')" class="py-2 px-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-extrabold text-emerald-700 dark:text-emerald-400 flex items-center justify-center gap-1 transition-all cursor-pointer">
                            <span>📢</span><span>Thông báo</span>
                        </button>
                        <button type="button" id="qnm-level-btn-warning" onclick="selectQuizNoticeLevel('warning')" class="py-2 px-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-extrabold text-amber-700 dark:text-amber-400 flex items-center justify-center gap-1 transition-all cursor-pointer">
                            <span>⚠️</span><span>Lưu ý</span>
                        </button>
                        <button type="button" id="qnm-level-btn-urgent" onclick="selectQuizNoticeLevel('urgent')" class="py-2 px-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-extrabold text-rose-600 dark:text-rose-400 flex items-center justify-center gap-1 transition-all cursor-pointer">
                            <span>🔥</span><span>Quan trọng</span>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-extrabold uppercase text-slate-400 mb-1">Tiêu đề thông báo</label>
                    <input type="text" id="qnm-title" placeholder="VD: Lịch thi kết thúc học phần / Lưu ý ôn tập..." class="w-full px-3.5 py-2.5 text-xs sm:text-sm bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl font-bold text-slate-800 dark:text-white focus:outline-none focus:border-brand-500" />
                </div>

                <div>
                    <label class="block text-[10px] font-extrabold uppercase text-slate-400 mb-1">Nội dung thông báo (Để trống rồi bấm Lưu sẽ về mặc định không hiện gì)</label>
                    <textarea id="qnm-content" rows="4" placeholder="Nhập thông báo riêng cho môn này (vd: Đề mới cập nhật thêm 30 câu chương 4, các bạn chú ý ôn kỹ Phần 2 nhé!)..." class="w-full px-3.5 py-2.5 text-xs sm:text-sm bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl font-medium text-slate-800 dark:text-white focus:outline-none focus:border-brand-500 leading-relaxed"></textarea>
                </div>

                <div class="flex items-center justify-between gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
                    <button type="button" id="qnm-delete-btn" onclick="clearSubjectNotice()" class="hidden px-3.5 py-2.5 rounded-xl bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 text-xs font-extrabold transition-all cursor-pointer">
                        🗑️ Gỡ thông báo
                    </button>
                    <div class="flex items-center gap-2 ml-auto">
                        <button type="button" onclick="closeSubjectNoticeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-bold transition-all cursor-pointer">Hủy</button>
                        <button type="submit" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-brand-500 to-emerald-600 hover:from-brand-600 hover:to-emerald-700 text-white text-xs font-black uppercase tracking-wider shadow-md transition-all cursor-pointer">Lưu thông báo</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Quản trị viên: Chủ Động Thêm / Sửa Giải Thích Đáp Án Trực Tiếp Trên Web -->
    <div id="admin-explain-modal" class="hidden fixed inset-0 z-[100010] flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-md animate-enter" onclick="closeAdminExplainModal()">
        <div class="bg-white dark:bg-slate-900 w-full max-w-lg p-6 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 text-left relative space-y-4" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between border-b pb-3 border-slate-100 dark:border-slate-800">
                <div class="flex items-center gap-2.5">
                    <span class="w-9 h-9 rounded-2xl bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 flex items-center justify-center text-base border border-amber-200/70 dark:border-amber-800/60">💡</span>
                    <div>
                        <h3 class="text-sm font-black uppercase text-slate-800 dark:text-slate-100">Giải thích đáp án (Admin)</h3>
                        <span id="aem-correct-badge" class="inline-block mt-0.5 text-[10px] font-black uppercase px-2 py-0.5 rounded bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-400">Đáp án đúng: A</span>
                    </div>
                </div>
                <button type="button" onclick="closeAdminExplainModal()" class="p-1.5 rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer">✕</button>
            </div>

            <div class="p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200/80 dark:border-slate-700 text-xs font-bold text-slate-700 dark:text-slate-200 leading-relaxed max-h-28 overflow-y-auto" id="aem-question-preview"></div>

            <form onsubmit="saveAdminExplain(event)" class="space-y-3.5">
                <div>
                    <label class="block text-[10px] font-extrabold uppercase text-amber-600 dark:text-amber-400 mb-1">Nội dung giải thích (Để trống sẽ mặc định bình thường không hiện gì)</label>
                    <textarea id="aem-explain-input" rows="4" placeholder="Nhập lời giải / giải thích vì sao đáp án này đúng... (Học viên chỉ nhìn thấy phần này sau khi đã bấm Xác nhận đáp án hoặc khi xem lại bài làm)" class="w-full px-3.5 py-2.5 text-xs sm:text-sm bg-amber-50/30 dark:bg-slate-800 border border-amber-200/80 dark:border-slate-700 rounded-xl font-medium text-slate-800 dark:text-white focus:outline-none focus:border-amber-500 leading-relaxed"></textarea>
                </div>

                <div class="flex items-center justify-between gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
                    <button type="button" id="aem-delete-btn" onclick="clearAdminExplain()" class="hidden px-3.5 py-2.5 rounded-xl bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 text-xs font-extrabold transition-all cursor-pointer">
                        🗑️ Xóa giải thích
                    </button>
                    <div class="flex items-center gap-2 ml-auto">
                        <button type="button" onclick="closeAdminExplainModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-bold transition-all cursor-pointer">Hủy</button>
                        <button type="submit" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white text-xs font-black uppercase tracking-wider shadow-md transition-all cursor-pointer">Lưu giải thích</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
