<body style="overflow-x: clip;" class="bg-gradient-to-br from-[#f0fdf4] via-[#e0f2fe] to-slate-50 dark:from-slate-950 dark:via-slate-900 dark:to-emerald-950 min-h-screen text-slate-800 dark:text-slate-100 w-full max-w-full">
    <div id="root"></div>

    <script>

        // 1. Toast thông báo cảnh báo bảo mật
        function showAntiCheatToast(msg) {
            let t = document.getElementById('anti-cheat-toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'anti-cheat-toast';
                t.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 z-[999999] px-4 py-2.5 rounded-xl bg-slate-900/95 dark:bg-white/95 text-white dark:text-slate-900 text-xs font-bold shadow-2xl backdrop-blur-md border border-amber-500/40 flex items-center gap-2 pointer-events-none transition-all duration-300 opacity-0 translate-y-3';
                document.body.appendChild(t);
            }
            t.innerHTML = '<span class="text-amber-400 dark:text-amber-600 text-base">🛡️</span> <span>' + escapeHTML(msg) + '</span>';
            t.classList.remove('opacity-0', 'translate-y-3');
            clearTimeout(t._hideTimeout);
            t._hideTimeout = setTimeout(() => {
                t.classList.add('opacity-0', 'translate-y-3');
            }, 2500);
        }

        // 3. Lớp chặn sao chép, cắt và bôi đen văn bản (mở khóa riêng cho vùng Tự luận để dùng Bút dạ quang trên cả ĐT & PC)
        document.addEventListener('contextmenu', function(e) {
            const target = e.target && e.target.nodeType === 3 ? e.target.parentElement : e.target;
            if (target && target.closest && target.closest('input, textarea')) return;
            // Trên điện thoại cảm ứng, nhấn giữ để bôi đen chữ sẽ kích hoạt contextmenu -> cho phép trong vùng Tự luận (sự kiện copy vẫn bị khóa chặt bên dưới)
            const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            if (isTouchDevice && typeof state !== 'undefined' && state.studyMode === 'essay' && !state.currentPart && target && target.closest && target.closest('#essay-content-wrapper, .highlightable-content')) {
                return;
            }
            e.preventDefault();
            showAntiCheatToast("Thao tác chuột phải đã bị khóa để bảo vệ bản quyền đề thi!");
            return false;
        });

        document.addEventListener('copy', function(e) {
            const target = e.target && e.target.nodeType === 3 ? e.target.parentElement : e.target;
            if (target && target.closest && target.closest('input, textarea')) return;
            e.preventDefault();
            if (e.clipboardData) {
                e.clipboardData.setData('text/plain', 'Nội dung đề thi được bảo vệ bản quyền bởi QuizPoint Studio.');
            }
            showAntiCheatToast("Tính năng sao chép nội dung đã bị vô hiệu hóa!");
            return false;
        });

        document.addEventListener('cut', function(e) {
            const target = e.target && e.target.nodeType === 3 ? e.target.parentElement : e.target;
            if (target && target.closest && target.closest('input, textarea')) return;
            e.preventDefault();
            return false;
        });

        document.addEventListener('selectstart', function(e) {
            const target = e.target && e.target.nodeType === 3 ? e.target.parentElement : e.target;
            if (target && target.closest && target.closest('input, textarea')) {
                return true;
            }
            if (typeof state !== 'undefined' && state.studyMode === 'essay' && !state.currentPart && target && target.closest && target.closest('#essay-content-wrapper, .highlightable-content')) {
                return true;
            }
            e.preventDefault();
            return false;
        });

        document.addEventListener('dragstart', function(e) {
            e.preventDefault();
            return false;
        });

        // 4. Lớp chặn phím tắt nguy hiểm (Inspect, View Source, Print, Save, Copy All)
        document.addEventListener('keydown', function(e) {
            const isCtrlOrMeta = e.ctrlKey || e.metaKey;
            const key = e.key ? e.key.toLowerCase() : '';

            // F12 (Developer Tools)
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                e.stopPropagation();
                showAntiCheatToast("Phím chức năng F12 đã bị vô hiệu hóa!");
                return false;
            }

            // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C (Inspect/Console)
            if (isCtrlOrMeta && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) {
                e.preventDefault();
                e.stopPropagation();
                showAntiCheatToast("Công cụ kiểm tra (Inspect) đã bị vô hiệu hóa!");
                return false;
            }

            // Ctrl+U (Xem mã nguồn HTML)
            if (isCtrlOrMeta && key === 'u') {
                e.preventDefault();
                e.stopPropagation();
                showAntiCheatToast("Xem mã nguồn trang đã bị vô hiệu hóa!");
                return false;
            }

            // Ctrl+S (Lưu trang web)
            if (isCtrlOrMeta && key === 's') {
                e.preventDefault();
                e.stopPropagation();
                showAntiCheatToast("Lưu trang web đã bị khóa!");
                return false;
            }

            // Ctrl+P (In đề / Xuất PDF)
            if (isCtrlOrMeta && key === 'p') {
                e.preventDefault();
                e.stopPropagation();
                showAntiCheatToast("In ấn / Xuất PDF đề thi đã bị khóa!");
                return false;
            }

            // Ctrl+C / Ctrl+A / Ctrl+X khi không phải trong ô input
            if (isCtrlOrMeta && (key === 'c' || key === 'a' || key === 'x')) {
                if (!e.target.closest('input, textarea')) {
                    e.preventDefault();
                    e.stopPropagation();
                    showAntiCheatToast("Phím tắt sao chép/chọn tất cả đã bị khóa!");
                    return false;
                }
            }
        });

        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        const firebaseConfig = {
          apiKey: "AIzaSyC-n88rPoijqfE44ZF3ulPZdcGz_rtC3lg",
          authDomain: "quizpointstuidio.firebaseapp.com",
          databaseURL: "https://quizpointstuidio-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "quizpointstuidio",
          storageBucket: "quizpointstuidio.firebasestorage.app",
          messagingSenderId: "592248583165",
          appId: "1:592248583165:web:8f7dac2ab36dbf35aadf94",
          measurementId: "G-T8QQ1HEZGC"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const ADMIN_EMAIL = "ngocyen@cucdang.com";

        const urlParams = new URLSearchParams(window.location.search);
        let rawCode = (urlParams.get('code') || urlParams.get('subject') || '').trim();
        const SUBJECT_KEY = rawCode ? rawCode.toUpperCase() : "";
        let initialName = urlParams.get('name') ? decodeURIComponent(urlParams.get('name')) : "";
        let initialPart = (urlParams.get('part') || '').trim();
        let initialMode = (urlParams.get('mode') || '').trim().toLowerCase();

        let TEST_DATA = {};
        let SUBJECT_INFO = { 
            name: initialName || (SUBJECT_KEY ? `${SUBJECT_KEY}` : "Chọn môn học ôn tập"), 
            subTitle: "Hệ thống ngân hàng câu hỏi ôn tập trực tuyến",
            notice: null
        };

        function cleanSubjectTitle(rawName, code) {
            if (!rawName) return '';
            let s = String(rawName).trim();
            s = s.replace(/^(môn|mon|mã\s*môn|ma\s*mon)\s*[:：\-]\s*/i, '');
            s = s.replace(/^(yêu\s*cầu\s*[\w\d]+|yeu\s*cau\s*[\w\d]+)\s*[:：\-]\s*/i, '');
            if (code) {
                const escapedCode = String(code).replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&');
                s = s.replace(new RegExp('^' + escapedCode + '\\s*[:：\\-]\\s*', 'i'), '');
            }
            s = s.replace(/^([A-Z0-9_\-\s]{2,15})\s*[:：]\s*/, function(match, prefix) {
                if (/^[A-Z0-9_\-\s]+$/.test(prefix.trim())) {
                    return '';
                }
                return match;
            });
            return s.trim() || rawName;
        }

        function parseSubjectTitle(rawName, code) {
            return {
                badge: '',
                title: cleanSubjectTitle(rawName, code)
            };
        }

        function cleanSubjectName(name) {
            if (!name) return "";
            return name
                .replace(/^(môn|mon)\s*[:：]\s*/i, '')
                .replace(/^(yêu\s*cầu\s*[\w\d]+|yeu\s*cau\s*[\w\d]+)\s*[:：]\s*/i, '')
                .trim();
        }

        const initialDarkMode = document.documentElement.classList.contains('dark') || 
            localStorage.getItem('qp_theme') === 'dark' || 
            (!('qp_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);

        let state = {
            user: null,
            loading: true,
            emailInput: "",
            passwordInput: "",
            authError: "",
            isKicked: false,
            isDarkMode: initialDarkMode,
            currentPart: null,
            currentQuestionIndex: 0,
            score: 0,
            wrongScore: 0,
            showResult: false,
            selectedOptions: [],
            isSubmitted: false,
            questions: [],
            shuffledOptions: [],
            isConfirming: false,
            isConfirmingHome: false,
            sessionAnswers: [],
            reviewMode: false,
            reviewData: [],
            reviewPart: null,
            history: [],
            studyMode: (initialMode === 'essay' ? 'essay' : 'quiz'), // 'quiz' (Trắc nghiệm) hoặc 'essay' (Tự luận)
            essayQuestions: [],
            essayRevealed: {},
            essayLearned: {},
            userHighlights: {},
            visitorCount: 1,
            studentOnlineCount: 1,
            essayFontSize: Math.max(12, Math.min(26, parseInt(localStorage.getItem("qp_essay_font_size") || "16", 10) || 16)),
            showBrushBar: false,
            brushPen: null,
            brushExpanded: false,
            lastBrushColor: '#fef08a'
        };
        let ESSAY_DATA = {};

        if (SUBJECT_KEY) {
            try {
                const saved = localStorage.getItem(`history_${SUBJECT_KEY}`);
                state.history = saved ? JSON.parse(saved) : [];
            } catch (e) { state.history = []; }
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function getQuestionsArray(data) {
            if (!data) return [];
            if (Array.isArray(data)) return data.filter(Boolean);
            if (typeof data === 'object') {
                const values = Object.values(data).filter(Boolean);
                if (values.length > 0 && values[0] && typeof values[0] === 'object' && values[0].q) {
                    return values;
                }
                let combined = [];
                values.forEach(v => {
                    if (Array.isArray(v)) combined = combined.concat(v.filter(Boolean));
                    else if (v && typeof v === 'object' && v.q) combined.push(v);
                });
                return combined;
            }
            return [];
        }
        
        function toggleDarkMode() {
            state.isDarkMode = !state.isDarkMode;
            if (state.isDarkMode) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('qp_theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('qp_theme', 'light');
            }
            render();
        }

        async function fetchSubjectDetails() {
            if (!SUBJECT_KEY) return;
            try {
                const snap = await db.ref("subjects").once("value");
                const data = snap.val();
                if (data) {
                    for (const cat in data) {
                        const list = Array.isArray(data[cat]) ? data[cat] : Object.values(data[cat] || {});
                        const found = list.find(item => item && item.code && item.code.toUpperCase() === SUBJECT_KEY);
                        if (found) {
                            SUBJECT_INFO.name = found.name;
                            SUBJECT_INFO.notice = found.notice || null;
                            return;
                        }
                    }
                }
            } catch(e) {}
        }

        function isAdminUser() {
            if (!state.user || !state.user.email) return false;
            return String(state.user.email).toLowerCase().trim() === ADMIN_EMAIL.toLowerCase();
        }

        function showQuizToast(msg, type = 'success') {
            let t = document.getElementById('qp-admin-action-toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'qp-admin-action-toast';
                document.body.appendChild(t);
            }
            const toneClass = type === 'error'
                ? 'bg-rose-600 text-white border-rose-400/50'
                : (type === 'info' ? 'bg-slate-900 text-white border-emerald-400/40' : 'bg-emerald-600 text-white border-emerald-300/50');
            const icon = type === 'error' ? '⚠️' : (type === 'info' ? '⏳' : '✅');
            t.className = `fixed top-5 left-1/2 -translate-x-1/2 z-[100020] px-4 py-2.5 rounded-2xl ${toneClass} text-xs font-extrabold shadow-2xl border flex items-center gap-2 pointer-events-none transition-all duration-300 opacity-0 -translate-y-2`;
            t.innerHTML = `<span>${icon}</span><span>${escapeHTML(msg)}</span>`;
            requestAnimationFrame(() => {
                t.classList.remove('opacity-0', '-translate-y-2');
            });
            clearTimeout(t._hideTimer);
            t._hideTimer = setTimeout(() => {
                t.classList.add('opacity-0', '-translate-y-2');
            }, 2600);
        }

        // =========================================================================
        // HỆ THỐNG THÔNG BÁO RIÊNG CHO TỪNG MÔN & GIẢI THÍCH ĐÁP ÁN TÙY CHỌN (ADMIN)
        // Mặc định bình thường 100% không hiển thị gì nếu Admin không thêm nội dung
        // =========================================================================
        function normalizeSubjectNotice(raw) {
            if (!raw) return null;
            if (typeof raw === 'string') {
                const c = raw.trim();
                return c ? { title: 'Thông báo môn học', content: c, level: 'info', updatedAt: null } : null;
            }
            if (typeof raw === 'object') {
                const content = String(raw.content || raw.text || raw.message || '').trim();
                if (!content) return null;
                const title = String(raw.title || 'Thông báo môn học').trim() || 'Thông báo môn học';
                const level = ['info', 'warning', 'urgent'].includes(raw.level) ? raw.level : 'info';
                return { title, content, level, updatedAt: raw.updatedAt || null };
            }
            return null;
        }

        function getActiveSubjectNotice() {
            if (TEST_DATA && typeof TEST_DATA === 'object' && Object.prototype.hasOwnProperty.call(TEST_DATA, '_notice')) {
                return normalizeSubjectNotice(TEST_DATA._notice);
            }
            return normalizeSubjectNotice(SUBJECT_INFO.notice);
        }

        function formatNoticeTime(ts) {
            if (!ts) return '';
            try {
                const d = new Date(ts);
                if (isNaN(d.getTime())) return '';
                return d.toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' });
            } catch (e) {
                return '';
            }
        }

        function renderSubjectNoticeSection() {
            const notice = getActiveSubjectNotice();
            const isAdm = isAdminUser();

            // Nếu Admin chưa thêm thông báo -> Học viên thấy mặc định bình thường 100% (không hiện gì cả)
            if (!notice) {

                        ${isAdm ? `
                        <div class="flex items-center gap-1.5 shrink-0">

                            <button type="button" onclick="clearSubjectNotice()" class="px-2.5 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/50 dark:hover:bg-rose-900/60 border border-rose-200 dark:border-rose-800/70 text-rose-600 dark:text-rose-400 text-[11px] font-extrabold shadow-xs transition-all active:scale-95 cursor-pointer" title="Gỡ thông báo để về mặc định bình thường">

        async function syncSubjectNoticeToSubjectsCatalog(code, noticePayload) {
            if (!code) return;
            try {
                const snap = await db.ref("subjects").once("value");
                const subData = snap.val();
                if (!subData || typeof subData !== 'object') return;
                let changed = false;
                for (const cat in subData) {
                    const arr = Array.isArray(subData[cat]) ? subData[cat] : [];
                    arr.forEach(item => {
                        if (item && item.code && item.code.toUpperCase() === code.toUpperCase()) {
                            if (noticePayload) {
                                item.notice = noticePayload;
                            } else {
                                delete item.notice;
                            }
                            changed = true;
                        }
                    });
                }
                if (changed) {
                    await db.ref("subjects").set(subData);
                }
            } catch (e) {
                console.warn("Đồng bộ notice vào subjects:", e);
            }
        }

        window.selectQuizNoticeLevel = function(level) {
            const hidden = document.getElementById('qnm-level');
            if (hidden) hidden.value = level;
            ['info', 'warning', 'urgent'].forEach(lv => {

                if (!btn) return;
                if (lv === level) {
                    btn.classList.add('ring-2', 'ring-brand-500', 'bg-emerald-50', 'dark:bg-slate-700');
                } else {
                    btn.classList.remove('ring-2', 'ring-brand-500', 'bg-emerald-50', 'dark:bg-slate-700');
                }
            });
        };

        window.closeSubjectNoticeModal = function() {
            const modal = document.getElementById('admin-subject-notice-modal');
            if (modal) modal.classList.add('hidden');
        };

        window.saveSubjectNotice = async function(e) {
            if (e) e.preventDefault();
            if (!isAdminUser() || !SUBJECT_KEY) return;
            const titleVal = (document.getElementById('qnm-title').value || '').trim() || 'Thông báo môn học';
            const contentVal = (document.getElementById('qnm-content').value || '').trim();
            const levelVal = (document.getElementById('qnm-level').value || 'info').trim();

            try {
                if (!contentVal) {
                    await db.ref(`quiz_questions/${SUBJECT_KEY}/_notice`).remove();
                    await syncSubjectNoticeToSubjectsCatalog(SUBJECT_KEY, null);
                    if (TEST_DATA && typeof TEST_DATA === 'object') delete TEST_DATA._notice;
                    SUBJECT_INFO.notice = null;
                    closeSubjectNoticeModal();
                    render();
                    showQuizToast("Đã gỡ thông báo — môn học trở về mặc định bình thường!");
                    return;
                }

                const payload = {
                    title: titleVal,
                    content: contentVal,
                    level: ['info', 'warning', 'urgent'].includes(levelVal) ? levelVal : 'info',
                    updatedAt: Date.now()
                };

                await db.ref(`quiz_questions/${SUBJECT_KEY}/_notice`).set(payload);
                await syncSubjectNoticeToSubjectsCatalog(SUBJECT_KEY, payload);
                if (!TEST_DATA || typeof TEST_DATA !== 'object') TEST_DATA = {};
                TEST_DATA._notice = payload;
                SUBJECT_INFO.notice = payload;
                closeSubjectNoticeModal();
                render();
                showQuizToast("Đã lưu thông báo riêng cho môn học!");

                showQuizToast("Lỗi lưu thông báo: " + err.message, "error");
            }
        };

        window.clearSubjectNotice = async function() {
            if (!isAdminUser() || !SUBJECT_KEY) return;
            closeSubjectNoticeModal();
            const ok = await showCustomConfirm(

                "🗑️ Gỡ thông báo",

            if (!ok) return;

            }

        function resolveActualPartKey(partKey) {
            if (partKey === null || partKey === undefined || !TEST_DATA || typeof TEST_DATA !== 'object') return partKey;
            if (TEST_DATA[partKey] !== undefined) return partKey;
            if (!isNaN(partKey) && TEST_DATA[Number(partKey)] !== undefined) return Number(partKey);
            if (TEST_DATA[String(partKey)] !== undefined) return String(partKey);
            return partKey;
        }

        function resolveQuestionExplanation(partKey, qObj) {
            if (!qObj) return '';
            if (partKey !== null && partKey !== undefined && TEST_DATA && typeof TEST_DATA === 'object') {
                const actualKey = resolveActualPartKey(partKey);
                const rawList = getQuestionsArray(TEST_DATA[actualKey]);
                if (rawList.length > 0) {
                    const origIdx = (qObj._origIdx !== undefined) ? qObj._origIdx : qObj.origIdx;
                    let found = null;
                    if (origIdx !== undefined && origIdx !== null && rawList[origIdx] && rawList[origIdx].q === qObj.q) {
                        found = rawList[origIdx];
                    } else {
                        found = rawList.find(it => it && it.q === qObj.q);
                    }
                    if (found) {
                        return String(found.explain !== undefined ? found.explain : (found.explanation || '')).trim();
                    }
                }
            }
            return String(qObj.explain !== undefined ? qObj.explain : (qObj.explanation !== undefined ? qObj.explanation : (qObj.e || ''))).trim();
        }

        let adminExplainTarget = { part: null, origIdx: null, qText: '', reviewIdx: null };

        window.openAdminExplainModal = function(partOverride = null, reviewIdx = null) {
            if (!isAdminUser() || !SUBJECT_KEY) return;
            const modal = document.getElementById('admin-explain-modal');
            if (!modal) return;

            let targetPart = partOverride !== null ? partOverride : state.currentPart;
            let qText = '';
            let origIdx = null;
            let currentExp = '';
            let correctLabel = '';

            if (reviewIdx !== null && reviewIdx !== undefined && state.reviewData[reviewIdx]) {
                const rItem = state.reviewData[reviewIdx];
                qText = rItem.q || '';
                origIdx = (rItem.origIdx !== undefined) ? rItem.origIdx : null;
                currentExp = resolveQuestionExplanation(targetPart, rItem);
                correctLabel = (rItem.c || '').toUpperCase().split('').join(', ');
            } else if (state.questions && state.questions[state.currentQuestionIndex]) {
                const curQ = state.questions[state.currentQuestionIndex];
                qText = curQ.q || '';
                origIdx = (curQ._origIdx !== undefined) ? curQ._origIdx : state.currentQuestionIndex;
                currentExp = resolveQuestionExplanation(targetPart, curQ);
                correctLabel = (curQ.correct || '').toUpperCase().split('').join(', ');
            }

            if (targetPart === null || targetPart === undefined || !qText) {
                showQuizToast("Không xác định được câu hỏi cần thêm giải thích!", "error");
                return;
            }

            adminExplainTarget = { part: targetPart, origIdx, qText, reviewIdx };

            const qPreviewEl = document.getElementById('aem-question-preview');
            if (qPreviewEl) qPreviewEl.innerText = qText;
            const ansBadgeEl = document.getElementById('aem-correct-badge');
            if (ansBadgeEl) ansBadgeEl.innerText = `Đáp án đúng: ${correctLabel || 'A'}`;
            const textarea = document.getElementById('aem-explain-input');
            if (textarea) textarea.value = currentExp;
            const delBtn = document.getElementById('aem-delete-btn');
            if (delBtn) {
                if (currentExp) delBtn.classList.remove('hidden');
                else delBtn.classList.add('hidden');
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                if (textarea) textarea.focus();
            }, 60);
        };

        window.closeAdminExplainModal = function() {
            const modal = document.getElementById('admin-explain-modal');
            if (modal) modal.classList.add('hidden');
        };

        async function persistQuestionExplanationValue(newExplainText) {
            if (!isAdminUser() || !SUBJECT_KEY || adminExplainTarget.part === null || adminExplainTarget.part === undefined) return;
            const actualKey = resolveActualPartKey(adminExplainTarget.part);
            const rawList = getQuestionsArray(TEST_DATA[actualKey]);
            if (rawList.length === 0) {
                showQuizToast("Không tìm thấy dữ liệu phần đề gốc trên hệ thống!", "error");
                return;
            }

            const updatedList = rawList.map(it => ({ ...it }));
            let targetIdx = -1;
            if (adminExplainTarget.origIdx !== null && adminExplainTarget.origIdx !== undefined && updatedList[adminExplainTarget.origIdx] && updatedList[adminExplainTarget.origIdx].q === adminExplainTarget.qText) {
                targetIdx = adminExplainTarget.origIdx;
            } else {
                targetIdx = updatedList.findIndex(it => it && it.q === adminExplainTarget.qText);
            }

            if (targetIdx === -1) {
                showQuizToast("Không tìm thấy câu hỏi gốc để cập nhật!", "error");
                return;
            }

            const cleanExp = String(newExplainText || '').trim();
            if (cleanExp) {
                updatedList[targetIdx].explain = cleanExp;
            } else {
                delete updatedList[targetIdx].explain;
                delete updatedList[targetIdx].explanation;
            }

            try {
                await db.ref(`quiz_questions/${SUBJECT_KEY}/${actualKey}`).set(updatedList);
                TEST_DATA[actualKey] = updatedList;

                // Đồng bộ tức thì vào phiên làm bài hiện tại, kết quả vừa nộp và lịch sử
                if (Array.isArray(state.questions)) {
                    state.questions.forEach(q => {
                        if (q && q.q === adminExplainTarget.qText) {
                            if (cleanExp) q.explain = cleanExp;
                            else delete q.explain;
                        }
                    });
                }
                if (Array.isArray(state.sessionAnswers)) {
                    state.sessionAnswers.forEach(a => {
                        if (a && a.q === adminExplainTarget.qText) {
                            if (cleanExp) a.explain = cleanExp;
                            else delete a.explain;
                        }
                    });
                }
                if (Array.isArray(state.reviewData)) {
                    state.reviewData.forEach(r => {
                        if (r && r.q === adminExplainTarget.qText) {
                            if (cleanExp) r.e = cleanExp;
                            else delete r.e;
                        }
                    });
                }
                if (Array.isArray(state.history)) {
                    state.history.forEach(rec => {
                        if (rec && String(rec.part) === String(actualKey) && Array.isArray(rec.details)) {
                            rec.details.forEach(d => {
                                if (d && d.q === adminExplainTarget.qText) {
                                    if (cleanExp) d.e = cleanExp;
                                    else delete d.e;
                                }
                            });
                        }
                    });
                    try { localStorage.setItem(`history_${SUBJECT_KEY}`, JSON.stringify(state.history)); } catch (e) {}
                }

                saveQuizProgressDraft();
                closeAdminExplainModal();
                render();
                showQuizToast(cleanExp ? "Đã lưu giải thích đáp án!" : "Đã xóa giải thích — câu hỏi về mặc định bình thường!");
            } catch (err) {
                showQuizToast("Lỗi lưu giải thích: " + err.message, "error");
            }
        }

        window.saveAdminExplain = async function(e) {
            if (e) e.preventDefault();
            const val = (document.getElementById('aem-explain-input').value || '').trim();
            await persistQuestionExplanationValue(val);
        };

        window.clearAdminExplain = async function() {
            await persistQuestionExplanationValue('');
        };

        let userSessionListener = null;
        let adminSessionListener = null;

        auth.onAuthStateChanged(async (currentUser) => {
            if (userSessionListener) {
                userSessionListener.off();
                userSessionListener = null;
            }
            if (adminSessionListener) {
                adminSessionListener.off();
                adminSessionListener = null;
            }

            try {
                await fetchSubjectDetails();

                if (currentUser) {
                    const userEmail = (currentUser.email || "").toLowerCase().trim();
                    const isAdmin = (userEmail === ADMIN_EMAIL.toLowerCase());
                    const userRef = db.ref(`users/${currentUser.uid}`);
                    
                    // Kiểm soát phiên thiết bị
                    if (!isAdmin) {
                        let sessionSynced = false;
                        userSessionListener = userRef.child("currentSessionId");
                        userSessionListener.on("value", (snap) => {
                            const cloudSession = snap.val();
                            const localSession = localStorage.getItem("qp_active_session");
                            if (cloudSession && localSession && cloudSession === localSession) {
                                sessionSynced = true;
                                return;
                            }
                            if (localSession && ((cloudSession && cloudSession !== localSession) || (sessionSynced && !cloudSession))) {
                                localStorage.removeItem("qp_active_session");
                                state.isKicked = true;
                                auth.signOut();
                                state.user = null;
                                render();
                            }
                        });
                    } else {
                        let adminSessionId = localStorage.getItem("qp_admin_session_id");
                        if (!adminSessionId) {
                            adminSessionId = "adm_" + Date.now().toString(36) + "_" + Math.random().toString(36).substring(2, 7);
                            localStorage.setItem("qp_admin_session_id", adminSessionId);
                        }
                        const ua = navigator.userAgent || "";
                        let os = "Máy tính";
                        let icon = "💻";
                        let devType = "desktop";
                        if (/iPad|iPhone|iPod/.test(ua)) { os = /iPad/.test(ua) ? "iPad" : "iPhone"; icon = "📱"; devType = "mobile"; }
                        else if (/Android/.test(ua)) { os = /Mobile/.test(ua) ? "Điện thoại Android" : "Tablet Android"; icon = "📱"; devType = "mobile"; }
                        else if (/Windows/.test(ua)) { os = "Windows PC"; icon = "💻"; }
                        else if (/Macintosh/.test(ua)) { os = "macOS"; icon = "💻"; }

                        let browser = "Browser";
                        if (/Edg\//.test(ua)) browser = "Edge";
                        else if (/Chrome\//.test(ua)) browser = "Chrome";
                        else if (/Safari\//.test(ua)) browser = "Safari";
                        else if (/Firefox\//.test(ua)) browser = "Firefox";

                        const mySessionRef = userRef.child("activeSessions/" + adminSessionId);
                        let isRegistered = false;
                        mySessionRef.update({
                            id: adminSessionId,
                            name: `${os} (${browser})`,
                            icon: icon,
                            os: os,
                            browser: browser,
                            deviceType: devType,
                            userAgent: ua.substring(0, 150),
                            lastActive: Date.now()
                        }).then(() => {
                            isRegistered = true;
                        }).catch(() => {});

                        adminSessionListener = mySessionRef;
                        adminSessionListener.on("value", (snap) => {
                            if (isRegistered && !snap.exists()) {
                                localStorage.removeItem("qp_admin_session_id");
                                state.isKicked = true;
                                auth.signOut();
                                state.user = null;
                                render();
                            }
                        });
                    }

                    if (!isAdmin && SUBJECT_KEY) {
                        try {
                            const permSnap = await userRef.child(`allowedSubjects/${SUBJECT_KEY}`).once("value");
                            if (permSnap.val() !== true) {
                                state.authError = `Tài khoản chưa được cấp quyền truy cập [${SUBJECT_KEY}]!`;
                                auth.signOut();
                                state.user = null;
                                state.loading = false;
                                render();
                                return;
                            }
                        } catch(e) {}
                    }

                    if (SUBJECT_KEY) {
                        try {
                            let snap = await db.ref(`quiz_questions/${SUBJECT_KEY}`).once("value");
                            let data = snap.val();

                            if (!data) {
                                snap = await db.ref(`mon_hoc/${SUBJECT_KEY.toLowerCase()}`).once("value");
                                const oldData = snap.val();
                                if (oldData) {
                                    data = oldData.parts || oldData;
                                    if (oldData.name) SUBJECT_INFO.name = oldData.name;
                                }
                            }

                            if (data) {
                                if (data._title) SUBJECT_INFO.name = data._title;
                                TEST_DATA = data;
                            } else {
                                TEST_DATA = {};
                            }
                        } catch(e) {
                            console.error("Lỗi nạp đề thi:", e);
                        }

                        // Tải tài liệu tự luận (Ưu tiên dữ liệu mới nhất từ quiz_questions/_essay, fallback sang essay_questions)
                        ESSAY_DATA = {};
                        try {
                            let eSnap = await db.ref("essay_questions/" + SUBJECT_KEY).once("value");
                            if (eSnap && eSnap.exists()) {
                                Object.assign(ESSAY_DATA, eSnap.val() || {});
                            }
                        } catch(e) {}
                        if (TEST_DATA && typeof TEST_DATA === 'object') {
                            for (const k in TEST_DATA) {
                                if (k.startsWith('essay_')) {
                                    const p = k.replace('essay_', '');
                                    ESSAY_DATA[p] = TEST_DATA[k];
                                }
                            }
                            if (TEST_DATA._essay && typeof TEST_DATA._essay === 'object') {
                                Object.assign(ESSAY_DATA, TEST_DATA._essay);
                            }
                        }

                        // Tải bút dạ quang highlights đã lưu (Kết hợp cả LocalStorage & Firebase để không bao giờ mất)
                        let localHl = {};
                        try {
                            localHl = JSON.parse(localStorage.getItem("qp_highlights_" + currentUser.uid + "_" + SUBJECT_KEY) || "{}");
                        } catch(e) {}
                        state.userHighlights = { ...localHl };

                        try {
                            let hlSnap = await db.ref("users/" + currentUser.uid + "/highlights/" + SUBJECT_KEY).once("value");
                            if (hlSnap.exists()) {
                                state.userHighlights = { ...localHl, ...(hlSnap.val() || {}) };
                                try {
                                    localStorage.setItem("qp_highlights_" + currentUser.uid + "_" + SUBJECT_KEY, JSON.stringify(state.userHighlights));
                                } catch(e) {}
                            }
                        } catch(e) {}

                        // Tải lịch sử bài làm trắc nghiệm từ Firebase
                        try {
                            let hSnap = await db.ref("users/" + currentUser.uid + "/quiz_history/" + SUBJECT_KEY).once("value");
                            if (hSnap.exists()) {

        function startQuiz(part) {
            let raw = getQuestionsArray(TEST_DATA[part]);
            if (raw.length === 0 && !isNaN(part)) {
                raw = getQuestionsArray(TEST_DATA[Number(part)]);
            }

            if (raw.length === 0) {
                alert("Bộ đề này hiện đang được cập nhật câu hỏi!");
                return;
            }

            state.questions = raw.map((item, idx) => {
                const ALL_OPT_KEYS = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l'];
                const options = ALL_OPT_KEYS
                    .filter(k => item[k] !== undefined && item[k] !== null && String(item[k]).trim() !== "")
                    .map(k => ({ key: k, text: item[k] }));

                const cleanAns = (item.ans || "a").toString().toLowerCase().replace(/[^a-z]/g, '').split('').sort().join('');
                const rawExplain = String(item.explain !== undefined ? item.explain : (item.explanation || '')).trim();

                const mappedQ = {
                    id: item.id || (idx + 1),
                    _origIdx: idx,
                    q: item.q,
                    correct: cleanAns || "a",
                    isMultiple: (cleanAns.length > 1),
                    options: options
                };
                if (rawExplain) mappedQ.explain = rawExplain;
                return mappedQ;
            });

            state.currentPart = part; 
            state.currentQuestionIndex = 0; 
            state.score = 0; 
            state.wrongScore = 0;
            state.sessionAnswers = []; 
            state.showResult = false; 
            state.selectedOptions = []; 
            state.isSubmitted = false;

            if (state.questions.length > 0) {
                state.shuffledOptions = shuffleArray(state.questions[0].options);
            }
            saveQuizProgressDraft();
            render();
        }

        function handleOptionSelect(key, isMultiple) {
            if (state.isSubmitted) return;
            if (isMultiple) {
                if (state.selectedOptions.includes(key)) {
                    state.selectedOptions = state.selectedOptions.filter(k => k !== key);
                } else {
                    state.selectedOptions.push(key);
                }
            } else {
                state.selectedOptions = [key];
            }
            render();
        }

        function checkAnswerSubmission() {
            if (state.selectedOptions.length === 0 || state.isSubmitted) return;
            const currentQ = state.questions[state.currentQuestionIndex];
            const userAnsStr = [...state.selectedOptions].sort().join('');
            const correctAnsStr = currentQ.correct.split('').sort().join('');
            const correct = userAnsStr === correctAnsStr;
            
            state.isSubmitted = true;
            if (correct) state.score++; else state.wrongScore++;
            state.sessionAnswers.push({ ...currentQ, userSelected: userAnsStr, options: state.shuffledOptions });
            saveQuizProgressDraft();
            render();
        }

        function nextQuestion() {
            if (state.currentQuestionIndex < state.questions.length - 1) {
                state.currentQuestionIndex++;
                const newQ = state.questions[state.currentQuestionIndex];
                const existing = state.sessionAnswers.find(a => a.id === newQ.id);
                if (existing) {
                    state.shuffledOptions = existing.options;
                    state.selectedOptions = existing.userSelected.split('');
                    state.isSubmitted = true;
                } else {
                    state.shuffledOptions = shuffleArray(newQ.options); 
                    state.selectedOptions = []; 
                    state.isSubmitted = false;
                }
                saveQuizProgressDraft();
                render();
            } else {
                state.showResult = true;
                clearQuizProgressDraft();
                saveHistoryToLocal();
                render();
            }
        }

        function prevQuestion() {
            if (state.currentQuestionIndex > 0) {
                state.currentQuestionIndex--;
                const newQ = state.questions[state.currentQuestionIndex];
                const existing = state.sessionAnswers.find(a => a.id === newQ.id);
                if (existing) {
                    state.shuffledOptions = existing.options;
                    state.selectedOptions = existing.userSelected.split('');
                    state.isSubmitted = true;
                } else {

                part: state.currentPart,
                score: state.score, 
                wrong: actualWrong, 
                total: state.questions.length,

                    const detailItem = { id: q.id, q: q.q, o: q.options || [], s: q.userSelected, c: q.correct };
                    if (q._origIdx !== undefined) detailItem.origIdx = q._origIdx;
                    if (exp) detailItem.e = exp;
                    return detailItem;

        // =========================================================================
        (function() {
            const TAB_ID = "tab_" + Date.now().toString(36) + "_" + Math.random().toString(36).substring(2, 7);

            const CHANNEL_NAME = "qp_real_presence_stream";

            function getActiveVisitorCount() {

                    for (const id in tabs) {
                        if (now - tabs[id] < 10000) {

                    const now = Date.now();
                    for (const id in tabs) {

                    localStorage.setItem(STORAGE_TABS_KEY, JSON.stringify(tabs));

                renderCount();
                if (broadcastChannel) {

            function unregister() {
                try {
                    let tabs = {};
                    try { tabs = JSON.parse(localStorage.getItem(STORAGE_TABS_KEY) || "{}"); } catch(e){}
                    delete tabs[TAB_ID];
                    localStorage.setItem(STORAGE_TABS_KEY, JSON.stringify(tabs));

                if (broadcastChannel) {

        // =========================================================================
        // HỆ THỐNG BÚT DẠ QUANG THÔNG MINH THẾ HỆ MỚI (STICKY PEN BAR + TOUCH BRUSH)
        // Triệt tiêu 100% lỗi nhảy bảng Dịch/Tìm kiếm trên điện thoại & không bao giờ khuất
        // =========================================================================
        function clearBrushPreview() {
            const layer = document.getElementById('qp-brush-preview-layer');
            if (layer && layer.innerHTML !== '') layer.innerHTML = '';
        }

        function createRangeByCharOffsets(rootEl, startChar, endChar) {
            if (!rootEl || endChar <= startChar) return null;
            const walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, null, false);
            let node, acc = 0;
            let sNode = null, sOff = 0, eNode = null, eOff = 0;
            while ((node = walker.nextNode())) {
                const len = node.nodeValue ? node.nodeValue.length : 0;
                if (!sNode && startChar <= acc + len) {
                    sNode = node;
                    sOff = Math.max(0, startChar - acc);
                }
                if (!eNode && endChar <= acc + len) {
                    eNode = node;
                    eOff = Math.max(0, endChar - acc);
                    break;
                }
                acc += len;
            }
            if (!sNode || !eNode) return null;
            const r = document.createRange();
            r.setStart(sNode, sOff);
            r.setEnd(eNode, eOff);
            return r;
        }

        function buildWordTokens(contentEl) {
            const tokens = [];
            if (!contentEl) return tokens;
            const walker = document.createTreeWalker(contentEl, NodeFilter.SHOW_TEXT, null, false);
            const probe = document.createRange();
            let node, acc = 0;
            while ((node = walker.nextNode())) {
                const val = node.nodeValue || '';
                const re = /\S+/g;
                let m;
                while ((m = re.exec(val)) !== null) {
                    const sOff = m.index;
                    const eOff = m.index + m[0].length;
                    probe.setStart(node, sOff);
                    probe.setEnd(node, eOff);
                    const rect = probe.getBoundingClientRect();
                    if (rect && (rect.width > 0 || rect.height > 0)) {
                        tokens.push({
                            charStart: acc + sOff,
                            charEnd: acc + eOff,
                            word: m[0],
                            left: rect.left,
                            right: rect.right,
                            top: rect.top,
                            bottom: rect.bottom,
                            midX: (rect.left + rect.right) / 2,
                            midY: (rect.top + rect.bottom) / 2
                        });
                    }
                }
                acc += val.length;
            }
            return tokens;
        }

        function findTokenAtPoint(tokens, x, y, allowNearest) {
            if (!tokens || tokens.length === 0) return -1;
            // 1. Khớp trực tiếp (có dung sai ngón tay ±8px dọc, ±6px ngang)
            for (let i = 0; i < tokens.length; i++) {
                const t = tokens[i];
                if (y >= t.top - 8 && y <= t.bottom + 8 && x >= t.left - 6 && x <= t.right + 6) {
                    return i;
                }
            }
            if (!allowNearest) return -1;

            // 2. Khi đang kéo lướt bút: Tìm từ gần nhất trên dòng gần ngón tay nhất
            let bestIdx = -1;
            let bestScore = Infinity;
            for (let i = 0; i < tokens.length; i++) {
                const t = tokens[i];
                const dy = (y < t.top) ? (t.top - y) : (y > t.bottom ? (y - t.bottom) : 0);
                const dx = (x < t.left) ? (t.left - x) : (x > t.right ? (x - t.right) : 0);
                const score = dy * 4.2 + dx;
                if (score < bestScore) {
                    bestScore = score;
                    bestIdx = i;
                }
            }
            return bestScore < 180 ? bestIdx : -1;
        }

        function renderBrushPreview(contentEl, tokens, idxA, idxB, pen) {
            const layer = document.getElementById('qp-brush-preview-layer');
            if (!layer || !contentEl || idxA < 0 || idxB < 0 || !pen) return;
            const lo = Math.min(idxA, idxB);
            const hi = Math.max(idxA, idxB);
            const r = createRangeByCharOffsets(contentEl, tokens[lo].charStart, tokens[hi].charEnd);
            if (!r) return;

            const rects = r.getClientRects();
            let bg = 'rgba(254, 240, 138, 0.7)';
            let borderBottom = 'none';
            if (pen.kind === 'bg') {
                bg = pen.value;
            } else if (pen.kind === 'fg') {
                bg = 'rgba(148, 163, 184, 0.22)';
                borderBottom = `2.5px solid ${pen.value}`;
            } else if (pen.kind === 'style') {
                bg = 'rgba(251, 191, 36, 0.35)';
                borderBottom = '2px dashed #f59e0b';
            }

            let html = '';
            for (let i = 0; i < rects.length; i++) {
                const rc = rects[i];
                if (rc.width < 1 || rc.height < 1) continue;
                html += `<div style="position:fixed;left:${rc.left - 1}px;top:${rc.top}px;width:${rc.width + 2}px;height:${rc.height}px;background:${bg};opacity:0.65;border-radius:4px;border-bottom:${borderBottom};pointer-events:none;"></div>`;
            }
            layer.innerHTML = html;
        }

        async function applyBrushStroke(contentEl, tokens, idxA, idxB, pen) {
            if (!contentEl || !tokens || idxA < 0 || idxB < 0 || !pen) return;
            const lo = Math.min(idxA, idxB);
            const hi = Math.max(idxA, idxB);
            const charStart = tokens[lo].charStart;
            const charEnd = tokens[hi].charEnd;

            let range = createRangeByCharOffsets(contentEl, charStart, charEnd);
            if (!range) return;

            // Nếu chạm đơn (1 từ) vào đúng từ đã tô cùng màu/cùng kiểu -> Gỡ vết đó ra (Toggle thông minh)
            if (lo === hi) {
                const sParent = range.startContainer.nodeType === 1 ? range.startContainer : range.startContainer.parentElement;
                const existingSame = sParent ? sParent.closest('.qp-hl-tag') : null;
                if (existingSame && existingSame.dataset.hlId) {
                    const oldRec = state.userHighlights[existingSame.dataset.hlId];
                    if (oldRec && (
                        (pen.kind === 'bg' && oldRec.color === pen.value) ||
                        (pen.kind === 'fg' && oldRec.textColor === pen.value) ||
                        (pen.kind === 'style' && oldRec.styleType === pen.value)
                    )) {
                        await removeHighlightById(existingSame.dataset.hlId, existingSame);
                        return;
                    }
                }
            }

            // Dọn các thẻ .qp-hl-tag cùng loại bị đè lên trong vùng quét để tránh lồng thẻ trùng lặp
            const existingTags = Array.from(contentEl.querySelectorAll('.qp-hl-tag'));
            let cleanedAny = false;
            for (const tag of existingTags) {
                try {
                    if (range.intersectsNode(tag)) {
                        const oldId = tag.dataset.hlId;
                        const oldRec = oldId ? state.userHighlights[oldId] : null;
                        const sameCategory = !oldRec ||
                            (pen.kind === 'bg' && !!oldRec.color) ||
                            (pen.kind === 'fg' && !!oldRec.textColor) ||
                            (pen.kind === 'style' && !!oldRec.styleType);
                        if (sameCategory && oldId) {
                            await removeHighlightById(oldId, tag, true);
                            cleanedAny = true;
                        }
                    }
                } catch (e) {}
            }
            if (cleanedAny) {
                contentEl.normalize();
                range = createRangeByCharOffsets(contentEl, charStart, charEnd);
                if (!range) return;
            }

            const text = range.toString().trim();
            if (text.length < 2) return;

            currentSelectionRange = range;
            selectedHighlightText = text;
            if (pen.kind === 'bg') {
                await window.applyHighlightColor(pen.value);
            } else if (pen.kind === 'fg') {
                await window.applyTextColor(pen.value);
            } else if (pen.kind === 'style') {
                await window.applyTextStyle(pen.value);
            }
        }

                        <button id="essay-bar-font-display" type="button" onclick="resetEssayFontSize()" class="px-1 h-5 rounded-md text-emerald-400 text-[10px] font-mono font-bold hover:bg-slate-800 cursor-pointer">${state.essayFontSize || ESSAY_FONT_DEFAULT}px</button>
                        <button id="essay-bar-font-inc-btn" type="button" onclick="changeEssayFontSize(2)" ${(state.essayFontSize || ESSAY_FONT_DEFAULT) >= ESSAY_FONT_MAX ? 'disabled' : ''} class="px-1.5 h-5 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-200 text-[10px] font-black border border-slate-700 cursor-pointer disabled:opacity-35">A+</button>

        function syncEssayScrollTopFab() {
            const topBtn = document.getElementById('essay-scroll-top-fab');
            if (!topBtn) return;
            const scrolled = (window.scrollY || (document.documentElement && document.documentElement.scrollTop) || 0) > 320;
            topBtn.classList.toggle('hidden', !(isEssayViewActive() && scrolled));
        }

        function syncEssayBrushBarDOM() {
            const essayActive = isEssayViewActive();
            const isOpen = essayActive && !!state.showBrushBar;

            const bar = document.getElementById('essay-sticky-pen-bar');
            if (bar) {
                bar.classList.toggle('hidden', !isOpen);
                if (isOpen) {
                    bar.innerHTML = renderEssayBrushBarInner();
                }
            }

            const dock = document.getElementById('essay-floating-dock');
            if (dock) {
                dock.classList.toggle('hidden', !essayActive);
            }

            const fabBtn = document.getElementById('essay-fab-pen-btn');
            if (fabBtn) {
                fabBtn.className = getEssayFabPenBtnClass(isOpen);
                fabBtn.innerHTML = isOpen
                    ? '<span>✕</span><span>Tắt bút</span>'
                    : '<span>🖍️</span><span>Mở bút tô</span>';
                fabBtn.title = isOpen
                    ? 'Tắt và ẩn thanh bút dạ quang'
                    : 'Mở thanh bút dạ quang tô màu ngay tại vị trí đang đọc';
            }

            syncEssayScrollTopFab();

            const openBtn = document.getElementById('essay-open-pen-btn');
            if (openBtn) {
                openBtn.className = getEssayOpenPenBtnClass(isOpen);
                openBtn.innerHTML = isOpen
                    ? '<span>✕</span><span>Tắt bút tô</span>'
                    : '<span>🖍️</span><span>Mở bút tô màu</span>';
            }

            const cardPenBtns = document.querySelectorAll('.essay-card-pen-btn');
            if (cardPenBtns && cardPenBtns.length > 0) {
                const nextCardCls = getEssayCardPenBtnClass(isOpen);
                const nextCardHtml = isOpen
                    ? '<span>✕</span><span>Tắt bút tô</span>'
                    : '<span>🖍️</span><span>Mở bút tô</span>';
                cardPenBtns.forEach(btn => {
                    btn.className = nextCardCls;
                    btn.innerHTML = nextCardHtml;
                });
            }

            const wrapper = document.getElementById('essay-content-wrapper');
            if (wrapper) {
                wrapper.classList.toggle('essay-brush-active', !!(isOpen && state.brushPen));
                wrapper.classList.toggle('essay-eraser-active', !!(isOpen && state.brushPen && state.brushPen.kind === 'eraser'));
            }
            if (isOpen && state.brushPen) {
                hideHighlighterToolbar();
                try {
                    const sel = window.getSelection();
                    if (sel) sel.removeAllRanges();
                } catch (e) {}
            }
        }

        window.toggleBrushBar = function(forceShow) {
            const nextShow = (typeof forceShow === 'boolean') ? forceShow : !state.showBrushBar;
            if (!nextShow) {
                window.closeBrushBar();
                return;
            }
            state.showBrushBar = true;
            state.brushExpanded = true;
            if (!state.brushPen) {
                state.brushPen = { kind: 'bg', value: state.lastBrushColor || '#fef08a' };
            }
            clearBrushPreview();
            syncEssayBrushBarDOM();
        };

        window.closeBrushBar = function() {
            state.showBrushBar = false;
            state.brushPen = null;
            state.brushExpanded = false;
            clearBrushPreview();
            syncEssayBrushBarDOM();
        };

        window.selectBrushTool = function(kind, value) {
            state.showBrushBar = true;
            if (state.brushPen && state.brushPen.kind === kind && (kind === 'eraser' || state.brushPen.value === value)) {
                state.brushPen = null;
            } else {
                state.brushPen = { kind, value };
                state.brushExpanded = true;
                if (kind === 'bg' && value) state.lastBrushColor = value;
            }
            clearBrushPreview();
            syncEssayBrushBarDOM();
        };

        window.toggleBrushExpand = function(expand) {
            state.showBrushBar = true;
            state.brushExpanded = !!expand;
            if (expand && !state.brushPen) {
                state.brushPen = { kind: 'bg', value: state.lastBrushColor || '#fef08a' };
            }
            syncEssayBrushBarDOM();
        };

        window.disableBrushPen = function() {
            window.closeBrushBar();
        };

        function initHighlighterListeners() {
            if (window._qpHighlighterInitDone) return;
            window._qpHighlighterInitDone = true;

            let selectionTimeout = null;
            let isPointerDownInContent = false;
            const isCoarsePointer = () => !!(
                (document.body && document.body.classList && document.body.classList.contains('qp-touch-device')) ||
                (window.matchMedia && window.matchMedia('(pointer: coarse), (hover: none)').matches)
            );
            if (('ontouchstart' in window || (navigator && navigator.maxTouchPoints > 0)) && window.innerWidth < 1024) {
                if (document.body && document.body.classList) document.body.classList.add('qp-touch-device');
            }

            // Đồng bộ nút cuộn nhanh lên đầu trang khi đọc sâu trong Tự luận
            window.addEventListener('scroll', syncEssayScrollTopFab, { passive: true });

            // Chặn hoàn toàn menu chuột phải / nhấn giữ (Dịch / Tìm kiếm) của trình duyệt di động trên vùng Tự luận
            document.addEventListener('contextmenu', (e) => {
                if (state.studyMode === 'essay' && e.target && e.target.closest && e.target.closest('#essay-content-wrapper')) {
                    if (isCoarsePointer() || state.brushPen) {
                        e.preventDefault();
                    }
                }
            });

            // =================================================================
            // 1. CƠ CHẾ CHẠM & QUẸT BÚT TRỰC TIẾP TRÊN ĐIỆN THOẠI / TABLET
            // =================================================================
            let touchSession = null;

            document.addEventListener('touchstart', (e) => {
                if (document.body && document.body.classList) document.body.classList.add('qp-touch-device');
                if (state.studyMode !== 'essay' || state.currentPart) return;
                if (!e.touches || e.touches.length !== 1) {
                    if (touchSession && touchSession.holdTimer) clearTimeout(touchSession.holdTimer);
                    touchSession = null;
                    clearBrushPreview();
                    return;
                }
                const target = e.target;
                if (!target || !target.closest) return;
                if (target.closest('button, a, input, textarea, select, #essay-sticky-pen-bar, #essay-floating-dock, #qp-highlighter-toolbar, #custom-confirm-modal')) return;

                const contentEl = target.closest('.highlightable-content');
                if (!contentEl) return;

                // Chỉ kích hoạt chấm/quẹt tô màu khi thanh bút đang BẬT và đang cầm bút/tẩy
                if (!state.showBrushBar || !state.brushPen) {
                    touchSession = null;
                    return;
                }

                const touch = e.touches[0];
                const startX = touch.clientX;
                const startY = touch.clientY;

                // Nếu đang cầm CỤC TẨY
                if (state.brushPen.kind === 'eraser') {
                    touchSession = { mode: 'eraser', startX, startY, gesture: 'pending', erasedIds: new Set() };
                    const hlTag = target.closest('.qp-hl-tag');
                    if (hlTag && hlTag.dataset.hlId) {
                        touchSession.erasedIds.add(hlTag.dataset.hlId);
                        removeHighlightById(hlTag.dataset.hlId, hlTag);
                    }
                    return;
                }

                // Nếu ĐANG CẦM BÚT TÔ MÀU / KIỂU CHỮ
                const tokens = buildWordTokens(contentEl);
                const startIdx = findTokenAtPoint(tokens, startX, startY, false);
                if (startIdx < 0) return;
                touchSession = {
                    mode: 'pen',
                    contentEl,
                    tokens,
                    startX,
                    startY,
                    startIdx,
                    endIdx: startIdx,
                    gesture: 'pending'
                };
            }, { passive: true });

            document.addEventListener('touchmove', (e) => {
                if (!touchSession || !e.touches || e.touches.length !== 1) return;
                const touch = e.touches[0];
                const dx = touch.clientX - touchSession.startX;
                const dy = touch.clientY - touchSession.startY;

                if (touchSession.mode === 'eraser') {
                    if (touchSession.gesture === 'pending') {
                        if (Math.abs(dy) > 9 && Math.abs(dy) > Math.abs(dx) * 1.15) {
                            touchSession.gesture = 'scroll';
                            return;
                        }
                        if (Math.abs(dx) > 7) touchSession.gesture = 'brush';
                    }
                    if (touchSession.gesture === 'brush') {
                        if (e.cancelable) e.preventDefault();
                        const elUnder = document.elementFromPoint(touch.clientX, touch.clientY);
                        const hlTag = elUnder && elUnder.closest ? elUnder.closest('.qp-hl-tag') : null;
                        if (hlTag && hlTag.dataset.hlId && !touchSession.erasedIds.has(hlTag.dataset.hlId)) {
                            touchSession.erasedIds.add(hlTag.dataset.hlId);
                            removeHighlightById(hlTag.dataset.hlId, hlTag, true);
                        }
                    }
                    return;
                }

                if (touchSession.mode === 'pen') {
                    if (touchSession.gesture === 'scroll') return;
                    if (touchSession.gesture === 'pending') {
                        // Vuốt dọc -> cuộn trang mượt bình thường
                        if (Math.abs(dy) > 9 && Math.abs(dy) > Math.abs(dx) * 1.15) {
                            touchSession.gesture = 'scroll';
                            clearBrushPreview();
                            return;
                        }
                        // Quẹt ngang -> khóa sang chế độ quét bút dạ quang
                        if (Math.abs(dx) > 7) {
                            touchSession.gesture = 'brush';
                        } else {
                            return;
                        }
                    }
                    if (touchSession.gesture === 'brush') {
                        if (e.cancelable) e.preventDefault();
                        const hitIdx = findTokenAtPoint(touchSession.tokens, touch.clientX, touch.clientY, true);
                        if (hitIdx >= 0 && hitIdx !== touchSession.endIdx) {
                            touchSession.endIdx = hitIdx;
                        }
                        renderBrushPreview(touchSession.contentEl, touchSession.tokens, touchSession.startIdx, touchSession.endIdx, state.brushPen);
                    }
                }
            }, { passive: false });

            const finishTouchSession = async () => {
                if (!touchSession) return;
                const sess = touchSession;
                touchSession = null;
                if (sess.holdTimer) clearTimeout(sess.holdTimer);
                clearBrushPreview();

                if (sess.mode === 'eraser' && sess.erasedIds && sess.erasedIds.size > 1) {
                    showAntiCheatToast("🧹 Đã xóa " + sess.erasedIds.size + " vết tô màu!");
                    return;
                }
                if (sess.mode === 'pen' && state.brushPen && sess.gesture !== 'scroll') {
                    await applyBrushStroke(sess.contentEl, sess.tokens, sess.startIdx, sess.endIdx, state.brushPen);
                }
            };

            document.addEventListener('touchend', finishTouchSession, { passive: true });
            document.addEventListener('touchcancel', () => {
                if (touchSession && touchSession.holdTimer) clearTimeout(touchSession.holdTimer);
                touchSession = null;
                clearBrushPreview();
            }, { passive: true });

            // =================================================================
            // 2. HỖ TRỢ CẦM BÚT QUÉT BẰNG CHUỘT TRÊN MÁY TÍNH + FLOATING BAR KHI TẮT BÚT
            // =================================================================
            let mouseBrushSession = null;

            function checkAndShowToolbar() {
                if (state.studyMode !== 'essay' || state.currentPart || state.brushPen || isCoarsePointer()) {
                    hideHighlighterToolbar();
                    return;
                }

                const sel = window.getSelection();
                if (!sel || sel.isCollapsed) return;

                const text = sel.toString().trim();
                if (text.length < 2) {
                    hideHighlighterToolbar();
                    return;
                }

                if (sel.rangeCount === 0) return;
                const range = sel.getRangeAt(0);
                const container = range.commonAncestorContainer;
                const parentEl = container.nodeType === 1 ? container : container.parentElement;

                if (!parentEl || parentEl.closest('input, textarea, select, button, #essay-sticky-pen-bar, #essay-floating-dock, #qp-highlighter-toolbar, #custom-confirm-modal, #admin-subject-notice-modal, #admin-explain-modal')) {
                    return;
                }
                if (!parentEl.closest('#essay-content-wrapper, .highlightable-content')) {
                    hideHighlighterToolbar();
                    return;
                }

                currentSelectionRange = range.cloneRange();
                selectedHighlightText = text;

                const tb = document.getElementById('qp-highlighter-toolbar');
                if (!tb) return;

                const rect = range.getBoundingClientRect();
                if (!rect || (rect.width === 0 && rect.height === 0)) return;

                tb.classList.remove('hidden');
                tb.style.position = 'fixed';
                tb.style.bottom = 'auto';
                tb.style.width = 'auto';
                tb.style.maxWidth = 'calc(100vw - 24px)';

                const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
                const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
                const midX = (rect.left + rect.right) / 2;
                const halfTb = Math.min(205, (vw - 24) / 2);
                const safeLeft = Math.max(halfTb + 12, Math.min(vw - halfTb - 12, midX));
                tb.style.left = safeLeft + 'px';

                if (rect.top < 115) {
                    tb.style.top = Math.min(vh - 95, Math.max(12, rect.bottom + 10)) + 'px';
                    tb.style.transform = 'translate(-50%, 0)';
                } else {
                    tb.style.top = Math.max(85, rect.top - 10) + 'px';
                    tb.style.transform = 'translate(-50%, -100%)';
                }
            }

            document.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                const tb = document.getElementById('qp-highlighter-toolbar');
                if (tb && tb.contains(e.target)) return;
                if (e.target && e.target.closest && e.target.closest('#custom-confirm-modal, #admin-subject-notice-modal, #admin-explain-modal, #essay-sticky-pen-bar, #essay-floating-dock, button, a')) return;

                if (state.studyMode === 'essay' && !state.currentPart && state.brushPen) {
                    const contentEl = e.target && e.target.closest ? e.target.closest('.highlightable-content') : null;
                    if (!contentEl) return;
                    if (state.brushPen.kind === 'eraser') {
                        const hlTag = e.target.closest('.qp-hl-tag');
                        if (hlTag && hlTag.dataset.hlId) {
                            removeHighlightById(hlTag.dataset.hlId, hlTag);
                        }
                        mouseBrushSession = { mode: 'eraser', erasedIds: new Set() };
                        return;
                    }
                    const tokens = buildWordTokens(contentEl);
                    const startIdx = findTokenAtPoint(tokens, e.clientX, e.clientY, false);
                    if (startIdx >= 0) {
                        mouseBrushSession = { mode: 'pen', contentEl, tokens, startIdx, endIdx: startIdx };
                        renderBrushPreview(contentEl, tokens, startIdx, startIdx, state.brushPen);
                    }
                    return;
                }

                isPointerDownInContent = true;
            });

            document.addEventListener('mousemove', (e) => {
                if (!mouseBrushSession || !state.brushPen) return;
                if (mouseBrushSession.mode === 'eraser') {
                    const elUnder = document.elementFromPoint(e.clientX, e.clientY);
                    const hlTag = elUnder && elUnder.closest ? elUnder.closest('.qp-hl-tag') : null;
                    if (hlTag && hlTag.dataset.hlId && !mouseBrushSession.erasedIds.has(hlTag.dataset.hlId)) {
                        mouseBrushSession.erasedIds.add(hlTag.dataset.hlId);
                        removeHighlightById(hlTag.dataset.hlId, hlTag, true);
                    }
                    return;
                }
                if (mouseBrushSession.mode === 'pen') {
                    const hitIdx = findTokenAtPoint(mouseBrushSession.tokens, e.clientX, e.clientY, true);
                    if (hitIdx >= 0 && hitIdx !== mouseBrushSession.endIdx) {
                        mouseBrushSession.endIdx = hitIdx;
                        renderBrushPreview(mouseBrushSession.contentEl, mouseBrushSession.tokens, mouseBrushSession.startIdx, mouseBrushSession.endIdx, state.brushPen);
                    }
                }
            });

            document.addEventListener('mouseup', async (e) => {
                if (mouseBrushSession) {
                    const sess = mouseBrushSession;
                    mouseBrushSession = null;
                    clearBrushPreview();
                    if (sess.mode === 'pen' && state.brushPen) {
                        await applyBrushStroke(sess.contentEl, sess.tokens, sess.startIdx, sess.endIdx, state.brushPen);
                    }
                    return;
                }

                const tb = document.getElementById('qp-highlighter-toolbar');
                if (tb && tb.contains(e.target)) return;
                isPointerDownInContent = false;
                if (isCoarsePointer() || state.brushPen) return;
                clearTimeout(selectionTimeout);
                selectionTimeout = setTimeout(() => {
                    const sel = window.getSelection();
                    if (!sel || sel.isCollapsed || sel.toString().trim().length < 2) {
                        hideHighlighterToolbar();
                    } else {
                        checkAndShowToolbar();
                    }
                }, 100);
            });

            document.addEventListener('selectionchange', () => {
                if (state.studyMode !== 'essay' || state.brushPen || isCoarsePointer()) {
                    hideHighlighterToolbar();
                    return;
                }
                clearTimeout(selectionTimeout);
                selectionTimeout = setTimeout(() => {
                    const sel = window.getSelection();
                    if (!sel || sel.isCollapsed || sel.toString().trim().length < 2) {
                        if (!isPointerDownInContent) hideHighlighterToolbar();
                    } else if (!isPointerDownInContent) {
                        checkAndShowToolbar();
                    }
                }, 220);
            });
        }
