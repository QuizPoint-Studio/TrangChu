<html lang="vi">
<head>
<script>
    if (localStorage.getItem('qp_theme') === 'dark' || 
        (!('qp_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }
</script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            900: '#064e3b',
                        }
                    },
                    animation: {
                        'bounce-slow': 'bounce 3s infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 4s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },

                    }
                }
            }
        }

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap');
        body { 
            font-family: 'Be Vietnam Pro', sans-serif; 
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        html, body, .custom-scrollbar {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        html::-webkit-scrollbar, body::-webkit-scrollbar, .custom-scrollbar::-webkit-scrollbar { 
            display: none;
            width: 0 !important;
            height: 0 !important;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .animate-enter { animation: fadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-gradient-to-br from-[#f0fdf4] via-[#e0f2fe] to-slate-50 dark:from-slate-950 dark:via-slate-900 dark:to-emerald-950 min-h-screen text-slate-800 dark:text-slate-100">
    
    <div id="root"></div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyC-n88rPoijqfE44ZF3ulPZdcGz_rtC3lg",
          authDomain: "quizpointstuidio.firebaseapp.com",
          databaseURL: "https://quizpointstuidio-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "quizpointstuidio",
          storageBucket: "quizpointstuidio.firebasestorage.app",
          messagingSenderId: "592248583165",
          appId: "1:592248583165:web:8f7dac2ab36dbf35aadf94",
          measurementId: "G-T8QQ1HEZGC"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const ADMIN_EMAIL = "ngocyen@cucdang.com";

        const urlParams = new URLSearchParams(window.location.search);
        let rawCode = (urlParams.get('code') || urlParams.get('subject') || '').trim();
        const SUBJECT_KEY = rawCode ? rawCode.toUpperCase() : "";
        let initialName = urlParams.get('name') ? decodeURIComponent(urlParams.get('name')) : "";
        let initialPart = (urlParams.get('part') || '').trim();

        let TEST_DATA = {};
        let SUBJECT_INFO = { 
            name: initialName || (SUBJECT_KEY ? `${SUBJECT_KEY}` : "Chọn môn học ôn tập"), 
            subTitle: "Hệ thống ngân hàng câu hỏi ôn tập trực tuyến" 
        };

        function cleanSubjectName(name) {
            if (!name) return "";
            return name.replace(/^(môn|mon)\s*[:：]\s*/i, '').trim();
        }

        const initialDarkMode = document.documentElement.classList.contains('dark') || 
            localStorage.getItem('qp_theme') === 'dark' || 
            (!('qp_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);

        let state = {
            user: null,
            loading: true,
            emailInput: "",
            passwordInput: "",
            authError: "",
            isKicked: false,
            isDarkMode: initialDarkMode,
            currentPart: null,
            currentQuestionIndex: 0,
            score: 0,
            wrongScore: 0,
            showResult: false,
            selectedOptions: [],
            isSubmitted: false,
            questions: [],
            shuffledOptions: [],
            isConfirming: false,
            isConfirmingHome: false,
            sessionAnswers: [],
            reviewMode: false,
            reviewData: [],
            history: []
        };

        if (SUBJECT_KEY) {
            try {
                const saved = localStorage.getItem(`history_${SUBJECT_KEY}`);
                state.history = saved ? JSON.parse(saved) : [];
            } catch (e) { state.history = []; }
        }

        const getOrCreateDeviceToken = () => {
            let token = localStorage.getItem("qp_device_token_app");
            if (!token) {
                token = "m_dev_" + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
                localStorage.setItem("qp_device_token_app", token);
            }
            return token;
        };

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function getQuestionsArray(data) {
            if (!data) return [];
            if (Array.isArray(data)) return data.filter(Boolean);
            if (typeof data === 'object') {
                const values = Object.values(data).filter(Boolean);
                if (values.length > 0 && values[0] && typeof values[0] === 'object' && values[0].q) {
                    return values;
                }
                let combined = [];
                values.forEach(v => {
                    if (Array.isArray(v)) combined = combined.concat(v.filter(Boolean));
                    else if (v && typeof v === 'object' && v.q) combined.push(v);
                });
                return combined;
            }
            return [];
        }
        
        function toggleDarkMode() {
            state.isDarkMode = !state.isDarkMode;
            if (state.isDarkMode) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('qp_theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('qp_theme', 'light');
            }
            render();
        }

        async function fetchSubjectDetails() {
            if (!SUBJECT_KEY) return;
            try {
                const snap = await db.ref("subjects").once("value");
                const data = snap.val();
                if (data) {
                    for (const cat in data) {
                        const list = Array.isArray(data[cat]) ? data[cat] : Object.values(data[cat] || {});
                        const found = list.find(item => item && item.code && item.code.toUpperCase() === SUBJECT_KEY);
                        if (found) {
                            SUBJECT_INFO.name = found.name;
                            return;
                        }
                    }
                }
            } catch(e) {}
        }

        auth.onAuthStateChanged(async (currentUser) => {
            await fetchSubjectDetails();
if (currentUser) {
                const userEmail = (currentUser.email || "").toLowerCase().trim();
                const isAdmin = (userEmail === ADMIN_EMAIL.toLowerCase());

                const userRef = db.ref(`users/${currentUser.uid}`);
                userRef.child("currentSessionId").on("value", (snap) => {
                    const cloudSession = snap.val();
                    const localSession = localStorage.getItem("qp_active_session");
                    if (cloudSession && localSession && cloudSession !== localSession) {
                        state.isKicked = true;
                        auth.signOut();
                        state.user = null;
                        render();
                    }
                });

                if (!isAdmin && SUBJECT_KEY) {
                    const permSnap = await userRef.child(`allowedSubjects/${SUBJECT_KEY}`).once("value");
                    if (permSnap.val() !== true) {
                        state.authError = `Tài khoản chưa được cấp quyền học môn [${SUBJECT_KEY}]!`;
                        auth.signOut();
                        state.user = null;
                        state.loading = false;
                        render();
                        return;
                    }
                }

                await fetchSubjectDetails();

                if (SUBJECT_KEY) {
                    try {
                        let snap = await db.ref(`quiz_questions/${SUBJECT_KEY}`).once("value");
                        let data = snap.val();

                        if (!data) {
                            snap = await db.ref(`mon_hoc/${SUBJECT_KEY.toLowerCase()}`).once("value");
                            const oldData = snap.val();
                            if (oldData) {
                                data = oldData.parts || oldData;
                                if (oldData.name) SUBJECT_INFO.name = oldData.name;
                            }
                        }

                        if (data) {
                            if (data._title) SUBJECT_INFO.name = data._title;
                            TEST_DATA = data;
                        } else {
                            TEST_DATA = {};
                        }
                    } catch(e) {
                        console.error("Lỗi nạp đề thi:", e);
                    }
                }

                state.user = currentUser;
                state.loading = false;

                if (initialPart && (TEST_DATA[initialPart] || TEST_DATA[Number(initialPart)])) {
                    const targetPart = TEST_DATA[initialPart] ? initialPart : Number(initialPart);
                    startQuiz(targetPart);
                    initialPart = "";
                } else {
                    render();
                }
            } else {
                state.user = null;
                state.loading = false;
                render();
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            state.authError = "";
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            state.emailInput = email; state.passwordInput = password;

            auth.signInWithEmailAndPassword(email, password)
                .then(async (cred) => {
                    const newSessionId = "sess_" + Date.now() + "_" + Math.random().toString(36).substring(2, 9);
                    localStorage.setItem("qp_active_session", newSessionId);
                    await db.ref(`users/${cred.user.uid}/currentSessionId`).set(newSessionId);
                })
                .catch(() => {
                    state.authError = "Tài khoản hoặc mật khẩu bảo mật không chính xác.";
                    render();
                });
        }

        function handleGoHome() {
            state.isConfirmingHome = true;
            render();
        }

        function startQuiz(part) {
            let raw = getQuestionsArray(TEST_DATA[part]);
            if (raw.length === 0 && !isNaN(part)) {
                raw = getQuestionsArray(TEST_DATA[Number(part)]);
            }

            if (raw.length === 0) {
                alert("Bộ đề này hiện đang được cập nhật câu hỏi!");
                return;
            }

            state.questions = raw.map((item, idx) => {
                const options = [
                    { key: 'a', text: item.a }, 
                    { key: 'b', text: item.b }, 
                    { key: 'c', text: item.c }, 
                    { key: 'd', text: item.d },
                    { key: 'e', text: item.e }
                ].filter(o => o.text !== undefined && o.text !== "");

                const cleanAns = (item.ans || "a").toString().toLowerCase().replace(/[^a-e]/g, '').split('').sort().join('');

                return {
                    id: item.id || (idx + 1),
                    q: item.q,
                    correct: cleanAns || "a",
                    isMultiple: (cleanAns.length > 1),
                    options: options
                };
            });

            state.currentPart = part; 
            state.currentQuestionIndex = 0; 
            state.score = 0; 
            state.wrongScore = 0;
            state.sessionAnswers = []; 
            state.showResult = false; 
            state.selectedOptions = []; 
            state.isSubmitted = false;

            if (state.questions.length > 0) {
                state.shuffledOptions = shuffleArray(state.questions[0].options);
            }
            render();
        }

        function handleOptionSelect(key, isMultiple) {
            if (state.isSubmitted) return;
            if (isMultiple) {
                if (state.selectedOptions.includes(key)) {
                    state.selectedOptions = state.selectedOptions.filter(k => k !== key);
                } else {
                    state.selectedOptions.push(key);
                }
            } else {
                state.selectedOptions = [key];
            }
            render();
        }

        function checkAnswerSubmission() {
            if (state.selectedOptions.length === 0 || state.isSubmitted) return;
            const currentQ = state.questions[state.currentQuestionIndex];
            const userAnsStr = [...state.selectedOptions].sort().join('');
            const correctAnsStr = currentQ.correct.split('').sort().join('');
            const correct = userAnsStr === correctAnsStr;
            
            state.isSubmitted = true;
            if (correct) state.score++; else state.wrongScore++;
            state.sessionAnswers.push({ ...currentQ, userSelected: userAnsStr, options: state.shuffledOptions });
            render();
        }

        function nextQuestion() {
            if (state.currentQuestionIndex < state.questions.length - 1) {
                state.currentQuestionIndex++;
                const newQ = state.questions[state.currentQuestionIndex];
                const existing = state.sessionAnswers.find(a => a.id === newQ.id);
                if (existing) {
                    state.shuffledOptions = existing.options;
                    state.selectedOptions = existing.userSelected.split('');
                    state.isSubmitted = true;
                } else {
                    state.shuffledOptions = shuffleArray(newQ.options); 
                    state.selectedOptions = []; 
                    state.isSubmitted = false;
                }
                render();
            } else {
                state.showResult = true;
                saveHistoryToLocal();
                render();
            }
        }

        function prevQuestion() {
            if (state.currentQuestionIndex > 0) {
                state.currentQuestionIndex--;
                const newQ = state.questions[state.currentQuestionIndex];
                const existing = state.sessionAnswers.find(a => a.id === newQ.id);
                state.shuffledOptions = existing.options;
                state.selectedOptions = existing.userSelected.split('');
                state.isSubmitted = true;
                render();
            }
        }

        function saveHistoryToLocal() {
            const record = {
                id: Date.now(), 
                date: new Date().toLocaleString('vi-VN'), 
                part: state.currentPart,
                score: state.score, 
                wrong: state.wrongScore, 
                total: state.questions.length,
                details: state.sessionAnswers.map(q => ({ id: q.id, q: q.q, o: q.options || [], s: q.userSelected, c: q.correct }))
            };
            state.history.unshift(record);
            if (SUBJECT_KEY) {
                try { localStorage.setItem(`history_${SUBJECT_KEY}`, JSON.stringify(state.history)); } catch (e) {}
            }
        }

        function clearHistory() {
            if (window.confirm('Bạn có chắc muốn xóa toàn bộ lịch sử kết quả không?')) {
                state.history = []; 
                if (SUBJECT_KEY) localStorage.removeItem(`history_${SUBJECT_KEY}`); 
                render();
            }
        }

        function viewHistoryDetail(index) {
            state.reviewData = state.history[index].details || []; 
            state.reviewMode = true; 
            render();
        }

        function setReviewMode(val) { state.reviewMode = val; render(); }
        function requestFinish() { state.isConfirming = true; render(); }
        function setConfirming(val) { state.isConfirming = val; render(); }
        function confirmFinish() { state.showResult = true; state.isConfirming = false; saveHistoryToLocal(); render(); }
        function resetQuiz() { state.currentPart = null; state.questions = []; state.reviewMode = false; render(); }

        function render() {
            const root = document.getElementById('root');
            
            if (state.loading) {
                root.innerHTML = `
                    <div class="min-h-screen flex flex-col items-center justify-center">
                        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-brand-500 mb-4"></div>
                        <p class="text-slate-500 dark:text-slate-400 font-medium text-sm">Đang nạp dữ liệu đề thi...</p>
                    </div>`;
                return;
            }

            const displayName = cleanSubjectName(SUBJECT_INFO.name);

            if (!state.user) {
                root.innerHTML = `
                    <div class="min-h-screen p-6 flex flex-col items-center justify-center relative w-full">
                        <header class="absolute top-4 inset-x-4 sm:top-6 sm:inset-x-8 z-50 flex items-center justify-between pointer-events-none">
                            <div class="flex items-center gap-3 px-4 py-2 sm:px-5 sm:py-3 rounded-2xl border shadow-md glass-panel pointer-events-auto">
                                <div class="bg-gradient-to-br from-brand-500 to-emerald-600 text-white p-2 rounded-xl shadow-md"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></div>
                                <div class="flex flex-col items-start">
                                    <span class="text-sm font-black text-brand-700 dark:text-emerald-400 leading-none tracking-tight uppercase">QuizPoint</span>
                                    <span class="text-[10px] font-bold text-slate-400 dark:text-slate-500 leading-tight uppercase tracking-widest">Studio</span>
                                </div>
                            </div>
                            <button onclick="toggleDarkMode()" class="p-3 rounded-2xl border shadow-md glass-panel text-slate-700 dark:text-amber-400 pointer-events-auto active:scale-95">
                                ${state.isDarkMode ? '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>' : '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>'}
                            </button>
                        </header>
                        <div class="w-full max-w-md p-8 sm:p-10 rounded-3xl shadow-2xl border bg-white dark:bg-slate-900 border-slate-100 dark:border-slate-800/80 animate-enter mt-14">
                            <div class="text-center mb-8">
                                <div class="inline-flex p-3 bg-brand-50 dark:bg-brand-950/50 text-brand-600 dark:text-emerald-400 rounded-2xl mb-3"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
<h2 class="text-2xl font-black text-slate-800 dark:text-white tracking-tight uppercase">Đăng nhập môn học</h2>
<p class="text-xs sm:text-sm text-brand-600 dark:text-emerald-400 font-extrabold mt-1.5 uppercase tracking-wide">
    ${displayName}
</p>
                            </div>
                            ${state.isKicked ? `
                                <div class="mb-4 p-3 bg-rose-50 dark:bg-rose-950/40 border-l-4 border-rose-500 text-rose-700 dark:text-rose-400 text-xs font-semibold rounded-r-xl flex items-start gap-2 animate-enter">
                                    <svg class="flex-shrink-0 mt-0.5 animate-pulse text-rose-600" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                                    <p>Tài khoản vừa bị khóa vì phát hiện đăng nhập cùng lúc từ một thiết bị khác!</p>
                                </div>` : ''}
                            <form onsubmit="handleLogin(event)" class="space-y-5">
                                <div>
                                    <label class="block text-xs font-extrabold text-slate-400 mb-2 uppercase tracking-wider">Tài khoản Email</label>
                                    <input type="email" id="emailInput" placeholder="abc...@quizpointstudio.com" class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-white rounded-xl font-semibold border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-4 focus:ring-brand-500/20 text-sm" value="${state.emailInput}" required />
                                </div>
                                <div>
                                    <label class="block text-xs font-extrabold text-slate-400 mb-2 uppercase tracking-wider">Mật mã bảo mật</label>
                                    <input type="password" id="passwordInput" placeholder="••••••••" class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-white rounded-xl font-semibold border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-4 focus:ring-brand-500/20 text-sm" value="${state.passwordInput}" required />
                                </div>
                                <div id="authError" class="text-xs font-bold text-rose-500 bg-rose-50 dark:bg-rose-950/30 p-3 rounded-lg border border-rose-100 dark:border-rose-900/40 hidden"></div>
                                <button type="submit" class="w-full py-4 bg-gradient-to-r from-brand-500 to-emerald-600 text-white font-extrabold rounded-xl shadow-lg hover:shadow-xl transition-all text-sm uppercase tracking-wider">Xác nhận đăng nhập</button>
                            </form>
                            
                            <div class="mt-6 pt-5 border-t border-slate-100 dark:border-slate-800">
                                <button onclick="window.location.href='./index.html'" 
                                        class="w-full py-3 px-4 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 hover:bg-slate-100 dark:bg-slate-800/80 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-brand-600 dark:hover:text-emerald-400 font-black text-xs uppercase tracking-wider transition-all shadow-sm flex items-center justify-center gap-2 active:scale-[0.98]">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                                    <span>Quay lại danh mục trang chủ</span>
                                </button>
                            </div>
                        </div>
                    </div>`;
                if(state.authError) {
                    const errDiv = document.getElementById('authError');
                    errDiv.innerText = state.authError;
                    errDiv.classList.remove('hidden');
                }
                return;
            }

            if (state.reviewMode) {
                root.innerHTML = `
                    <div class="min-h-screen p-4 sm:p-6 lg:p-8 bg-slate-50/50 dark:bg-slate-950/20 w-full flex flex-col items-center">
                        <div class="w-full max-w-4xl space-y-6">
                            <div class="glass-panel p-4 rounded-2xl shadow-sm sticky top-4 z-10 flex justify-between items-center mb-8 border">

                                      <div class="p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-100 dark:border-slate-800/80 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4 hover:shadow-md transition-shadow">
                                        <div class="flex-1 w-full sm:w-auto">
                                          <div class="font-black text-sm text-slate-700 dark:text-slate-300 uppercase tracking-tight">Đề ${record.part}</div>
                                          <div class="text-[11px] font-bold text-slate-400 dark:text-slate-500 mt-1 italic">${record.date}</div>
                                        </div>
                                        <div class="flex items-center gap-4">
                                            <div class="text-right">
                                                <div class="text-sm font-black"><span class="text-emerald-600 dark:text-emerald-400">${record.score} Đ</span><span class="text-rose-500 ml-1.5">/ ${record.wrong} S</span></div>
                                                <div class="text-[10px] font-extrabold text-slate-400 tracking-wide">/${record.total} CÂU</div>
                                            </div>
                                            <button onclick="viewHistoryDetail(${index})" class="p-2 bg-brand-50 dark:bg-slate-800 text-brand-600 dark:text-emerald-400 rounded-xl hover:bg-brand-100 dark:hover:bg-slate-700 transition-colors">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                            </button>
                                        </div>
                                      </div>`).join('')}
                                  </div>`}
                            </div>
                        </div>
                    </div>`;
                return;
            }

            if (state.showResult) {
                root.innerHTML = `
                    <div class="min-h-screen flex flex-col items-center justify-center p-4 text-center w-full">
                        <div class="bg-white dark:bg-slate-900 p-8 sm:p-10 rounded-3xl shadow-2xl max-w-md w-full border border-slate-100 dark:border-slate-800 animate-enter">
                          <div class="relative inline-block mb-6">
                            <div class="absolute inset-0 bg-yellow-400 blur-xl opacity-30 rounded-full"></div>
                            <svg class="w-20 h-20 text-yellow-500 relative z-10" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
                          </div>
                          <h2 class="text-2xl font-black text-slate-800 dark:text-white uppercase tracking-tight mb-2">Hoàn Thành Bài Ôn Tập!</h2>
                          <div class="grid grid-cols-2 gap-4 mb-8 mt-6">
                            <div class="p-4 bg-emerald-50 dark:bg-emerald-950/20 rounded-2xl border border-emerald-100"><p class="text-emerald-600 dark:text-emerald-400 text-xs font-extrabold uppercase tracking-wider mb-1">Đúng</p><p class="text-4xl font-black text-emerald-600 dark:text-emerald-400 font-mono">${state.score}</p></div>
                            <div class="p-4 bg-rose-50 dark:bg-rose-950/20 rounded-2xl border border-rose-100"><p class="text-rose-500 dark:text-rose-400 text-xs font-extrabold uppercase tracking-wider mb-1">Sai / Thiếu</p><p class="text-4xl font-black text-rose-500 dark:text-rose-400 font-mono">${state.wrongScore}</p></div>
                          </div>
                          <button onclick="resetQuiz()" class="w-full py-4 bg-gradient-to-r from-brand-500 to-emerald-600 text-white rounded-xl font-extrabold text-xs uppercase tracking-wider shadow-lg flex items-center justify-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg> 
                            Về màn hình chính
                          </button>
                        </div>
                    </div>`;
                return;
            }

            const currentQ = state.questions[state.currentQuestionIndex];
            const progress = ((state.currentQuestionIndex + 1) / state.questions.length) * 100;

            root.innerHTML = `
                <div class="fixed inset-0 bg-slate-950/60 backdrop-blur-md z-50 flex items-center justify-center p-4 ${state.isConfirming ? 'block' : 'hidden'}">
                  <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-2xl border border-slate-100">
                    <h3 class="text-lg font-black text-slate-800 dark:text-white uppercase tracking-tight mb-2">Nộp bài & kết thúc?</h3>
                    <p class="text-xs text-slate-400 dark:text-slate-500 font-medium mb-6">Kết quả bài làm hiện tại của bạn sẽ được lưu giữ lại hệ thống.</p>
                    <div class="flex gap-3">
                      <button onclick="setConfirming(false)" class="flex-1 py-3 px-4 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl font-bold text-xs uppercase tracking-wider transition-colors">Tiếp bài làm</button>
                      <button onclick="confirmFinish()" class="flex-1 py-3 px-4 bg-rose-500 text-white rounded-xl font-bold text-xs uppercase tracking-wider shadow-lg transition-colors">Nộp bài ngay</button>
                    </div>
                  </div>
                </div>

                <div class="min-h-screen flex flex-col items-center p-4 sm:p-6 w-full max-w-3xl mx-auto relative justify-start">
                    <div class="w-full flex justify-between items-center mb-6 pt-2">
                        <button onclick="requestFinish()" 
                                class="flex items-center gap-1.5 px-3.5 py-2 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 bg-white/80 dark:bg-slate-900/80 glass-panel shadow-sm text-slate-600 dark:text-slate-300 hover:text-rose-600 hover:border-rose-300 dark:hover:text-rose-400 dark:hover:border-rose-900 text-xs font-black transition-all active:scale-95" 
                                title="Thoát và nộp bài">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                            <span>Quay về</span>
                        </button>

                        <div class="glass-panel px-4 py-2 rounded-full border border-slate-200/80 dark:border-slate-700/80 text-xs font-bold text-slate-600 dark:text-slate-300 tracking-wide uppercase shadow-sm">
                            Câu ${state.currentQuestionIndex + 1} / ${state.questions.length}
                        </div>

                        <div class="flex items-center gap-1 text-emerald-600 dark:text-emerald-400 font-extrabold text-xs bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 px-3.5 py-2 rounded-2xl font-mono shadow-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> 
                            <span>${state.score}</span>
                        </div>
                    </div>
                    
                    <div class="w-full mb-8">
                        <div class="h-2.5 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden shadow-inner"><div class="h-full bg-gradient-to-r from-emerald-400 to-teal-500 transition-all rounded-full" style="width: ${progress}%"></div></div>
                    </div>
                    
                    <div class="w-full bg-white dark:bg-slate-900 p-6 sm:p-10 rounded-3xl shadow-xl border border-slate-100 dark:border-slate-800/60 mb-24 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-brand-500 to-emerald-600"></div>
                        
                        <div>
                            <div class="mb-6">
                                <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                                    <span class="inline-block bg-slate-50 dark:bg-slate-800 text-slate-400 dark:text-slate-500 text-[10px] font-extrabold px-2.5 py-1 rounded-md tracking-wider border border-slate-100">ID: #${currentQ.id}</span>
                                    <span class="text-[10px] font-black tracking-wider uppercase px-2.5 py-1 rounded-full ${currentQ.isMultiple ? 'bg-amber-50 text-amber-600 border border-amber-200' : 'bg-teal-50 text-teal-600 border border-teal-200'}">
                                        ${currentQ.isMultiple ? "☑ Tích chọn nhiều đáp án" : "🔘 Chọn một đáp án"}
                                    </span>
                                </div>
                                <h2 class="text-lg sm:text-xl font-black text-slate-800 dark:text-slate-100 leading-snug tracking-tight">${currentQ.q}</h2>
                            </div>
                            
                            <div class="space-y-3.5">
                                ${state.shuffledOptions.map((option) => {
                                    const isSelected = state.selectedOptions.includes(option.key);
                                    const isOptCorrect = currentQ.correct.split('').includes(option.key);
                                    
                                    let containerClass = "w-full p-4 sm:p-5 rounded-2xl border text-left font-semibold transition-all duration-200 transform active:scale-[0.98] flex justify-between items-center relative overflow-hidden text-xs sm:text-sm ";
                                    
                                    if (state.isSubmitted) {
                                      containerClass += " active:scale-100 cursor-not-allowed "; 
                                      if (isOptCorrect) containerClass += "border-emerald-500 bg-emerald-50 dark:bg-emerald-950/30 text-emerald-800 dark:text-emerald-300 ring-2 ring-emerald-200 dark:ring-emerald-900/40 shadow-inner";
                                      else if (isSelected) containerClass += "border-rose-500 bg-rose-50 dark:bg-rose-950/30 text-rose-800 dark:text-rose-300 ring-2 ring-rose-200 shadow-inner";
                                      else containerClass += "border-slate-100 dark:border-slate-800 text-slate-400 opacity-50";
                                    } else {
                                      if (isSelected) containerClass += "border-emerald-500 bg-emerald-50/60 dark:bg-slate-800/80 text-emerald-900 dark:text-teal-300 ring-2 ring-emerald-200 dark:ring-emerald-900/40 shadow-md -translate-y-0.5";
                                      else containerClass += "border-slate-100 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-brand-50/40 hover:border-brand-200 hover:shadow-sm hover:-translate-y-0.5";
                                    }

                                    return `
                                        <button onclick="handleOptionSelect('${option.key}', ${currentQ.isMultiple})" ${state.isSubmitted ? 'disabled' : ''} class="${containerClass}">
                                            <div class="flex items-center gap-3.5 relative z-10">
                                                <div class="w-5 h-5 flex items-center justify-center border-2 flex-shrink-0 rounded-md transition-colors ${isSelected ? 'border-brand-500 bg-brand-500 text-white' : 'border-slate-300 bg-white dark:bg-slate-900'}">
                                                    ${isSelected ? '<svg class="w-3 h-3 fill-current" viewBox="0 0 20 20"><path d="M0 11l2-2 5 5L18 3l2 2L7 18z"/></svg>' : ''}
                                                </div>
                                                <span class="leading-relaxed">${option.text}</span>
                                            </div>
                                            ${state.isSubmitted && isOptCorrect ? '<svg class="text-emerald-600 dark:text-emerald-400 flex-shrink-0 ml-4" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>' : ''}
                                            ${state.isSubmitted && isSelected && !isOptCorrect ? '<svg class="text-rose-600 dark:text-rose-400 flex-shrink-0 ml-4" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>' : ''}
                                        </button>`;
                                }).join('')}
                            </div>
                            
                            ${!state.isSubmitted && state.selectedOptions.length > 0 ? `
                                <div class="mt-6 flex justify-end">
                                    <button onclick="checkAnswerSubmission()" class="px-6 py-3 bg-gradient-to-r from-brand-500 to-emerald-600 text-white font-extrabold rounded-xl text-xs uppercase tracking-wider shadow-md transform active:scale-95 transition-transform">
                                        Xác nhận đáp án
                                    </button>
                                </div>` : ''}
                        </div>
                    </div>

                    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md border-t border-slate-100 dark:border-slate-900 flex justify-center items-center gap-4 z-20">
                        <button onclick="prevQuestion()" ${state.currentQuestionIndex === 0 ? 'disabled' : ''} class="w-12 h-12 rounded-2xl flex items-center justify-center border text-slate-600 dark:text-slate-400 disabled:opacity-25 active:scale-95 transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button>
                        <button onclick="nextQuestion()" ${!state.isSubmitted ? 'disabled' : ''} class="flex-1 max-w-md h-12 rounded-2xl font-black text-xs uppercase tracking-wider shadow-md flex items-center justify-center gap-2 disabled:bg-slate-200 dark:disabled:bg-slate-800 disabled:text-slate-400 dark:disabled:text-slate-600 bg-brand-500 text-white disabled:cursor-not-allowed active:scale-[0.99] transition-all">
                            ${state.currentQuestionIndex === state.questions.length - 1 ? "Xem kết quả" : "Câu tiếp theo"} <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
                        </button>
                    </div>
                </div>`;
        }

        window.addEventListener('DOMContentLoaded', () => { render(); });
    </script>
</body>
</html>
