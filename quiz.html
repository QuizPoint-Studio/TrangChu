                        </div>
                        <span class="text-slate-400 font-semibold text-[10px] sm:text-xs font-mono">${Math.round(((curIdx + 1) / list.length) * 100)}%</span>
                    </div>

                    <!-- THẺ GỢI Ý & ĐỊNH NGHĨA KHÁI NIỆM -->
                    <div class="space-y-2 py-0.5">
                        <div class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full text-[10px] sm:text-[11px] font-black uppercase tracking-wider bg-teal-50 dark:bg-teal-950/60 text-teal-700 dark:text-teal-300 border border-teal-200/80 dark:border-teal-800/60 shadow-2xs">
                            <svg class="w-3 h-3 sm:w-3.5 sm:h-3.5 text-teal-600 dark:text-teal-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7z"/><path d="M9 21h6"/></svg>
                            <span>GỢI Ý / ĐỊNH NGHĨA</span>
                        </div>
                        
                        <h2 class="text-xl sm:text-2xl md:text-3xl font-black text-slate-900 dark:text-slate-50 tracking-tight leading-snug max-w-2xl mx-auto break-words">
                            ${escapeHTML(item.hint)}
                        </h2>

                        ${item.note ? `
                            <div class="inline-block px-3 py-1 rounded-xl bg-slate-100/80 dark:bg-slate-800/80 text-xs text-slate-500 dark:text-slate-400 font-medium italic border border-slate-200/60 dark:border-slate-700/60">
                                📌 ${escapeHTML(item.note)}
                            </div>
                        ` : ''}
                    </div>

                    <!-- SÀN GHÉP TỪ (THE WORD STAGE) - THIẾT KẾ ĐẲNG CẤP, CHỮ TO RÕ NHƯ KHO CHỮ, KHÔNG BỌC KHUNG RỜI RẠC -->
                    <div class="p-4 sm:p-6 md:p-8 rounded-2xl sm:rounded-3xl bg-slate-100/70 dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 min-h-[110px] sm:min-h-[130px] flex flex-col items-center justify-center relative space-y-3.5 max-w-full">
                        
                        <!-- CÁC TỪ & Ô CHỮ CÁI (THIẾT KẾ 3D CHUẨN XỊN, DỄ NHÌN, ĐỒNG BỘ 100% VỚI KHO CHỮ) -->
                        <div class="flex flex-wrap items-center justify-center gap-y-3.5 gap-x-4 sm:gap-x-8 py-1 max-w-full">
                            ${wordGroups.map((wg, gIdx) => `
                                <div class="flex flex-wrap items-center justify-center ${slotGapClass} max-w-full">
                                    ${wg.map(s => {
                                        const filled = !!s.placedChar;
                                        let btnClass = `${slotSizeClass} font-black flex items-center justify-center transition-all duration-150 select-none shrink-0 `;
                                        if (isDone) {
                                            btnClass += "bg-gradient-to-b from-emerald-500 to-teal-600 text-white border border-emerald-600 border-b-2 sm:border-b-4 border-b-emerald-800 shadow-md shadow-emerald-500/25 pointer-events-none";
                                        } else if (hasError && filled) {
                                            btnClass += "bg-gradient-to-b from-rose-500 to-rose-600 text-white border border-rose-600 border-b-2 sm:border-b-4 border-b-rose-800 shadow-md shadow-rose-500/25 ring-2 ring-rose-300 cursor-pointer active:translate-y-0.5 active:border-b-0";
                                        } else if (filled) {
                                            btnClass += "bg-gradient-to-b from-teal-500 to-emerald-600 text-white border border-teal-600 border-b-2 sm:border-b-4 border-b-emerald-700 shadow-md shadow-emerald-500/25 hover:scale-105 active:translate-y-0.5 active:border-b-0 cursor-pointer";
                                        } else {
                                            btnClass += "bg-white/90 dark:bg-slate-900/90 text-slate-300 dark:text-slate-600 border-2 border-dashed border-slate-300 dark:border-slate-700 hover:border-emerald-400 hover:bg-emerald-50/30 dark:hover:bg-slate-800 cursor-pointer shadow-inner";
                                        }
                                        return `
                                            <button type="button" onclick="tapScientificSlot(${s.slotIdx})" class="${btnClass}" title="${filled ? 'Chạm để rút lại chữ này' : 'Ô trống'}">
                                                ${s.displayChar || '<span class="w-3.5 sm:w-4.5 h-0.5 sm:h-1 rounded-full bg-slate-300 dark:bg-slate-600"></span>'}
                                            </button>
                                        `;
                                    }).join('')}
                                </div>
                            `).join('')}
                        </div>

                        <div class="text-xs sm:text-sm font-bold text-slate-500 dark:text-slate-400 text-center px-1">
                            ${isDone ? '<span class="text-emerald-600 dark:text-emerald-400 font-extrabold text-sm sm:text-base">🎉 Đã ghép chính xác hoàn toàn!</span>' : 'Chạm ô đã ghép phía trên để rút lại chữ'}
                        </div>
                    </div>

                    <!-- KHU VỰC THAO TÁC / KHO CHỮ / KẾT QUẢ -->
                    ${isDone ? `
                        <!-- KHUNG CHIẾN THẮNG & NÚT TIẾP TỤC ĐẲNG CẤP -->
                        <div class="p-5 sm:p-6 rounded-2xl sm:rounded-3xl bg-gradient-to-br from-emerald-500/10 via-teal-500/10 to-cyan-500/10 border-2 border-emerald-500/30 text-center space-y-3 animate-enter shadow-lg shadow-emerald-500/5">
                            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 text-xs font-black uppercase tracking-wider">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                                <span>🎉 XUẤT SẮC! BẠN ĐÃ GHÉP ĐÚNG TỪ:</span>
                            </div>

                            <div class="text-2xl sm:text-3xl md:text-4xl font-black text-emerald-700 dark:text-emerald-300 tracking-wider font-mono py-1 break-words">
                                ${escapeHTML(item.word)}
                            </div>

                            ${item.note ? `<p class="text-xs text-slate-600 dark:text-slate-300 font-medium italic max-w-md mx-auto">${escapeHTML(item.note)}</p>` : ''}

                            <div class="pt-1 flex items-center justify-center gap-2.5 flex-wrap">
                                <button type="button" onclick="setupWordMatchItem(state.wordMatchGame.currentIndex); refreshWordMatchDOM();" class="px-5 py-2.5 rounded-2xl border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs font-bold transition-all active:scale-95 cursor-pointer shadow-xs">
                                    ↺ Ghép lại từ này
                                </button>
                            </div>
                        </div>
                    ` : `
                        <!-- KHO CHỮ CÁI GỌN GÀNG, KHÔNG DÀI DÒNG -->
                        <div class="p-3 sm:p-5 rounded-2xl sm:rounded-3xl bg-slate-100/70 dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 space-y-2.5 max-w-full">
                            <div class="text-[10px] font-black uppercase tracking-wider text-slate-400 flex items-center justify-between px-1">
                                <span>KHO CHỮ CÁI</span>
                                <span class="text-emerald-600 dark:text-emerald-400 font-bold font-mono">${placedCount}/${totalChars} chữ</span>
                            </div>

                            <div class="flex flex-wrap items-center justify-center gap-1.5 sm:gap-2 max-w-xl mx-auto py-1">
                                ${state.wordMatchGame.tiles.map(t => {
                                    const placed = !!t.isPlaced;
                                    return `
                                        <button type="button" onclick="tapScientificTile('${t.id}')" ${placed ? 'disabled' : ''} class="w-10 h-12 sm:w-12 sm:h-14 md:w-13 md:h-15 rounded-xl sm:rounded-2xl font-black text-lg sm:text-xl md:text-2xl transition-all duration-150 select-none flex items-center justify-center ${placed ? 'opacity-20 scale-95 pointer-events-none bg-slate-200/50 dark:bg-slate-800/30 text-transparent border border-transparent border-b-0' : 'bg-white dark:bg-slate-750 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 border-b-2 sm:border-b-4 border-b-slate-300 dark:border-b-slate-900 shadow-sm hover:border-b-emerald-500 hover:text-emerald-600 hover:-translate-y-0.5 active:translate-y-0.5 active:border-b-0 cursor-pointer'}">
                                            ${t.char}
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <!-- NÚT XÁC NHẬN ĐÁP ÁN NỔI BẬT NHƯ TRẮC NGHIỆM -->
                        <div class="pt-1 flex items-center justify-center">
                            <button type="button" onclick="confirmWordMatchAnswer()" class="w-full sm:w-auto px-8 sm:px-10 py-3 sm:py-3.5 rounded-2xl ${allFilled ? 'bg-gradient-to-r from-emerald-600 via-teal-600 to-cyan-600 text-white shadow-xl shadow-teal-500/30 scale-[1.02] ring-4 ring-emerald-400/30 hover:opacity-95' : 'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700'} font-black text-xs sm:text-sm uppercase tracking-wider transition-all active:scale-95 flex items-center justify-center gap-2 cursor-pointer">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                                <span>XÁC NHẬN ĐÁP ÁN</span>
                            </button>
                        </div>
                    `}

                    <!-- THANH ĐIỀU HƯỚNG TRƯỚC / SAU THIẾT KẾ GIỐNG 100% TRẮC NGHIỆM -->
                    <div class="pt-4 flex items-center justify-between gap-2.5 sm:gap-3 border-t border-slate-100 dark:border-slate-800">
                        <button type="button" onclick="prevScientificWord()" ${curIdx === 0 ? 'disabled' : ''} class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl flex items-center justify-center border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 disabled:opacity-25 disabled:cursor-not-allowed hover:bg-slate-50 dark:hover:bg-slate-700 transition-all active:scale-95 shadow-sm cursor-pointer shrink-0" title="Từ trước">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
                        </button>

                        <div class="flex items-center gap-1.5 sm:gap-2">
                            ${!isDone ? `
                                <button type="button" onclick="resetScientificCurrentWord()" class="px-3 py-2 sm:px-3.5 sm:py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs font-bold transition-all active:scale-95 cursor-pointer flex items-center gap-1 shadow-xs" title="Xóa toàn bộ các chữ đã ghép">
                                    <span>↺ Đặt lại</span>
                                </button>
                                <button type="button" onclick="hintScientificNextLetter()" class="px-3.5 py-2 sm:px-4 sm:py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white font-black text-xs uppercase tracking-wider transition-all shadow-md shadow-amber-500/20 active:scale-95 flex items-center gap-1.5 cursor-pointer" title="Gợi ý 1 chữ cái kế tiếp">
                                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7z"/></svg>
                                    <span>Gợi ý</span>
                                </button>
                            ` : ''}
                        </div>

                        <button type="button" onclick="nextScientificWord()" ${!isAnswered ? 'disabled' : ''} class="flex-1 max-w-xs h-11 sm:h-12 rounded-2xl font-black text-xs sm:text-sm uppercase tracking-wider transition-all flex items-center justify-center gap-2 ${isAnswered ? 'bg-gradient-to-r from-brand-500 to-emerald-600 hover:from-brand-600 hover:to-emerald-700 text-white shadow-md active:scale-[0.99] cursor-pointer' : 'bg-slate-200 dark:bg-slate-800 text-slate-400 dark:text-slate-500 cursor-not-allowed opacity-50 shadow-none pointer-events-none'}" title="${isAnswered ? 'Chuyển sang từ tiếp theo' : 'Vui lòng xác nhận đáp án trước'}">
                            <span>${curIdx === list.length - 1 ? (isDone ? "Hoàn thành" : "Từ cuối ➔") : "Từ tiếp theo"}</span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
                        </button>
                    </div>
                </div>
            `;
        }

        // BẮT PHÍM GÕ TỰ ĐỘNG KHI ĐANG Ở CHẾ ĐỘ GHÉP CHỮ
        function initScientificGameListeners() {
            if (window._scientificListenerAttached) return;
            window._scientificListenerAttached = true;

            window.addEventListener('keydown', (e) => {
                if (state.studyMode !== 'scientific') return;
                const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
                if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

                if (e.key === 'Backspace') {
                    e.preventDefault();
                    if (!state.wordMatchGame || !state.wordMatchGame.slots) return;
                    const filledSlots = state.wordMatchGame.slots.filter(s => !s.isSpace && !!s.placedChar);
                    if (filledSlots.length > 0) {
                        const last = filledSlots[filledSlots.length - 1];
                        tapScientificSlot(last.slotIdx);
                    }
                    return;
                }

                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (state.wordMatchGame && state.wordMatchGame.isCompleted) {
                        nextScientificWord();
                    } else if (typeof confirmWordMatchAnswer === 'function') {
                        confirmWordMatchAnswer();
                    }
                    return;
                }

                if (e.key && e.key.length === 1 && /^[a-zA-Z]$/.test(e.key)) {
                    if (!state.wordMatchGame || !state.wordMatchGame.tiles || state.wordMatchGame.isCompleted) return;
                    const charLower = e.key.toLowerCase();
                    const available = state.wordMatchGame.tiles.find(t => !t.isPlaced && t.originalChar.toLowerCase() === charLower);
                    if (available) {
                        e.preventDefault();
                        tapScientificTile(available.id);
                    }
                }
            });
        }

        window.saveEditingEssayItem = async function(id) {
            const targetId = id || state.editingEssayId;
            if (!targetId) return;
            const qEl = document.getElementById(`edit-essay-q-${targetId}`);
            const aEl = document.getElementById(`edit-essay-a-${targetId}`);
            if (!qEl || !aEl) return;

            const newQ = qEl.value.trim();
            const newA = aEl.value.trim();
            if (!newQ) {
                showAntiCheatToast("⚠️ Nội dung câu hỏi không được để trống!");
                return;
            }

            const idMatch = String(targetId).match(/^p(.+?)_q(\d+)$/);
            let targetPart = null;
            let targetIdx = -1;
            let currentOrigQ = "";
            let currentOrigA = "";

            if (idMatch) {
                targetPart = idMatch[1];
                targetIdx = parseInt(idMatch[2], 10) - 1;
                const items = Array.isArray(ESSAY_DATA[targetPart]) ? ESSAY_DATA[targetPart] : Object.values(ESSAY_DATA[targetPart] || {});
                if (items[targetIdx]) {
                    currentOrigQ = items[targetIdx].q || items[targetIdx].question || "";
                    currentOrigA = items[targetIdx].a || items[targetIdx].ans || items[targetIdx].answer || "";
                }
            }

            // Nếu người dùng là Quản trị viên (Admin): Lưu trực tiếp vào Database Firebase để cập nhật chính thức cho toàn hệ thống
            if (isAdminUser() && targetPart && targetIdx >= 0) {
                try {
                    let items = Array.isArray(ESSAY_DATA[targetPart]) ? [...ESSAY_DATA[targetPart]] : Object.values(ESSAY_DATA[targetPart] || {});
                    if (items[targetIdx]) {
                        items[targetIdx] = {
                            ...items[targetIdx],
                            q: newQ,
                            question: newQ,
                            a: newA,
                            ans: newA,
                            answer: newA
                        };
                        ESSAY_DATA[targetPart] = items;
                        if (TEST_DATA && TEST_DATA['essay_' + targetPart]) TEST_DATA['essay_' + targetPart] = items;
                        if (TEST_DATA && TEST_DATA._essay && TEST_DATA._essay[targetPart]) TEST_DATA._essay[targetPart] = items;

                        const nowMs = Date.now();
                        await db.ref(`quiz_questions/${SUBJECT_KEY}/_essay/${targetPart}`).set(items);
                        await db.ref(`quiz_questions/${SUBJECT_KEY}/essay_${targetPart}`).set(items);
                        await db.ref(`essay_questions/${SUBJECT_KEY}/${targetPart}`).set(items).catch(() => {});
                        await db.ref(`quiz_questions/${SUBJECT_KEY}/_last_updated`).set(nowMs).catch(() => {});
                    }
                } catch (fbErr) {
                    console.warn("Lỗi lưu trực tiếp Firebase:", fbErr);
                }

                // Xóa bản nháp ghi đè cục bộ để luôn ưu tiên hiển thị từ database
                if (state.essayCustomEdits && state.essayCustomEdits[targetId]) {
                    delete state.essayCustomEdits[targetId];
                    try {
                        localStorage.setItem(`qp_essay_custom_edits_${SUBJECT_KEY}`, JSON.stringify(state.essayCustomEdits));
                    } catch(e) {}
                }

                state.editingEssayId = null;
                const scrollY = window.scrollY;
                render();
                window.scrollTo({ top: scrollY, behavior: 'instant' });
                showAntiCheatToast("💾 Đã lưu thay đổi vào ngân hàng đề thi thành công!");
                return;
            }

            // Đối với người học thông thường: Lưu bản ghi chú cá nhân kèm câu hỏi gốc để đối chiếu khi đề được tải lại
            if (!state.essayCustomEdits) state.essayCustomEdits = {};
            state.essayCustomEdits[targetId] = {
                question: newQ,
                answer: newA,
                baseOrigQ: currentOrigQ || newQ,
                baseOrigA: currentOrigA || newA,
                updatedAt: Date.now()
            };

            try {
                localStorage.setItem(`qp_essay_custom_edits_${SUBJECT_KEY}`, JSON.stringify(state.essayCustomEdits));
            } catch (e) {}

            state.editingEssayId = null;

            const scrollY = window.scrollY;
            render();
            window.scrollTo({ top: scrollY, behavior: 'instant' });
            showAntiCheatToast("💾 Đã lưu thay đổi thành công!");
        };

        function getNormalizedEssayList() {
            let essayList = [];
            const filter = (state.essayPartFilter && state.essayPartFilter !== 'all') ? String(state.essayPartFilter) : null;
            const allParts = getEssayPartKeys();
            let sortedParts = allParts;
            const partParents = (TEST_DATA && TEST_DATA._part_parents) ? TEST_DATA._part_parents : ((ESSAY_DATA && ESSAY_DATA._part_parents) ? ESSAY_DATA._part_parents : {});
            if (filter) {
                sortedParts = allParts.filter(p => {
                    if (String(p) === String(filter)) return true;
                    if (partParents[p] && String(partParents[p]) === String(filter)) return true;
                    if (partParents['essay_' + p] && String(partParents['essay_' + p]) === String(filter)) return true;
                    return false;
                });
            }
            const showTag = allParts.length > 1;
            const customEdits = state.essayCustomEdits || {};

            sortedParts.forEach(part => {
                const items = Array.isArray(ESSAY_DATA[part]) ? ESSAY_DATA[part] : Object.values(ESSAY_DATA[part] || {});
                const pTitle = showTag ? getPartName(part, 'essay') : '';

                items.forEach((it, idx) => {
                    if (it && (it.q || it.question)) {
                        const id = 'p' + part + '_q' + (idx + 1);
                        const origQ = it.q || it.question;
                        const origA = it.a || it.ans || it.answer || "Đang cập nhật đáp án chi tiết...";
                        let custom = customEdits[id];

                        // TỰ ĐỘNG DỌN SẠCH BẢN SỬA CŨ NẾU ĐỀ THI ĐÃ ĐƯỢC TẢI LẠI HOẶC CẬP NHẬT MỚI
                        if (custom) {
                            let isObsolete = false;
                            // a. Nếu là Admin: luôn ưu tiên hiển thị nội dung mới nhất 100% từ Database
                            if (isAdminUser()) {
                                isObsolete = true;
                            }
                            // b. Nếu câu hỏi trong database không còn khớp với câu gốc lúc sửa (đề mới đã được tải lên)
                            else if (custom.baseOrigQ && custom.baseOrigQ.trim() !== origQ.trim()) {
                                isObsolete = true;
                            }
                            // c. Nếu đề trên Firebase có mốc thời gian cập nhật mới hơn bản sửa
                            const examLastUpdated = (TEST_DATA && TEST_DATA._last_updated) || (ESSAY_DATA && ESSAY_DATA._last_updated) || 0;
                            if (examLastUpdated && custom.updatedAt && custom.updatedAt < examLastUpdated) {
                                isObsolete = true;
                            }

                            if (isObsolete) {
                                delete state.essayCustomEdits[id];
                                try {
                                    localStorage.setItem(`qp_essay_custom_edits_${SUBJECT_KEY}`, JSON.stringify(state.essayCustomEdits));
                                } catch(e) {}
                                custom = null;
                            }
                        }

                        essayList.push({
                            id: id,
                            question: (custom && custom.question !== undefined) ? custom.question : origQ,
                            answer: (custom && custom.answer !== undefined) ? custom.answer : origA,
                            origQuestion: origQ,
                            origAnswer: origA,
                            isCustomEdited: !!custom,
                            keywords: it.keywords || it.tags || [],
                            part: part,
                            partTitle: pTitle
                        });
                    }
                });
            });

            return essayList;
        }

            const partParents = (TEST_DATA && TEST_DATA._part_parents) ? TEST_DATA._part_parents : ((ESSAY_DATA && ESSAY_DATA._part_parents) ? ESSAY_DATA._part_parents : {});
            const scopeOn = !!state.partScope && !state.showAllParts;

                const scopeStr = String(state.partScope);
                const childKeys = rawPartKeys.filter(k => String(partParents[k]) === scopeStr && getQuestionsArray(TEST_DATA[k]).length > 0);
                const parentHasQuestions = rawPartKeys.includes(scopeStr) && getQuestionsArray(TEST_DATA[scopeStr]).length > 0;

                if (childKeys.length > 0) {
                    partKeys = childKeys;
                    if (parentHasQuestions && !childKeys.includes(scopeStr)) {

    <script>
        (function init120fpsMotion() {
            const bar = document.getElementById('qp-scroll-bar');
            const topBtn = document.getElementById('qp-top-btn');
            const topRing = document.getElementById('qp-top-ring');
            const ringLen = 113.1;
            let scrollRaf = 0;
            const updateScrollBar = () => {
                scrollRaf = 0;
                const doc = document.documentElement;
                const y = window.scrollY || doc.scrollTop || 0;
                const max = Math.max(0, doc.scrollHeight - window.innerHeight);
                const ratio = max > 0 ? Math.min(1, Math.max(0, y / max)) : 0;
                if (bar) {
                    bar.style.transform = 'translate3d(0, 0, 0) scaleX(' + ratio.toFixed(4) + ')';
                }
                if (topBtn) {
                    const hideForQuizNav = !!document.querySelector('.qp-active-quiz-nav');
                    topBtn.classList.toggle('is-visible', y > 280 && !hideForQuizNav);
                    if (topRing) {
                        topRing.style.strokeDashoffset = (ringLen * (1 - ratio)).toFixed(2);
                    }
                }
            };
            const onScrollOrResize = () => {
                if (!scrollRaf) scrollRaf = requestAnimationFrame(updateScrollBar);
            };
            window.addEventListener('scroll', onScrollOrResize, { passive: true });
            window.addEventListener('resize', onScrollOrResize, { passive: true });
            updateScrollBar();

            const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (!reducedMotion) {
                function mountHeroCanvas(canvas) {
                    if (!canvas || canvas.dataset.qpBound) return;
                    canvas.dataset.qpBound = '1';
                    const ctx = canvas.getContext('2d');
                    if (!ctx) return;
                    const host = canvas.closest('[data-qp-hero]') || canvas.parentElement;
                    let width = 0, height = 0, dpr = 1;
                    let mouseX = -9999, mouseY = -9999;
                    let visible = true, running = false, rafId = 0, lastTs = 0;
                    const nodes = [];
                    const palette = ['rgba(52,211,153,', 'rgba(45,212,191,', 'rgba(34,211,238,', 'rgba(167,243,208,'];

                    function resetSize() {
                        if (!host || !canvas.isConnected) return;
                        const rect = host.getBoundingClientRect();
                        width = Math.max(1, rect.width);
                        height = Math.max(1, rect.height);
                        dpr = Math.min(window.devicePixelRatio || 1, 2);
                        canvas.width = Math.floor(width * dpr);
                        canvas.height = Math.floor(height * dpr);
                        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                        const targetCount = width < 640 ? 18 : 28;
                        while (nodes.length < targetCount) {
                            nodes.push({
                                x: Math.random() * width,
                                y: Math.random() * height,
                                vx: (Math.random() - 0.5) * 26,
                                vy: (Math.random() - 0.5) * 22,
                                r: 1.2 + Math.random() * 1.6,
                                c: palette[nodes.length % palette.length]
                            });
                        }
                        if (nodes.length > targetCount) nodes.length = targetCount;
                    }

                    if (host) {
                        host.addEventListener('pointermove', (e) => {
                            if (e.pointerType === 'touch') return;
                            const rect = host.getBoundingClientRect();
                            mouseX = e.clientX - rect.left;
                            mouseY = e.clientY - rect.top;
                        }, { passive: true });
                        host.addEventListener('pointerleave', () => {
                            mouseX = -9999;
                            mouseY = -9999;
                        }, { passive: true });
                    }

                    function tick(now) {
                        if (!canvas.isConnected || !visible || document.hidden) {
                            running = false;
                            return;
                        }
                        const dt = Math.min((now - lastTs) / 1000, 0.05);
                        lastTs = now;
                        ctx.clearRect(0, 0, width, height);

                        for (let i = 0; i < nodes.length; i++) {
                            const a = nodes[i];
                            a.x += a.vx * dt;
                            a.y += a.vy * dt;
                            if (a.x < 0) { a.x = 0; a.vx *= -1; }
                            else if (a.x > width) { a.x = width; a.vx *= -1; }
                            if (a.y < 0) { a.y = 0; a.vy *= -1; }
                            else if (a.y > height) { a.y = height; a.vy *= -1; }

                            if (mouseX > -500) {
                                const mdx = mouseX - a.x;
                                const mdy = mouseY - a.y;
                                const md2 = mdx * mdx + mdy * mdy;
                                if (md2 < 19600 && md2 > 4) {
                                    const dist = Math.sqrt(md2);
                                    ctx.strokeStyle = 'rgba(52, 211, 153, ' + ((1 - dist / 140) * 0.28).toFixed(3) + ')';
                                    ctx.lineWidth = 0.85;
                                    ctx.beginPath();
                                    ctx.moveTo(a.x, a.y);
                                    ctx.lineTo(mouseX, mouseY);
                                    ctx.stroke();
                                }
                            }

                            for (let j = i + 1; j < nodes.length; j++) {
                                const b = nodes[j];
                                const dx = b.x - a.x;
                                const dy = b.y - a.y;
                                const d2 = dx * dx + dy * dy;
                                if (d2 < 12100) {
                                    const dist = Math.sqrt(d2);
                                    ctx.strokeStyle = 'rgba(45, 212, 191, ' + ((1 - dist / 110) * 0.16).toFixed(3) + ')';
                                    ctx.lineWidth = 0.7;
                                    ctx.beginPath();
                                    ctx.moveTo(a.x, a.y);
                                    ctx.lineTo(b.x, b.y);
                                    ctx.stroke();
                                }
                            }

                            ctx.fillStyle = a.c + '0.68)';
                            ctx.beginPath();
                            ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        rafId = requestAnimationFrame(tick);
                    }

                    function ensureRun() {
                        if (running || !visible || document.hidden || !canvas.isConnected) return;
                        running = true;
                        lastTs = performance.now();
                        rafId = requestAnimationFrame(tick);
                    }

                    resetSize();
                    const onResize = () => {
                        if (!canvas.isConnected) { window.removeEventListener('resize', onResize); return; }
                        resetSize();
                    };
                    window.addEventListener('resize', onResize, { passive: true });
                    document.addEventListener('visibilitychange', () => {
                        if (!canvas.isConnected) return;
                        if (!document.hidden) ensureRun();
                    });
                    if (typeof IntersectionObserver !== 'undefined') {
                        const io = new IntersectionObserver((entries) => {
                            if (!canvas.isConnected) { io.disconnect(); return; }
                            visible = entries[0] ? entries[0].isIntersecting : true;
                            if (visible) ensureRun();
                            else if (rafId) { cancelAnimationFrame(rafId); running = false; }
                        }, { threshold: 0.01 });
                        io.observe(canvas);
                    }
                    ensureRun();
                }

                function runCountups() {
                    document.querySelectorAll('[data-qp-countup]:not([data-qp-counted])').forEach((el) => {
                        el.dataset.qpCounted = '1';
                        const targetVal = Number(el.getAttribute('data-qp-countup'));
                        const suffix = el.getAttribute('data-qp-suffix') || '';
                        if (!Number.isFinite(targetVal) || targetVal <= 0) {
                            el.textContent = (Number.isFinite(targetVal) ? targetVal : 0) + suffix;
                            return;
                        }
                        const start = performance.now();
                        const duration = 420;
                        function step(now) {
                            if (!el.isConnected) return;
                            const t = Math.min(1, (now - start) / duration);
                            const eased = 1 - Math.pow(1 - t, 3);
                            el.textContent = Math.round(targetVal * eased) + suffix;
                            if (t < 1) requestAnimationFrame(step);
                        }
                        requestAnimationFrame(step);
                    });
                }

                function bindDynamicEffects() {
                    document.querySelectorAll('.qp-hero-canvas:not([data-qp-bound])').forEach(mountHeroCanvas);
                    runCountups();
                    onScrollOrResize();
                }

                const rootEl = document.getElementById('root');
                if (rootEl && typeof MutationObserver !== 'undefined') {
                    let domRaf = 0;
                    const mo = new MutationObserver(() => {
                        if (!domRaf) {
                            domRaf = requestAnimationFrame(() => {
                                domRaf = 0;
                                bindDynamicEffects();
                            });
                        }
                    });
                    mo.observe(rootEl, { childList: true });
                }
                bindDynamicEffects();

                let spotTarget = null, tiltTarget = null, ptrX = 0, ptrY = 0, ptrRaf = 0;
                function resetTilt(el) {
                    if (!el) return;
                    el.classList.remove('qp-tilting');
                    el.style.transform = '';
                }
                function applyPointerMotion() {
                    ptrRaf = 0;
                    if (spotTarget) {
                        const rect = spotTarget.getBoundingClientRect();
                        if (rect.width > 0 && rect.height > 0) {
                            spotTarget.style.setProperty('--mx', (ptrX - rect.left).toFixed(1) + 'px');
                            spotTarget.style.setProperty('--my', (ptrY - rect.top).toFixed(1) + 'px');
                        }
                    }
                    if (tiltTarget) {
                        const rect = tiltTarget.getBoundingClientRect();
                        if (rect.width > 0 && rect.height > 0) {
                            const nx = Math.max(-1, Math.min(1, ((ptrX - rect.left) / rect.width) * 2 - 1));
                            const ny = Math.max(-1, Math.min(1, ((ptrY - rect.top) / rect.height) * 2 - 1));
                            const rotY = (nx * 3.0).toFixed(2);
                            const rotX = (-ny * 3.0).toFixed(2);
                            tiltTarget.classList.add('qp-tilting');
                            tiltTarget.style.transform = 'perspective(900px) rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg) translate3d(0, -4px, 0)';
                        }
                    }
                }
                document.addEventListener('pointermove', (e) => {
                    if (e.pointerType === 'touch') return;
                    const spot = e.target && e.target.closest ? e.target.closest('.qp-spotlight') : null;
                    const tilt = e.target && e.target.closest ? e.target.closest('.qp-tilt') : null;
                    if (tiltTarget && tiltTarget !== tilt) resetTilt(tiltTarget);
                    spotTarget = spot;
                    tiltTarget = tilt;
                    if (!spot && !tilt) return;
                    ptrX = e.clientX;
                    ptrY = e.clientY;
                    if (!ptrRaf) ptrRaf = requestAnimationFrame(applyPointerMotion);
                }, { passive: true });

                document.addEventListener('pointerleave', () => {
                    if (tiltTarget) { resetTilt(tiltTarget); tiltTarget = null; }
                    spotTarget = null;
                }, { passive: true });
                window.addEventListener('blur', () => {
                    if (tiltTarget) { resetTilt(tiltTarget); tiltTarget = null; }
                    spotTarget = null;
                });

                document.addEventListener('pointerdown', (e) => {
                    if (tiltTarget) { resetTilt(tiltTarget); tiltTarget = null; }
                    const btn = e.target && e.target.closest ? e.target.closest('button, a') : null;
                    if (!btn || btn.disabled || btn.hasAttribute('data-no-ripple')) return;
                    if (btn.closest('#essay-content-wrapper .highlightable-content')) return;
                    const rect = btn.getBoundingClientRect();
                    if (rect.width < 28 || rect.height < 22) return;
                    const cs = window.getComputedStyle(btn);
                    if (cs.position === 'static') btn.style.position = 'relative';
                    if (cs.overflow !== 'hidden') btn.style.overflow = 'hidden';
                    const size = Math.max(rect.width, rect.height) * 1.45;
                    const ripple = document.createElement('span');
                    ripple.className = 'qp-ripple';
                    ripple.style.width = size + 'px';
                    ripple.style.height = size + 'px';
                    ripple.style.left = (e.clientX - rect.left) + 'px';
                    ripple.style.top = (e.clientY - rect.top) + 'px';
                    btn.appendChild(ripple);
                    const cleanup = () => { if (ripple.parentNode) ripple.remove(); };
                    ripple.addEventListener('animationend', cleanup, { once: true });
                    setTimeout(cleanup, 460);
                }, { passive: true });
            }
        })();

        window.launchResultCelebration = function launchResultCelebration() {
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const total = (typeof state !== 'undefined' && state.questions) ? state.questions.length : 0;
            const score = (typeof state !== 'undefined' && typeof state.score === 'number') ? state.score : 0;
            if (total <= 0 || (score / total) < 0.6) return;

            const oldCanvas = document.getElementById('qp-confetti-canvas');
            if (oldCanvas) oldCanvas.remove();

            const canvas = document.createElement('canvas');
            canvas.id = 'qp-confetti-canvas';
            canvas.className = 'fixed inset-0 pointer-events-none z-[99998]';
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const w = window.innerWidth;
            const h = window.innerHeight;
            canvas.width = Math.floor(w * dpr);
            canvas.height = Math.floor(h * dpr);
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            document.body.appendChild(canvas);

            const ctx = canvas.getContext('2d');
            if (!ctx) { canvas.remove(); return; }
            ctx.scale(dpr, dpr);

            const colors = ['#10b981', '#14b8a6', '#06b6d4', '#f59e0b', '#34d399', '#e2e8f0'];
            const count = w < 640 ? 48 : 72;
            const pieces = [];
            for (let i = 0; i < count; i++) {
                const fromLeft = i % 2 === 0;
                const startX = fromLeft ? w * (0.12 + Math.random() * 0.18) : w * (0.70 + Math.random() * 0.18);
                const angle = fromLeft ? (-Math.PI / 2 + 0.18 + Math.random() * 0.55) : (-Math.PI / 2 - 0.18 - Math.random() * 0.55);
                const speed = 420 + Math.random() * 460;
                pieces.push({
                    x: startX,
                    y: h * (0.58 + Math.random() * 0.15),
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    w: 6 + Math.random() * 5,
                    h: 4 + Math.random() * 4,
                    rot: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 11,
                    color: colors[i % colors.length]
                });
            }

            let lastTime = performance.now();
            const startTime = lastTime;
            const durationMs = 2300;
            const gravity = 1150;

            function tick(now) {
                const elapsed = now - startTime;
                if (elapsed >= durationMs || !canvas.isConnected) {
                    canvas.remove();
                    return;
                }
                const dt = Math.min((now - lastTime) / 1000, 0.05);
                lastTime = now;
                ctx.clearRect(0, 0, w, h);

                const alpha = elapsed > 1600 ? Math.max(0, 1 - (elapsed - 1600) / (durationMs - 1600)) : 1;
                ctx.globalAlpha = alpha;

                for (let i = 0; i < pieces.length; i++) {
                    const p = pieces[i];
                    p.vy += gravity * dt;
                    p.vx *= Math.pow(0.55, dt);
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.rot += p.vRot * dt;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    ctx.restore();
                }
                requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        };
    </script>

</body>
