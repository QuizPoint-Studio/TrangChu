    <style>

            animation: pulse-harmonic 5s ease-in-out infinite;

        /* Cho phép bôi đen văn bản để học viên dùng bút dạ quang highlight dễ dàng */

<body class="bg-gradient-to-br from-[#f0fdf4] via-[#e0f2fe] to-slate-50 dark:from-slate-950 dark:via-slate-900 dark:to-emerald-950 min-h-screen text-slate-800 dark:text-slate-100 overflow-x-hidden w-full max-w-full">
    <div id="root"></div>

    <script>

        // 1. Toast thông báo cảnh báo bảo mật
        function showAntiCheatToast(msg) {
            let t = document.getElementById('anti-cheat-toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'anti-cheat-toast';
                t.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 z-[999999] px-4 py-2.5 rounded-xl bg-slate-900/95 dark:bg-white/95 text-white dark:text-slate-900 text-xs font-bold shadow-2xl backdrop-blur-md border border-amber-500/40 flex items-center gap-2 pointer-events-none transition-all duration-300 opacity-0 translate-y-3';
                document.body.appendChild(t);
            }
            t.innerHTML = '<span class="text-amber-400 dark:text-amber-600 text-base">🛡️</span> <span>' + escapeHTML(msg) + '</span>';
            t.classList.remove('opacity-0', 'translate-y-3');
            clearTimeout(t._hideTimeout);
            t._hideTimeout = setTimeout(() => {
                t.classList.add('opacity-0', 'translate-y-3');
            }, 2500);
        }

        // 3. Lớp chặn sao chép, cắt và bôi đen văn bản
        document.addEventListener('contextmenu', function(e) {
            if (e.target.closest('input, textarea')) return;
            e.preventDefault();
            showAntiCheatToast("Thao tác chuột phải đã bị khóa để bảo vệ bản quyền đề thi!");
            return false;
        });

        document.addEventListener('copy', function(e) {
            if (e.target.closest('input, textarea')) return;
            e.preventDefault();
            if (e.clipboardData) {
                e.clipboardData.setData('text/plain', 'Nội dung đề thi được bảo vệ bản quyền bởi QuizPoint Studio.');
            }
            showAntiCheatToast("Tính năng sao chép nội dung đã bị vô hiệu hóa!");
            return false;
        });

        document.addEventListener('cut', function(e) {
            if (e.target.closest('input, textarea')) return;
            e.preventDefault();
            return false;
        });

        // Đã mở cho phép bôi đen văn bản để sử dụng bút dạ quang highlight
        document.addEventListener('selectstart', function(e) {
            // Cho phép bôi đen để highlight
            return true;
        });

        document.addEventListener('dragstart', function(e) {
            e.preventDefault();
            return false;
        });

        // 4. Lớp chặn phím tắt nguy hiểm (Inspect, View Source, Print, Save, Copy All)
        document.addEventListener('keydown', function(e) {
            const isCtrlOrMeta = e.ctrlKey || e.metaKey;
            const key = e.key ? e.key.toLowerCase() : '';

            // F12 (Developer Tools)
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                e.stopPropagation();
                showAntiCheatToast("Phím chức năng F12 đã bị vô hiệu hóa!");
                return false;
            }

            // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C (Inspect/Console)
            if (isCtrlOrMeta && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) {
                e.preventDefault();
                e.stopPropagation();
                showAntiCheatToast("Công cụ kiểm tra (Inspect) đã bị vô hiệu hóa!");
                return false;
            }

            // Ctrl+U (Xem mã nguồn HTML)
            if (isCtrlOrMeta && key === 'u') {
                e.preventDefault();
                e.stopPropagation();
                showAntiCheatToast("Xem mã nguồn trang đã bị vô hiệu hóa!");
                return false;
            }

            // Ctrl+S (Lưu trang web)
            if (isCtrlOrMeta && key === 's') {
                e.preventDefault();
                e.stopPropagation();
                showAntiCheatToast("Lưu trang web đã bị khóa!");
                return false;
            }

            // Ctrl+P (In đề / Xuất PDF)
            if (isCtrlOrMeta && key === 'p') {
                e.preventDefault();
                e.stopPropagation();
                showAntiCheatToast("In ấn / Xuất PDF đề thi đã bị khóa!");
                return false;
            }

            // Ctrl+C / Ctrl+A / Ctrl+X khi không phải trong ô input
            if (isCtrlOrMeta && (key === 'c' || key === 'a' || key === 'x')) {
                if (!e.target.closest('input, textarea')) {
                    e.preventDefault();
                    e.stopPropagation();
                    showAntiCheatToast("Phím tắt sao chép/chọn tất cả đã bị khóa!");
                    return false;
                }
            }
        });

        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        const firebaseConfig = {
          apiKey: "AIzaSyC-n88rPoijqfE44ZF3ulPZdcGz_rtC3lg",
          authDomain: "quizpointstuidio.firebaseapp.com",
          databaseURL: "https://quizpointstuidio-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "quizpointstuidio",
          storageBucket: "quizpointstuidio.firebasestorage.app",
          messagingSenderId: "592248583165",
          appId: "1:592248583165:web:8f7dac2ab36dbf35aadf94",
          measurementId: "G-T8QQ1HEZGC"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const ADMIN_EMAIL = "ngocyen@cucdang.com";

        const urlParams = new URLSearchParams(window.location.search);
        let rawCode = (urlParams.get('code') || urlParams.get('subject') || '').trim();
        const SUBJECT_KEY = rawCode ? rawCode.toUpperCase() : "";
        let initialName = urlParams.get('name') ? decodeURIComponent(urlParams.get('name')) : "";
        let initialPart = (urlParams.get('part') || '').trim();
        let initialMode = (urlParams.get('mode') || '').trim().toLowerCase();

        let TEST_DATA = {};
        let SUBJECT_INFO = { 
            name: initialName || (SUBJECT_KEY ? `${SUBJECT_KEY}` : "Chọn môn học ôn tập"), 
            subTitle: "Hệ thống ngân hàng câu hỏi ôn tập trực tuyến" 
        };

        function cleanSubjectTitle(rawName, code) {
            if (!rawName) return '';
            let s = String(rawName).trim();
            s = s.replace(/^(môn|mon|mã\s*môn|ma\s*mon)\s*[:：\-]\s*/i, '');
            s = s.replace(/^(yêu\s*cầu\s*[\w\d]+|yeu\s*cau\s*[\w\d]+)\s*[:：\-]\s*/i, '');
            if (code) {
                const escapedCode = String(code).replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&');
                s = s.replace(new RegExp('^' + escapedCode + '\\s*[:：\\-]\\s*', 'i'), '');
            }
            s = s.replace(/^([A-Z0-9_\-\s]{2,15})\s*[:：]\s*/, function(match, prefix) {
                if (/^[A-Z0-9_\-\s]+$/.test(prefix.trim())) {
                    return '';
                }
                return match;
            });
            return s.trim() || rawName;
        }

        function parseSubjectTitle(rawName, code) {
            return {
                badge: '',
                title: cleanSubjectTitle(rawName, code)
            };
        }

        function cleanSubjectName(name) {
            if (!name) return "";
            return name
                .replace(/^(môn|mon)\s*[:：]\s*/i, '')
                .replace(/^(yêu\s*cầu\s*[\w\d]+|yeu\s*cau\s*[\w\d]+)\s*[:：]\s*/i, '')
                .trim();
        }

        const initialDarkMode = document.documentElement.classList.contains('dark') || 
            localStorage.getItem('qp_theme') === 'dark' || 
            (!('qp_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);

        let state = {
            user: null,
            loading: true,
            emailInput: "",
            passwordInput: "",
            authError: "",
            isKicked: false,
            isDarkMode: initialDarkMode,
            currentPart: null,
            currentQuestionIndex: 0,
            score: 0,
            wrongScore: 0,
            showResult: false,
            selectedOptions: [],
            isSubmitted: false,
            questions: [],
            shuffledOptions: [],
            isConfirming: false,
            isConfirmingHome: false,
            sessionAnswers: [],
            reviewMode: false,
            reviewData: [],
            history: [],
            studyMode: (initialMode === 'essay' ? 'essay' : 'quiz'), // 'quiz' (Trắc nghiệm) hoặc 'essay' (Tự luận)
            essayQuestions: [],
            essayRevealed: {},
            essayLearned: {},
            userHighlights: {},
            visitorCount: 1,
            studentOnlineCount: 1,
            essayZoom: parseInt(localStorage.getItem("qp_essay_zoom") || "100")
        };
        let ESSAY_DATA = {};

        if (SUBJECT_KEY) {
            try {
                const saved = localStorage.getItem(`history_${SUBJECT_KEY}`);
                state.history = saved ? JSON.parse(saved) : [];
            } catch (e) { state.history = []; }
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function getQuestionsArray(data) {
            if (!data) return [];
            if (Array.isArray(data)) return data.filter(Boolean);
            if (typeof data === 'object') {
                const values = Object.values(data).filter(Boolean);
                if (values.length > 0 && values[0] && typeof values[0] === 'object' && values[0].q) {
                    return values;
                }
                let combined = [];
                values.forEach(v => {
                    if (Array.isArray(v)) combined = combined.concat(v.filter(Boolean));
                    else if (v && typeof v === 'object' && v.q) combined.push(v);
                });
                return combined;
            }
            return [];
        }
        
        function toggleDarkMode() {
            state.isDarkMode = !state.isDarkMode;
            if (state.isDarkMode) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('qp_theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('qp_theme', 'light');
            }
            render();
        }

        async function fetchSubjectDetails() {
            if (!SUBJECT_KEY) return;
            try {
                const snap = await db.ref("subjects").once("value");
                const data = snap.val();
                if (data) {
                    for (const cat in data) {
                        const list = Array.isArray(data[cat]) ? data[cat] : Object.values(data[cat] || {});
                        const found = list.find(item => item && item.code && item.code.toUpperCase() === SUBJECT_KEY);
                        if (found) {
                            SUBJECT_INFO.name = found.name;
                            return;
                        }
                    }
                }
            } catch(e) {}
        }

        let userSessionListener = null;
        let adminSessionListener = null;

        auth.onAuthStateChanged(async (currentUser) => {
            if (userSessionListener) {
                userSessionListener.off();
                userSessionListener = null;
            }
            if (adminSessionListener) {
                adminSessionListener.off();
                adminSessionListener = null;
            }

            try {
                await fetchSubjectDetails();

                if (currentUser) {
                    const userEmail = (currentUser.email || "").toLowerCase().trim();
                    const isAdmin = (userEmail === ADMIN_EMAIL.toLowerCase());
                    const userRef = db.ref(`users/${currentUser.uid}`);
                    
                    // Kiểm soát phiên thiết bị
                    if (!isAdmin) {
                        userSessionListener = userRef.child("currentSessionId");
                        userSessionListener.on("value", (snap) => {
                            const cloudSession = snap.val();
                            const localSession = localStorage.getItem("qp_active_session");
                            if (cloudSession && localSession && cloudSession !== localSession) {
                                state.isKicked = true;
                                auth.signOut();
                                state.user = null;
                                render();
                            }
                        });
                    } else {
                        let adminSessionId = localStorage.getItem("qp_admin_session_id");
                        if (!adminSessionId) {
                            adminSessionId = "adm_" + Date.now().toString(36) + "_" + Math.random().toString(36).substring(2, 7);
                            localStorage.setItem("qp_admin_session_id", adminSessionId);
                        }
                        const ua = navigator.userAgent || "";
                        let os = "Máy tính";
                        let icon = "💻";
                        let devType = "desktop";
                        if (/iPad|iPhone|iPod/.test(ua)) { os = /iPad/.test(ua) ? "iPad" : "iPhone"; icon = "📱"; devType = "mobile"; }
                        else if (/Android/.test(ua)) { os = /Mobile/.test(ua) ? "Điện thoại Android" : "Tablet Android"; icon = "📱"; devType = "mobile"; }
                        else if (/Windows/.test(ua)) { os = "Windows PC"; icon = "💻"; }
                        else if (/Macintosh/.test(ua)) { os = "macOS"; icon = "💻"; }

                        let browser = "Browser";
                        if (/Edg\//.test(ua)) browser = "Edge";
                        else if (/Chrome\//.test(ua)) browser = "Chrome";
                        else if (/Safari\//.test(ua)) browser = "Safari";
                        else if (/Firefox\//.test(ua)) browser = "Firefox";

                        const mySessionRef = userRef.child("activeSessions/" + adminSessionId);
                        let isRegistered = false;
                        mySessionRef.update({
                            id: adminSessionId,
                            name: `${os} (${browser})`,
                            icon: icon,
                            os: os,
                            browser: browser,
                            deviceType: devType,
                            userAgent: ua.substring(0, 150),
                            lastActive: Date.now()
                        }).then(() => {
                            isRegistered = true;
                        }).catch(() => {});

                        adminSessionListener = mySessionRef;
                        adminSessionListener.on("value", (snap) => {
                            if (isRegistered && !snap.exists()) {
                                localStorage.removeItem("qp_admin_session_id");
                                state.isKicked = true;
                                auth.signOut();
                                state.user = null;
                                render();
                            }
                        });
                    }

                    if (!isAdmin && SUBJECT_KEY) {
                        try {
                            const permSnap = await userRef.child(`allowedSubjects/${SUBJECT_KEY}`).once("value");
                            if (permSnap.val() !== true) {
                                state.authError = `Tài khoản chưa được cấp quyền truy cập [${SUBJECT_KEY}]!`;
                                auth.signOut();
                                state.user = null;
                                state.loading = false;
                                render();
                                return;
                            }
                        } catch(e) {}
                    }

                    if (SUBJECT_KEY) {
                        try {
                            let snap = await db.ref(`quiz_questions/${SUBJECT_KEY}`).once("value");
                            let data = snap.val();

                            if (!data) {
                                snap = await db.ref(`mon_hoc/${SUBJECT_KEY.toLowerCase()}`).once("value");
                                const oldData = snap.val();
                                if (oldData) {
                                    data = oldData.parts || oldData;
                                    if (oldData.name) SUBJECT_INFO.name = oldData.name;
                                }
                            }

                            if (data) {
                                if (data._title) SUBJECT_INFO.name = data._title;
                                TEST_DATA = data;
                            } else {
                                TEST_DATA = {};
                            }
                        } catch(e) {
                            console.error("Lỗi nạp đề thi:", e);
                        }

                        // Tải tài liệu tự luận (Từ cả quiz_questions và essay_questions)
                        ESSAY_DATA = {};
                        if (TEST_DATA && typeof TEST_DATA === 'object') {
                            if (TEST_DATA._essay && typeof TEST_DATA._essay === 'object') {
                                Object.assign(ESSAY_DATA, TEST_DATA._essay);
                            }
                            for (const k in TEST_DATA) {
                                if (k.startsWith('essay_')) {
                                    const p = k.replace('essay_', '');
                                    ESSAY_DATA[p] = TEST_DATA[k];
                                }
                            }
                        }
                        try {
                            let eSnap = await db.ref("essay_questions/" + SUBJECT_KEY).once("value");
                            if (eSnap && eSnap.exists()) {
                                Object.assign(ESSAY_DATA, eSnap.val() || {});
                            }
                        } catch(e) {}

                        // Tải bút dạ quang highlights đã lưu (Kết hợp cả LocalStorage & Firebase để không bao giờ mất)
                        let localHl = {};
                        try {
                            localHl = JSON.parse(localStorage.getItem("qp_highlights_" + currentUser.uid + "_" + SUBJECT_KEY) || "{}");
                        } catch(e) {}
                        state.userHighlights = { ...localHl };

                        try {
                            let hlSnap = await db.ref("users/" + currentUser.uid + "/highlights/" + SUBJECT_KEY).once("value");
                            if (hlSnap.exists()) {
                                state.userHighlights = { ...localHl, ...(hlSnap.val() || {}) };
                                try {
                                    localStorage.setItem("qp_highlights_" + currentUser.uid + "_" + SUBJECT_KEY, JSON.stringify(state.userHighlights));
                                } catch(e) {}
                            }
                        } catch(e) {}

                        // Tải lịch sử bài làm trắc nghiệm từ Firebase
                        try {
                            let hSnap = await db.ref("users/" + currentUser.uid + "/quiz_history/" + SUBJECT_KEY).once("value");
                            if (hSnap.exists()) {
                                const cloudHistory = hSnap.val();
                                if (Array.isArray(cloudHistory) && cloudHistory.length > 0) {
                                    state.history = cloudHistory;
                                    try { localStorage.setItem("history_" + SUBJECT_KEY, JSON.stringify(state.history)); } catch(e){}
                                }
                            }
                        } catch(e) {}

                        // Tải tiến độ tự luận (Kết hợp LocalStorage & Firebase)
                        let localProg = {};
                        try {
                            localProg = JSON.parse(localStorage.getItem("qp_essay_learned_" + currentUser.uid + "_" + SUBJECT_KEY) || "{}");
                        } catch(e) {}
                        state.essayLearned = { ...localProg };

                        try {
                            let pSnap = await db.ref("users/" + currentUser.uid + "/essay_progress/" + SUBJECT_KEY).once("value");
                            if (pSnap.exists()) {
                                state.essayLearned = { ...localProg, ...(pSnap.val() || {}) };
                                try {
                                    localStorage.setItem("qp_essay_learned_" + currentUser.uid + "_" + SUBJECT_KEY, JSON.stringify(state.essayLearned));
                                } catch(e) {}
                            }
                        } catch(e) {}

                        // Nếu môn học chưa có đề trắc nghiệm nhưng ĐÃ CÓ câu hỏi tự luận -> Tự động mở tab Tự luận
                        const quizPartKeys = Object.keys(TEST_DATA || {}).filter(k => !k.startsWith('_') && !k.startsWith('essay_'));
                        const essayPartKeys = Object.keys(ESSAY_DATA || {}).filter(k => !k.startsWith('_'));
                        if (quizPartKeys.length === 0 && essayPartKeys.length > 0 && !initialMode) {

        function startQuiz(part) {
            let raw = getQuestionsArray(TEST_DATA[part]);
            if (raw.length === 0 && !isNaN(part)) {
                raw = getQuestionsArray(TEST_DATA[Number(part)]);
            }

            if (raw.length === 0) {
                alert("Bộ đề này hiện đang được cập nhật câu hỏi!");
                return;
            }

            state.questions = raw.map((item, idx) => {
                const ALL_OPT_KEYS = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l'];
                const options = ALL_OPT_KEYS
                    .filter(k => item[k] !== undefined && item[k] !== null && String(item[k]).trim() !== "")
                    .map(k => ({ key: k, text: item[k] }));

                const cleanAns = (item.ans || "a").toString().toLowerCase().replace(/[^a-z]/g, '').split('').sort().join('');

                return {
                    id: item.id || (idx + 1),
                    q: item.q,
                    correct: cleanAns || "a",
                    isMultiple: (cleanAns.length > 1),
                    options: options
                };
            });

            state.currentPart = part; 
            state.currentQuestionIndex = 0; 
            state.score = 0; 
            state.wrongScore = 0;
            state.sessionAnswers = []; 
            state.showResult = false; 
            state.selectedOptions = []; 
            state.isSubmitted = false;

            if (state.questions.length > 0) {
                state.shuffledOptions = shuffleArray(state.questions[0].options);
            }
            render();
        }

        function handleOptionSelect(key, isMultiple) {
            if (state.isSubmitted) return;
            if (isMultiple) {
                if (state.selectedOptions.includes(key)) {
                    state.selectedOptions = state.selectedOptions.filter(k => k !== key);
                } else {
                    state.selectedOptions.push(key);
                }
            } else {
                state.selectedOptions = [key];
            }
            render();
        }

        function checkAnswerSubmission() {
            if (state.selectedOptions.length === 0 || state.isSubmitted) return;
            const currentQ = state.questions[state.currentQuestionIndex];
            const userAnsStr = [...state.selectedOptions].sort().join('');
            const correctAnsStr = currentQ.correct.split('').sort().join('');
            const correct = userAnsStr === correctAnsStr;
            
            state.isSubmitted = true;
            if (correct) state.score++; else state.wrongScore++;
            state.sessionAnswers.push({ ...currentQ, userSelected: userAnsStr, options: state.shuffledOptions });
            render();
        }

        function nextQuestion() {
            if (state.currentQuestionIndex < state.questions.length - 1) {
                state.currentQuestionIndex++;
                const newQ = state.questions[state.currentQuestionIndex];
                const existing = state.sessionAnswers.find(a => a.id === newQ.id);
                if (existing) {
                    state.shuffledOptions = existing.options;
                    state.selectedOptions = existing.userSelected.split('');
                    state.isSubmitted = true;
                } else {
                    state.shuffledOptions = shuffleArray(newQ.options); 
                    state.selectedOptions = []; 
                    state.isSubmitted = false;
                }
                render();
            } else {
                state.showResult = true;
                saveHistoryToLocal();
                render();
            }
        }

        function prevQuestion() {
            if (state.currentQuestionIndex > 0) {
                state.currentQuestionIndex--;
                const newQ = state.questions[state.currentQuestionIndex];
                const existing = state.sessionAnswers.find(a => a.id === newQ.id);
                if (existing) {
                    state.shuffledOptions = existing.options;
                    state.selectedOptions = existing.userSelected.split('');
                    state.isSubmitted = true;
                } else {
                    state.shuffledOptions = shuffleArray(newQ.options);
                    state.selectedOptions = [];
                    state.isSubmitted = false;
                }
                render();
            }
        }

        function saveHistoryToLocal() {
            const answeredIds = state.sessionAnswers.map(a => a.id);
            const unansweredCount = state.questions.filter(q => !answeredIds.includes(q.id)).length;
            const actualWrong = state.wrongScore + unansweredCount;

            const record = {
                id: Date.now(), 
                date: new Date().toLocaleString('vi-VN'), 
                part: state.currentPart,
                score: state.score, 
                wrong: actualWrong, 
                total: state.questions.length,
                details: state.sessionAnswers.map(q => ({ id: q.id, q: q.q, o: q.options || [], s: q.userSelected, c: q.correct }))
            };
            state.history.unshift(record);
            if (state.history.length > 50) {
                state.history = state.history.slice(0, 50); // Giới hạn 50 bài thi gần nhất
            }
            if (SUBJECT_KEY) {
                try { localStorage.setItem(`history_${SUBJECT_KEY}`, JSON.stringify(state.history)); } catch (e) {}
            }
            // Đồng bộ lịch sử bài làm lên Firebase để đổi thiết bị không bị mất
            if (state.user && state.user.uid && SUBJECT_KEY) {
                try {
                    db.ref("users/" + state.user.uid + "/quiz_history/" + SUBJECT_KEY).set(state.history);
                } catch(e) {
                    console.error("Lỗi đồng bộ lịch sử bài làm:", e);
                }
            }
        }

        // =========================================================================
        // BỘ ĐẾM TRUY CẬP REALTIME SỐNG ĐỘNG (REALTIME PRESENCE & LIVE ACTIVITY ENGINE)
        // Tự động nhảy số khi có người ra vào, đồng bộ giữa các tab và thiết bị
        // =========================================================================
        // BỘ ĐẾM TRUY CẬP THỰC TẾ (REAL VISITOR TRACKER - ĐẾM THEO SỐ TAB/NGƯỜI TRUY CẬP THỰC)
        // =========================================================================
        (function() {
            const TAB_ID = "tab_" + Date.now().toString(36) + "_" + Math.random().toString(36).substring(2, 7);
            const STORAGE_TABS_KEY = "qp_real_active_tabs";
            const CHANNEL_NAME = "qp_real_presence_stream";
            
            let broadcastChannel = null;
            try {
                if (typeof BroadcastChannel !== 'undefined') {
                    broadcastChannel = new BroadcastChannel(CHANNEL_NAME);
                }
            } catch(e) {}

            function getActiveVisitorCount() {
                try {
                    let tabs = JSON.parse(localStorage.getItem(STORAGE_TABS_KEY) || "{}");
                    const now = Date.now();
                    let count = 0;
                    for (const id in tabs) {
                        if (now - tabs[id] < 10000) {
                            count++;
                        } else {
                            delete tabs[id];
                        }
                    }
                    localStorage.setItem(STORAGE_TABS_KEY, JSON.stringify(tabs));
                    return Math.max(1, count);
                } catch(e) {
                    return 1;
                }
            }

            function heartbeat() {
                try {
                    let tabs = {};
                    try { tabs = JSON.parse(localStorage.getItem(STORAGE_TABS_KEY) || "{}"); } catch(e){}
                    tabs[TAB_ID] = Date.now();
                    const now = Date.now();
                    for (const id in tabs) {
                        if (now - tabs[id] >= 10000) delete tabs[id];
                    }
                    localStorage.setItem(STORAGE_TABS_KEY, JSON.stringify(tabs));
                } catch(e) {}
                renderCount();
                if (broadcastChannel) {
                    try { broadcastChannel.postMessage({ type: 'PING' }); } catch(e){}
                }
            }

            function unregister() {
                try {
                    let tabs = {};
                    try { tabs = JSON.parse(localStorage.getItem(STORAGE_TABS_KEY) || "{}"); } catch(e){}
                    delete tabs[TAB_ID];
                    localStorage.setItem(STORAGE_TABS_KEY, JSON.stringify(tabs));
                } catch(e) {}
                if (broadcastChannel) {
                    try { broadcastChannel.postMessage({ type: 'LEAVE' }); } catch(e){}
                }
            }

            function renderCount() {
                const count = getActiveVisitorCount();
                if (typeof state !== 'undefined') {
                    state.visitorCount = count;
                }
                const el = document.getElementById("presence-visitors-count");
                if (el) el.textContent = count;
            }

            window.renderAllPresence = renderCount;

            if (broadcastChannel) {
                broadcastChannel.onmessage = function() {
                    renderCount();
                };
            }

            window.addEventListener('storage', (e) => {
                if (e.key === STORAGE_TABS_KEY) {
                    renderCount();
                }
            });

            heartbeat();
            setInterval(heartbeat, 4000);

            window.addEventListener('beforeunload', unregister);
            document.addEventListener('DOMContentLoaded', () => { renderCount(); initHighlighterListeners(); });
            setTimeout(renderCount, 200);
        })();

        function initHighlighterListeners() {
            if (window._qpHighlighterInitDone) return;
            window._qpHighlighterInitDone = true;

            let selectionTimeout = null;
            let isPointerDownInContent = false;

            function checkAndShowToolbar() {
                // CHỈ hoạt động trong chế độ Tự luận (essay) và khi đang ở trang danh sách tự luận (!state.currentPart)
                if (state.studyMode !== 'essay' || state.currentPart) {
                    hideHighlighterToolbar();
                    return;
                }

                const sel = window.getSelection();
                if (!sel || sel.isCollapsed) {
                    return;
                }

                const rawSelected = sel.toString();
                const text = rawSelected.trim();
                // Yêu cầu chọn ít nhất 2 ký tự thật để tránh hiện thanh công cụ khi vô tình chạm nhẹ
                if (text.length < 2) {
                    hideHighlighterToolbar();
                    return;
                }

                if (sel.rangeCount === 0) return;
                const range = sel.getRangeAt(0);
                const container = range.commonAncestorContainer;
                const parentEl = container.nodeType === 1 ? container : container.parentElement;

                if (!parentEl || parentEl.closest('input, textarea, select, button, #qp-highlighter-toolbar, #custom-confirm-modal')) {
                    return;
                }

                const essayContainer = parentEl.closest('#essay-content-wrapper, .highlightable-content');
                if (!essayContainer) {
                    hideHighlighterToolbar();
                    return;
                }

                currentSelectionRange = range.cloneRange();
                selectedHighlightText = text;

                const tb = document.getElementById('qp-highlighter-toolbar');
                if (!tb) return;

                const rect = range.getBoundingClientRect();
                if (!rect || (rect.width === 0 && rect.height === 0)) return;

                tb.classList.remove('hidden');

                // THIẾT KẾ THÍCH ỨNG TRÊN ĐIỆN THOẠI & MÁY TÍNH:
                // Trên điện thoại (< 640px): Neo dạng thanh Dock gọn gàng ở đáy màn hình, cách lề an toàn,
                // không bao giờ bị tràn ra ngoài màn hình và không đụng menu Copy/Paste mặc định của điện thoại.
                if (window.innerWidth < 640) {
                    tb.style.position = 'fixed';
                    tb.style.bottom = '14px';
                    tb.style.top = 'auto';
                    tb.style.left = '50%';
                    tb.style.transform = 'translateX(-50%)';
                    tb.style.width = 'calc(100vw - 16px)';
                    tb.style.maxWidth = '390px';
                } else {
                    tb.style.position = 'fixed';
                    tb.style.bottom = 'auto';
                    tb.style.width = 'auto';
                    tb.style.maxWidth = 'calc(100vw - 24px)';

                    const midX = (rect.left + rect.right) / 2;
                    const halfTb = Math.min(200, (window.innerWidth - 24) / 2);
                    const safeLeft = Math.max(halfTb + 12, Math.min(window.innerWidth - halfTb - 12, midX));
                    tb.style.left = safeLeft + 'px';

                    if (rect.top < 110) {
                        tb.style.top = Math.min(window.innerHeight - 95, rect.bottom + 10) + 'px';
                        tb.style.transform = 'translate(-50%, 0)';
                    } else {
                        tb.style.top = (rect.top - 10) + 'px';
                        tb.style.transform = 'translate(-50%, -100%)';
                    }
                }
            }

            // Theo dõi thao tác nhấn/thả chuột trên máy tính
            document.addEventListener('mousedown', (e) => {
                const tb = document.getElementById('qp-highlighter-toolbar');
                if (tb && tb.contains(e.target)) return;
                if (e.target.closest('#custom-confirm-modal')) return;
                isPointerDownInContent = true;
            });

            document.addEventListener('mouseup', (e) => {
                const tb = document.getElementById('qp-highlighter-toolbar');
                if (tb && tb.contains(e.target)) return;
                isPointerDownInContent = false;
                clearTimeout(selectionTimeout);
                selectionTimeout = setTimeout(() => {
                    const sel = window.getSelection();
                    if (!sel || sel.isCollapsed || sel.toString().trim().length < 2) {
                        hideHighlighterToolbar();
                    } else {
                        checkAndShowToolbar();
                    }
                }, 120);
            });

            // Theo dõi thao tác chạm và kéo chọn chữ trên điện thoại
            document.addEventListener('touchstart', (e) => {
                const tb = document.getElementById('qp-highlighter-toolbar');
                if (tb && tb.contains(e.target)) return;
                if (e.target.closest('#custom-confirm-modal')) return;
                isPointerDownInContent = true;
            }, { passive: true });

            document.addEventListener('touchend', (e) => {
                const tb = document.getElementById('qp-highlighter-toolbar');
                if (tb && tb.contains(e.target)) return;
                isPointerDownInContent = false;
                clearTimeout(selectionTimeout);
                selectionTimeout = setTimeout(() => {
                    const sel = window.getSelection();
                    if (!sel || sel.isCollapsed || sel.toString().trim().length < 2) {
                        hideHighlighterToolbar();
                    } else {
                        checkAndShowToolbar();
                    }
                }, 220);
            }, { passive: true });

            // Hỗ trợ khi người dùng kéo 2 thanh giọt nước (selection handles) trên điện thoại
            document.addEventListener('selectionchange', () => {
                if (state.studyMode !== 'essay') {
                    hideHighlighterToolbar();
                    return;
                }
                clearTimeout(selectionTimeout);
                selectionTimeout = setTimeout(() => {
                    const sel = window.getSelection();
                    if (!sel || sel.isCollapsed || sel.toString().trim().length < 2) {
                        // Chỉ tự ẩn nếu người dùng không đang bấm vào thanh công cụ
                        if (!isPointerDownInContent) {
                            hideHighlighterToolbar();
                        }
                    } else if (!isPointerDownInContent) {
                        checkAndShowToolbar();
                    }
                }, 260);
            });
        }

                state.userHighlights[hlId] = rec;
                saveHighlightsToStorage();
                try {
                    await db.ref("users/" + state.user.uid + "/highlights/" + SUBJECT_KEY + "/" + hlId).set(rec);
                } catch(e) {}
            }
            showAntiCheatToast("✨ Đã áp dụng định dạng chữ!");
            currentSelectionRange = null;
            selectedHighlightText = "";
            hideHighlighterToolbar();
        };

        // Hộp thoại xác nhận tùy chỉnh giao diện đẹp mắt (thay thế confirm mặc định)
        window.showCustomConfirm = function(title, message, okText = "Đồng ý", cancelText = "Hủy", isDanger = false) {
            return new Promise((resolve) => {
                const modal = document.getElementById("custom-confirm-modal");
                if (!modal) {
                    resolve(window.confirm(message));
                    return;
                }
                const titleEl = document.getElementById("confirm-modal-title");
                const msgEl = document.getElementById("confirm-modal-msg");
                const btnOk = document.getElementById("confirm-btn-ok");
                const btnCancel = document.getElementById("confirm-btn-cancel");

                if (titleEl) titleEl.innerText = title;
                if (msgEl) msgEl.innerText = message;
                if (btnCancel) btnCancel.innerText = cancelText;

                if (btnOk) {
                    btnOk.innerText = okText;
                    if (isDanger) {
                        btnOk.className = "flex-1 py-2.5 rounded-xl bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-600 hover:to-red-700 text-xs font-black text-white shadow-lg shadow-rose-500/25 transition-all active:scale-95";
                    } else {
                        btnOk.className = "flex-1 py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-brand-600 hover:from-emerald-600 hover:to-brand-700 text-xs font-black text-white shadow-lg shadow-brand-500/25 transition-all active:scale-95";
                    }
                }

                modal.classList.remove("hidden");

                const cleanup = () => {
                    modal.classList.add("hidden");
                    btnOk.removeEventListener("click", onOk);
                    btnCancel.removeEventListener("click", onCancel);
                };

                const onOk = () => { cleanup(); resolve(true); };
                const onCancel = () => { cleanup(); resolve(false); };

                btnOk.addEventListener("click", onOk);
                btnCancel.addEventListener("click", onCancel);
            });
        };

        // Bấm trực tiếp vào vết highlight để xóa (hiện hộp thoại đẹp có khung)
        window.handleHighlightClick = async function(hlId, event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }

            const mark = document.querySelector(`.qp-hl-tag[data-hl-id="${hlId}"]`);
            const snippet = mark ? mark.innerText.trim().slice(0, 45) : "";
            const msg = snippet 
                ? `Bạn có muốn gỡ bỏ vết tô màu cho cụm từ: "${snippet}" không?`
                : "Bạn có muốn gỡ bỏ vết dạ quang này khỏi nội dung bài học không?";

            const confirmed = await showCustomConfirm(
                "XÓA VẾT DẠ QUANG",
                msg,
                "🗑️ Xóa vết màu",
                "Giữ lại",
                true
            );

            if (confirmed) {
                await removeHighlightById(hlId, mark);
            }
        };

        // Nút '🧹 Xóa' trên thanh công cụ Floating Toolbar
        window.clearSelectionHighlight = async function(event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            if (state.studyMode !== 'essay') {
                hideHighlighterToolbar();
                return;
            }

            let tagsToRemove = [];

            // 1. Quét tìm các thẻ .qp-hl-tag trong hoặc chứa vùng chọn
            if (currentSelectionRange) {
                const container = currentSelectionRange.commonAncestorContainer;
                const parent = container.nodeType === 1 ? container : container.parentElement;

                const enclosing = parent ? parent.closest('.qp-hl-tag') : null;
                if (enclosing && !tagsToRemove.includes(enclosing)) {
                    tagsToRemove.push(enclosing);
                }

                if (parent && parent.querySelectorAll) {
                    parent.querySelectorAll('.qp-hl-tag').forEach(tag => {
                        try {
                            if (currentSelectionRange.intersectsNode(tag)) {
                                if (!tagsToRemove.includes(tag)) tagsToRemove.push(tag);
                            }
                        } catch(e) {
                            if (!tagsToRemove.includes(tag)) tagsToRemove.push(tag);
                        }
                    });
                }
            }

            // 2. Thử thêm qua window.getSelection nếu có
            const sel = window.getSelection();
            if (sel && sel.rangeCount > 0 && tagsToRemove.length === 0) {
                try {
                    const r = sel.getRangeAt(0);
                    const c = r.commonAncestorContainer;
                    const p = c.nodeType === 1 ? c : c.parentElement;
                    const enc = p ? p.closest('.qp-hl-tag') : null;
                    if (enc && !tagsToRemove.includes(enc)) tagsToRemove.push(enc);
                    if (p && p.querySelectorAll) {
                        p.querySelectorAll('.qp-hl-tag').forEach(tag => {
                            try {
                                if (r.intersectsNode(tag)) {
                                    if (!tagsToRemove.includes(tag)) tagsToRemove.push(tag);
                                }
                            } catch(e) {}
                        });
                    }
                } catch(e) {}
            }

            // 3. Nếu vùng chọn chứa đoạn text trùng với 1 thẻ .qp-hl-tag trên trang
            if (tagsToRemove.length === 0 && selectedHighlightText) {
                const normSel = selectedHighlightText.trim().toLowerCase();
                document.querySelectorAll('#essay-content-wrapper .qp-hl-tag').forEach(tag => {
                    const tagTxt = (tag.innerText || "").trim().toLowerCase();
                    if (tagTxt && (tagTxt.includes(normSel) || normSel.includes(tagTxt))) {
                        if (!tagsToRemove.includes(tag)) tagsToRemove.push(tag);
                    }
                });
            }

            if (tagsToRemove.length === 0) {
                showAntiCheatToast("ℹ️ Hãy bôi đen vào đoạn chữ đã tô màu hoặc bấm trực tiếp vào vết màu để xóa!");
                hideHighlighterToolbar();
                return;
            }

            for (const tag of tagsToRemove) {
                const hlId = tag.dataset.hlId;
                if (hlId) {
                    await removeHighlightById(hlId, tag);
                } else {
                    const parent = tag.parentNode;
                    if (parent) {
                        while (tag.firstChild) parent.insertBefore(tag.firstChild, tag);
                        parent.removeChild(tag);
                    }
                }
            }

            if (sel) sel.removeAllRanges();
            currentSelectionRange = null;
            selectedHighlightText = "";
            hideHighlighterToolbar();
            showAntiCheatToast("🧹 Đã xóa thành công " + tagsToRemove.length + " vết tô màu!");
        };

        // Gỡ bỏ highlight theo ID và đồng bộ lên LocalStorage + Firebase
        async function removeHighlightById(hlId, markElement) {
            if (!markElement && hlId) {
                markElement = document.querySelector(`.qp-hl-tag[data-hl-id="${hlId}"]`);
            }
            if (markElement) {
                const parent = markElement.parentNode;
                if (parent) {
                    while (markElement.firstChild) {
                        parent.insertBefore(markElement.firstChild, markElement);
                    }
                    parent.removeChild(markElement);
                    parent.normalize();
                }
            }
            delete state.userHighlights[hlId];
            saveHighlightsToStorage();
            if (state.user && state.user.uid && SUBJECT_KEY) {
                try {
                    await db.ref("users/" + state.user.uid + "/highlights/" + SUBJECT_KEY + "/" + hlId).remove();
                } catch(e) {}
            }
            showAntiCheatToast("🧹 Đã xóa đánh dấu dạ quang!");
        }

        function restoreSavedHighlights() {
            if (state.studyMode !== 'essay') return;
            if (!state.userHighlights || Object.keys(state.userHighlights).length === 0) return;
            const container = document.getElementById('essay-content-wrapper');
            if (!container) return;

            const hlList = Object.values(state.userHighlights);
            hlList.forEach(hl => {
                if (!hl || !hl.text || hl.text.length < 2) return;
                highlightTextInElement(container, hl);
            });
        }

        function highlightTextInElement(element, hl) {
            const innerHTML = element.innerHTML;
            if (innerHTML.includes('data-hl-id="' + hl.id + '"')) return;

            const searchStr = hl.text;
            const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            let node;
            const nodesToReplace = [];

            while (node = walker.nextNode()) {
                if (node.parentElement && node.parentElement.closest('.qp-hl-tag')) continue;
                if (node.nodeValue && node.nodeValue.includes(searchStr)) {
                    nodesToReplace.push(node);
                }
            }

            nodesToReplace.forEach(textNode => {
                const val = textNode.nodeValue;
                const idx = val.indexOf(searchStr);
                if (idx >= 0) {
                    const before = val.substring(0, idx);
                    const match = val.substring(idx, idx + searchStr.length);
                    const after = val.substring(idx + searchStr.length);

                    const frag = document.createDocumentFragment();
                    if (before) frag.appendChild(document.createTextNode(before));

                    const mark = document.createElement(hl.color ? 'mark' : 'span');
                    mark.className = 'qp-hl-tag';
                    mark.dataset.hlId = hl.id;
                    if (hl.color) {
                        mark.style.backgroundColor = hl.color;
                        mark.style.color = '#0f172a';
                        mark.style.fontWeight = 'bold';
                    }
                    if (hl.textColor) {
                        mark.style.color = hl.textColor;
                        mark.style.fontWeight = 'bold';
                    }
                    if (hl.styleType === 'bold') mark.style.fontWeight = '900';
                    else if (hl.styleType === 'italic') mark.style.fontStyle = 'italic';
                    else if (hl.styleType === 'underline') mark.style.textDecoration = 'underline';
                    else if (hl.styleType === 'uppercase') mark.style.textTransform = 'uppercase';

                    mark.textContent = match;
                    mark.title = "Bấm để xóa đánh dấu / định dạng";
                    mark.onclick = function(e) { handleHighlightClick(hl.id, e); };
                    frag.appendChild(mark);

                    if (after) frag.appendChild(document.createTextNode(after));
                    textNode.parentNode.replaceChild(frag, textNode);
                }
            });
        }

                                            <div class="flex items-center gap-3.5 relative z-10">
                                                <div class="w-5 h-5 flex items-center justify-center border-2 flex-shrink-0 rounded-md transition-colors ${isSelected ? 'border-brand-500 bg-brand-500 text-white' : 'border-slate-300 bg-white dark:bg-slate-900'}">
                                                    ${isSelected ? '<svg class="w-3 h-3 fill-current" viewBox="0 0 20 20"><path d="M0 11l2-2 5 5L18 3l2 2L7 18z"/></svg>' : ''}
                                                </div>
                                                <span class="leading-relaxed">${escapeHTML(option.text)}</span>
                                            </div>
                                            ${state.isSubmitted && isOptCorrect ? '<svg class="text-emerald-600 dark:text-emerald-400 flex-shrink-0 ml-4" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>' : ''}
                                            ${state.isSubmitted && isSelected && !isOptCorrect ? '<svg class="text-rose-600 dark:text-rose-400 flex-shrink-0 ml-4" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>' : ''}
                                        </button>`;
                                }).join('')}
                            </div>
                            
                            ${!state.isSubmitted && state.selectedOptions.length > 0 ? `
                                <div class="mt-6 flex justify-end">
                                    <button onclick="checkAnswerSubmission()" class="px-6 py-3 bg-gradient-to-r from-brand-500 to-emerald-600 text-white font-extrabold rounded-xl text-xs uppercase tracking-wider shadow-md transform active:scale-95 transition-transform">
                                        Xác nhận đáp án
                                    </button>
                                </div>` : ''}
                        </div>
                    </div>

                    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md border-t border-slate-100 dark:border-slate-900 flex justify-center items-center gap-4 z-20">
                        <button onclick="prevQuestion()" ${state.currentQuestionIndex === 0 ? 'disabled' : ''} class="w-12 h-12 rounded-2xl flex items-center justify-center border text-slate-600 dark:text-slate-400 disabled:opacity-25 active:scale-95 transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button>
                        <button onclick="nextQuestion()" ${!state.isSubmitted ? 'disabled' : ''} class="flex-1 max-w-md h-12 rounded-2xl font-black text-xs uppercase tracking-wider shadow-md flex items-center justify-center gap-2 disabled:bg-slate-200 dark:disabled:bg-slate-800 disabled:text-slate-400 dark:disabled:text-slate-600 bg-brand-500 text-white disabled:cursor-not-allowed active:scale-[0.99] transition-all">
                            ${state.currentQuestionIndex === state.questions.length - 1 ? "Xem kết quả" : "Câu tiếp theo"} <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
                        </button>
                    </div>
                </div>`;
        }

        window.addEventListener('DOMContentLoaded', () => { render(); });
    </script>

    <!-- Floating Highlighter Palette (Bút dạ quang - Thiết kế tối ưu cho cả Điện thoại & Máy tính) -->
    <div id="qp-highlighter-toolbar" class="hidden fixed z-[999999] bg-slate-900/95 dark:bg-slate-800/95 text-white backdrop-blur-xl p-2.5 sm:p-3 rounded-2xl shadow-2xl border border-emerald-400/30 select-none animate-enter flex flex-col gap-2 w-[calc(100vw-16px)] max-w-[390px] sm:w-auto sm:max-w-[420px] transition-all duration-150">
        <!-- Hàng 1: Màu dạ quang + Nút Xóa + Nút Đóng -->
        <div class="flex items-center justify-between gap-1.5 sm:gap-2">
            <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap">
                <span class="text-[10px] font-black text-amber-300 flex items-center gap-0.5 shrink-0">
                    <span>✨ Tô nền:</span>
                </span>
                <button type="button" onpointerdown="applyHighlightColor('#fef08a', event)" title="Vàng neon" class="w-6 h-6 sm:w-5 sm:h-5 rounded-full bg-[#fef08a] border-2 border-amber-400 hover:scale-125 transition-transform active:scale-90 cursor-pointer"></button>
                <button type="button" onpointerdown="applyHighlightColor('#bbf7d0', event)" title="Xanh lục" class="w-6 h-6 sm:w-5 sm:h-5 rounded-full bg-[#bbf7d0] border-2 border-emerald-400 hover:scale-125 transition-transform active:scale-90 cursor-pointer"></button>
                <button type="button" onpointerdown="applyHighlightColor('#a5f3fc', event)" title="Xanh ngọc" class="w-6 h-6 sm:w-5 sm:h-5 rounded-full bg-[#a5f3fc] border-2 border-cyan-400 hover:scale-125 transition-transform active:scale-90 cursor-pointer"></button>
                <button type="button" onpointerdown="applyHighlightColor('#fed7aa', event)" title="Cam đào" class="w-6 h-6 sm:w-5 sm:h-5 rounded-full bg-[#fed7aa] border-2 border-orange-400 hover:scale-125 transition-transform active:scale-90 cursor-pointer"></button>
                <button type="button" onpointerdown="applyHighlightColor('#fbcfe8', event)" title="Hồng phấn" class="w-6 h-6 sm:w-5 sm:h-5 rounded-full bg-[#fbcfe8] border-2 border-pink-400 hover:scale-125 transition-transform active:scale-90 cursor-pointer"></button>
            </div>
            
            <div class="flex items-center gap-1 shrink-0 ml-auto">
                <button type="button" onpointerdown="clearSelectionHighlight(event)" title="Xóa đánh dấu & định dạng" class="px-2.5 py-1 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-[10px] font-black transition-all flex items-center gap-1 active:scale-95 shadow-sm cursor-pointer">
                    <span>🧹 Xóa</span>
                </button>
                <button type="button" onpointerdown="hideHighlighterToolbar()" title="Đóng thanh công cụ" class="w-6 h-6 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-black flex items-center justify-center transition-all active:scale-90 cursor-pointer">
                    ✕
                </button>
            </div>
        </div>

        <!-- Hàng 2: Màu chữ & Định dạng in đậm, nghiêng, gạch chân, chữ HOA -->
        <div class="flex items-center justify-between gap-1.5 sm:gap-2 pt-1.5 border-t border-slate-700/70">
            <div class="flex items-center gap-1.5 sm:gap-2">
                <span class="text-[10px] font-black text-sky-300 shrink-0">🎨 Chữ:</span>
                <button type="button" onpointerdown="applyTextColor('#ef4444', event)" title="Chữ đỏ" class="w-5 h-5 sm:w-4 sm:h-4 rounded-full bg-red-500 border border-white/60 hover:scale-125 transition-transform active:scale-90 cursor-pointer"></button>
                <button type="button" onpointerdown="applyTextColor('#3b82f6', event)" title="Chữ xanh dương" class="w-5 h-5 sm:w-4 sm:h-4 rounded-full bg-blue-500 border border-white/60 hover:scale-125 transition-transform active:scale-90 cursor-pointer"></button>
                <button type="button" onpointerdown="applyTextColor('#10b981', event)" title="Chữ xanh lá" class="w-5 h-5 sm:w-4 sm:h-4 rounded-full bg-emerald-500 border border-white/60 hover:scale-125 transition-transform active:scale-90 cursor-pointer"></button>
                <button type="button" onpointerdown="applyTextColor('#f97316', event)" title="Chữ cam" class="w-5 h-5 sm:w-4 sm:h-4 rounded-full bg-orange-500 border border-white/60 hover:scale-125 transition-transform active:scale-90 cursor-pointer"></button>
            </div>
            
            <!-- In đậm, nghiêng, gạch chân, chữ HOA -->
            <div class="flex items-center gap-1 shrink-0 ml-auto">
                <button type="button" onpointerdown="applyTextStyle('bold', event)" title="In đậm (Bold)" class="w-6 h-6 sm:w-5 sm:h-5 rounded-lg bg-slate-800 hover:bg-amber-500 hover:text-black font-black text-[11px] flex items-center justify-center transition-all active:scale-90 cursor-pointer">B</button>
                <button type="button" onpointerdown="applyTextStyle('italic', event)" title="In nghiêng (Italic)" class="w-6 h-6 sm:w-5 sm:h-5 rounded-lg bg-slate-800 hover:bg-amber-500 hover:text-black font-serif italic text-[11px] flex items-center justify-center transition-all active:scale-90 cursor-pointer">I</button>
                <button type="button" onpointerdown="applyTextStyle('underline', event)" title="Gạch chân (Underline)" class="w-6 h-6 sm:w-5 sm:h-5 rounded-lg bg-slate-800 hover:bg-amber-500 hover:text-black underline text-[11px] flex items-center justify-center transition-all active:scale-90 cursor-pointer">U</button>
                <button type="button" onpointerdown="applyTextStyle('uppercase', event)" title="Chữ in HOA" class="px-1.5 h-6 sm:h-5 rounded-lg bg-slate-800 hover:bg-amber-500 hover:text-black font-black text-[9px] flex items-center justify-center transition-all active:scale-90 cursor-pointer">AA</button>
            </div>
        </div>
    </div>

    <!-- Hộp thoại xác nhận tùy chỉnh (Custom Confirm Modal) thiết kế hiện đại có khung viền sang trọng -->
    <div id="custom-confirm-modal" class="hidden fixed inset-0 z-[100000] flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-md animate-enter">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm p-6 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 text-center relative overflow-hidden transition-all scale-100">
            <!-- Vòng trang trí ánh sáng nền -->
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-rose-500/15 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-amber-500/15 rounded-full blur-2xl pointer-events-none"></div>

            <!-- Icon Header -->
            <div id="confirm-icon-box" class="w-14 h-14 mx-auto mb-4 rounded-2xl flex items-center justify-center bg-rose-50 dark:bg-rose-950/50 text-rose-500 dark:text-rose-400 border border-rose-200/80 dark:border-rose-900/60 shadow-inner">
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
            </div>

            <!-- Tiêu đề -->
            <h4 id="confirm-modal-title" class="text-sm font-black uppercase text-slate-800 dark:text-slate-100 tracking-wide mb-2.5">XÓA ĐÁNH DẤU TÔ MÀU</h4>
            
            <!-- Khung viền chứa nội dung thông báo làm nổi bật -->
            <div class="bg-slate-50 dark:bg-slate-800/70 p-3.5 rounded-2xl border border-slate-200/80 dark:border-slate-700/70 mb-5 shadow-xs text-left">
                <p id="confirm-modal-msg" class="text-xs text-slate-700 dark:text-slate-300 font-semibold leading-relaxed break-words text-center"></p>
            </div>

            <!-- Hai nút hành động: Hủy & Xóa -->
            <div class="flex items-center gap-3">
                <button id="confirm-btn-cancel" class="flex-1 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all active:scale-95">Giữ lại</button>
                <button id="confirm-btn-ok" class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-600 hover:to-red-700 text-xs font-black text-white shadow-lg shadow-rose-500/25 transition-all active:scale-95">🗑️ Xóa vết màu</button>
            </div>
        </div>
    </div>

</body>
</html>
